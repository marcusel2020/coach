<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0B0B0C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2300594F'/%3E%3Ctext x='90' y='122' font-size='96' font-family='system-ui' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<title>Coach</title>
<style>
:root{
  color-scheme: dark;
  /* Premium dark — near-black, Aston Martin racing green, white */
  --plane:#0B0B0C; --surface:#17171A; --surface-2:#1F1F23; --raised:#26262B;
  --ink:#FFFFFF; --ink-2:#C9C9C4; --muted:#8C8C88;
  --grid:#26262A; --axis:#33333A; --border:rgba(255,255,255,0.09);
  --hair:rgba(255,255,255,0.055);
  /* Racing green: deep for fills (white sits on it at 8.3:1),
     light for text and icons on dark cards (6.1:1). */
  --green-deep:#00594F; --green:#199B80; --green-dim:#0E3B34;
  --series-1:#199B80;
  --good:#199B80; --warning:#E0A32E; --serious:#E08A5A; --critical:#E05A57;
  --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  padding-top:var(--safe-t); padding-bottom:calc(64px + var(--safe-b));
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-0.015em}
h3{text-transform:none}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:14px;color:var(--ink-2);font-weight:600}
.wrap{padding:16px 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted);font-size:13px}
.sec{color:var(--ink-2);font-size:14px}
.mt{margin-top:12px}.mt2{margin-top:20px}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(11,11,12,0.88);backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--border);padding:calc(var(--safe-t) + 10px) 16px 10px;margin-top:calc(-1 * var(--safe-t))}
header .row{max-width:640px;margin:0 auto}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(11,11,12,0.94);backdrop-filter:saturate(140%) blur(14px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;
  padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--green)}

/* status pill: icon + label, never colour alone */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:3px 9px 3px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.p-good{color:var(--good)}.p-warn{color:var(--warning)}.p-bad{color:var(--critical)}.p-off{color:var(--muted)}

.btn,button.btn{font:inherit;font-weight:600;font-size:15px;border-radius:11px;border:1px solid var(--border);
  background:var(--raised);color:var(--ink);padding:11px 14px;cursor:pointer;width:100%;text-decoration:none}
.btn.primary,button.btn.primary{background:var(--green-deep);border-color:#0A6B5E;color:#fff;letter-spacing:.01em}
.btn.primary:active{background:#00463E}
.btn.ghost,button.btn.ghost{background:transparent}
.btn.danger,button.btn.danger{color:var(--critical);border-color:var(--critical);background:transparent}
.btn:active{opacity:.7}
.btnrow{display:flex;gap:8px}

input,select{font:inherit;font-size:16px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--ink);border-radius:9px;padding:9px 10px;width:100%}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* hero */
.hero{font-size:44px;font-weight:700;letter-spacing:-0.035em;line-height:1.05;color:var(--ink)}
.hero .u{font-size:17px;color:var(--muted);font-weight:600;letter-spacing:0}

/* exercise log */
.ex{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.ex .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex .nm{font-weight:600;font-size:15px;line-height:1.3}
.ex .tgt{font-size:12.5px;color:var(--muted);margin-top:2px}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr;gap:7px;align-items:center;margin-top:8px}
.setrow .n{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.done{border-color:var(--good)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 2px;text-align:center;cursor:pointer}
.day .d{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.day .m{font-size:15px;margin-top:3px;line-height:1}
.day.today{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.ledger{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;gap:10px}
.ledger:last-child{border-bottom:0}

svg.chart{width:100%;display:block;overflow:visible;touch-action:none}
.tip{position:fixed;z-index:50;background:var(--raised);border:1px solid var(--border);border-radius:9px;
  padding:7px 10px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.legendless{font-size:12px;color:var(--muted);margin-top:6px}

/* pose icon + guide sheet */
.poseBtn{flex:none;width:46px;height:46px;border-radius:11px;border:1px solid var(--border);
  background:var(--raised);color:var(--green);padding:5px;cursor:pointer;position:relative}
.poseBtn svg{width:100%;height:100%;display:block}
.poseBtn::after{content:"?";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;
  background:var(--green-deep);color:#fff;font-size:10px;font-weight:800;line-height:15px;text-align:center;
  border:1.5px solid var(--surface-2)}
.poseBtn:active{opacity:.65}
.photoFill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.poseBig{position:relative;overflow:hidden}
.shot:empty{display:none}
.shot img{width:100%;border-radius:14px;display:block;margin-top:14px;border:1px solid var(--hair)}
.shot img[style*="display: none"]{margin-top:0}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheetInner{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:18px 18px calc(24px + var(--safe-b));
  -webkit-overflow-scrolling:touch}
.sheetTop{display:flex;gap:13px;align-items:flex-start}
.poseBig{flex:none;width:66px;height:66px;border-radius:14px;background:var(--green-dim);
  border:1px solid rgba(25,155,128,.35);color:var(--green);padding:7px}
.poseBig svg{width:100%;height:100%;display:block}
.xbtn{flex:none;background:var(--raised);border:1px solid var(--border);color:var(--ink-2);
  width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;line-height:1}
.glist{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);line-height:1.55}
.glist li{margin-bottom:7px}
.glist li::marker{color:var(--green)}
.glist.tip li::marker{content:"▸ "}
.glist.num li::marker{font-weight:700;color:var(--green)}

/* sign-in gate */
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:44px 20px 40px;min-height:62vh;justify-content:center}
.gateMark{width:96px;height:96px;border-radius:26px;background:var(--green-dim);
  border:1px solid rgba(25,155,128,.35);color:var(--green);padding:14px}
.gateMark svg{width:100%;height:100%;display:block}
.linkish{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;
  text-decoration:underline;cursor:pointer;margin-top:26px;padding:6px}
.linkish:active{opacity:.6}

/* week navigator */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:8px 8px;margin-bottom:12px}
.weeknav button{background:var(--raised);border:1px solid var(--border);color:var(--ink);
  width:40px;height:40px;border-radius:11px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.weeknav button:active{opacity:.6}
.weeknav .wl{font-weight:650;font-size:15px;text-align:center}
.weeknav .wd{font-size:12px;color:var(--muted);text-align:center;margin-top:1px}

/* reward ladder */
.rung{border-top:1px solid var(--border);padding:12px 0}
.rung:first-of-type{border-top:0}
.rungTop{display:flex;align-items:center;gap:10px}
.rungDays{font-weight:700;font-size:19px;min-width:56px;color:var(--muted);font-variant-numeric:tabular-nums}
.rungDays span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.rung.hit .rungDays{color:var(--green)}
.rungLabel{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--border);
  border-radius:0;padding:5px 2px;font-size:14.5px;color:var(--ink)}
.rungLabel:focus{outline:none;border-bottom-color:var(--green)}
.bar{height:5px;background:var(--surface-2);border-radius:999px;margin-top:9px;overflow:hidden}
.bar div{height:100%;background:var(--green);border-radius:999px}

/* warm-up / stretch rows + recovery picker */
.wrow{padding:9px 0;border-top:1px solid var(--hair)}
.wrow:first-of-type{border-top:0}
.wa{font-weight:600;font-size:14px}
.wb{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.recRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.recBtn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:10px;padding:10px 2px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.recBtn.on{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.recBtn:active{opacity:.65}

/* set table headers */
.setHead{display:grid;grid-template-columns:22px 1fr 1fr;gap:7px;margin-top:10px;padding:0 2px}
.setHead div{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.setHead div:first-child{text-align:center}
.addSet{background:transparent;border:1px dashed var(--border);color:var(--ink-2);border-radius:9px;
  padding:7px;font:inherit;font-size:12.5px;font-weight:600;width:100%;margin-top:8px;cursor:pointer}
.addSet:active{opacity:.6}
.rung.hit .bar div{background:var(--green)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.fbtn{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:9px 2px 7px;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit}
.fbtn span{font-size:9.5px;font-weight:600;letter-spacing:.01em}
.fbtn.on{color:var(--green);border-color:var(--green);background:var(--green-dim)}
.fbtn:active{opacity:.7}
.swap{display:flex;gap:8px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.swap button{flex:1;font:inherit;font-size:12.5px;font-weight:600;background:transparent;border:1px solid var(--border);
  color:var(--ink-2);border-radius:9px;padding:7px 8px;cursor:pointer}
.swap button:active{opacity:.6}
.swap .step{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}

details{border:1px solid var(--border);border-radius:11px;padding:12px;background:var(--surface);margin-bottom:10px}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";float:right;color:var(--muted);font-size:19px;line-height:1}
details[open] summary::after{content:"⌄"}
.hide{display:none !important}
.banner{border-radius:11px;padding:11px 13px;font-size:13.5px;border:1px solid;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.b-warn{color:var(--warning);border-color:var(--warning)}
.b-bad{color:var(--critical);border-color:var(--critical)}
.b-info{color:var(--ink-2);border-color:var(--border)}
.banner b{color:inherit}
.banner div{min-width:0;overflow-wrap:anywhere}
td.num{overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
  <div class="row">
    <div>
      <h1 id="hdrTitle">Today</h1>
      <div class="muted" id="hdrSub">—</div>
    </div>
    <div id="hdrPill"></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav id="tabs">
  <button data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8v8M19 8v8"/><rect x="2" y="10" width="3" height="4" rx="1"/><rect x="19" y="10" width="3" height="4" rx="1"/></svg>Today</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M21 6v5h-5"/></svg>Progress</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Plan</button>
  <button data-tab="sync"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-13.7 5.7M4 12a8 8 0 0113.7-5.7"/><path d="M17 3v4h-4M7 21v-4h4"/></svg><span style="position:relative">Sync<i id="syncDot" style="position:absolute;top:-1px;right:-8px;width:5px;height:5px;border-radius:50%;background:var(--muted)"></i></span></button>
</nav>

<div class="tip" id="tip"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeGuide()"></div>

<!-- Your Firebase keys. Created once, never overwritten by app updates. -->
<script src="config.js"></script>

<script>
/* ============================================================
   STORAGE — localStorage with in-memory fallback
   ============================================================ */
const Store=(()=>{
  let mem={}, ok=true;
  try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){ok=false;}
  return{
    ok,
    get(k,d){ try{ const v = ok?localStorage.getItem(k):mem[k]; return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ const s=JSON.stringify(v); if(ok)localStorage.setItem(k,s); else mem[k]=s; }catch(e){ mem[k]=JSON.stringify(v); } }
  };
})();

/* ============================================================
   PROGRAMME DEFINITION
   ============================================================ */
let START='2026-08-24';             // Monday of week 1 — overridden per profile
const PROGRAMME_M={
  gymA:{
    id:'gymA', label:'Gym — Lower', sub:'Legs and hinge · main strength session',
    ex:[
      {n:'Back Squat', t:'3 × 5', k:'squat',
       note:'RPE 8 — the main strength driver. Olympic rack. Goblet squat for the first 2–3 weeks if technique needs work.',
       alts:[
        {n:'Linear Hack Squat', note:'Plate-loaded. Same pattern with the back supported — you will handle more load than free-squatting.'},
        {n:'Seated Leg Press',  note:'Fewer stabiliser demands, so go heavier. Full range, do not bounce out of the bottom.'},
        {n:'Goblet Squat',      note:'DB at chest, free weights area. Grip limits load, so run 3 × 10 instead.'}
       ]},
      {n:'Dumbbell Romanian Deadlift', t:'3 × 6', k:'rdl',
       note:'RPE 7 — controlled, not to failure. Hinge at the hip, soft knees, feel the hamstrings load.',
       alts:[
        {n:'Barbell RDL',            note:'Same movement off the rack. Better once your form is grooved.'},
        {n:'Single-leg DB RDL',      note:'3 × 8/leg with a lighter DB. Adds a balance demand that carries to cutting.'},
        {n:'Seated Leg Curl',        note:'Machine. Knee-flexion rather than a hinge — different emphasis, but it still trains the hamstrings.'}
       ]},
      {n:'Chest Press', t:'3 × 8', k:'chest',
       note:'Assisted/pin-loaded machine. Controlled down, drive up.',
       alts:[
        {n:'DB Bench Press',    note:'Adjustable bench, flat. More stabiliser work than the machine.'},
        {n:'Incline Press',     note:'Plate-loaded. More upper chest and shoulder.'},
        {n:'Barbell Bench Press', note:'Raised bench press station. Use a spotter or stay well short of failure.'}
       ]},
      {n:'Lat Pulldown', t:'3 × 8', k:'pull',
       note:'Pin-loaded. Pull to the collarbone, elbows down rather than back.',
       alts:[
        {n:'Assisted Chin-up', note:'Machine. Closer to the real thing — use the least assistance you can manage.'},
        {n:'Pulldown (other station)', note:'The second pulldown machine — same pattern, different handle.'},
        {n:'Cable Low Row',    note:'Horizontal rather than vertical pull. Not identical, but it keeps the back working.'}
       ]},
      {n:'Pallof Press', t:'2 × 10/side', k:'pallof',
       note:'Cable at chest height. Resist the rotation — that is the whole exercise.',
       alts:[
        {n:'Cable Crossover (single arm)', note:'Set one side at chest height. Same anti-rotation demand.'},
        {n:'Abdominal Machine',           note:'Flexion rather than anti-rotation. A lesser substitute, but it beats nothing.'},
        {n:'Dead Bug',                    note:'Floor, no equipment. 2 × 10/side, slow. Never unavailable.'}
       ]}
    ],
    tip:'Friday sits 3 days before Monday’s game — the most recovery any slot gives your legs before the session that matters most. You are 24h off Thursday’s game so you will not feel fresh; train to a solid RPE 8, do not chase a PR on tired legs.'
  },
  gymB:{
    id:'gymB', label:'Gym — Upper', sub:'Push and pull · legs kept fresh',
    ex:[
      {n:'Shoulder Press', t:'3 × 6–8', k:'ohp',
       note:'Pin-loaded machine. Press without letting the ribs flare.',
       alts:[
        {n:'DB Overhead Press',  note:'Seated, adjustable bench upright. More stabiliser demand.'},
        {n:'Incline Press (steep)', note:'Plate-loaded at the steepest setting — close to an overhead press.'},
        {n:'Standing Barbell Press', note:'From the rack. Hardest version, so drop the load.'}
       ]},
      {n:'Seated Row', t:'3 × 8–10', k:'row',
       note:'Pin-loaded. Chest tall, pull to the stomach, squeeze briefly.',
       alts:[
        {n:'Cable Low Row',      note:'Same movement, cable resistance. Do not lean back to move the weight.'},
        {n:'Plate-loaded Row',   note:'Chest-supported. Takes the lower back out of it entirely.'},
        {n:'Single-arm DB Row',  note:'Hand on a bench, 3 × 10/arm. Also evens out side-to-side differences.'}
       ]},
      {n:'Assisted Dip', t:'3 × 8–10', k:'push2',
       note:'Second push movement. Use the least assistance you can control.',
       alts:[
        {n:'Chest Press',   note:'Machine. Straightforward swap.'},
        {n:'Incline Press', note:'Plate-loaded. Shifts emphasis higher on the chest.'},
        {n:'DB Bench Press', note:'Adjustable bench, flat.'}
       ]},
      {n:'Standing DB Calf Raise', t:'3 × 12–15', k:'calf',
       note:'Full stretch at the bottom, pause at the top. Direct ankle resilience.',
       alts:[
        {n:'Leg Press Calf Raise', note:'Toes on the edge of the seated leg press platform. Easy to load heavy.'},
        {n:'Single-leg Step Calf Raise', note:'Bodyweight off a step, 3 × 12/leg. Needs nothing at all.'}
       ]},
      {n:'Farmer’s Carry', t:'2 × 20–30m', k:'carry',
       note:'Heavy DBs or kettlebells. Tall posture, brace, walk. Grip and trunk with minimal leg cost.',

/* ============================================================
   SCORING  — the accountability engine
   ------------------------------------------------------------
   Four core commitments a week (Mon bball, Tue Upper, Thu bball, Fri Lower).
   3 of 4  → on track. One miss is free, by design.
   ≤2 of 4 → off track.
   A week flagged as away in advance is excused entirely.
   Consecutive off-track weeks escalate ×1 → ×1.5 → ×2 (capped).
   ============================================================ */
const notStarted=()=>todayISO()<START_FOR();
const daysToStart=()=>Math.max(0,Math.round((parse(START_FOR())-parse(todayISO()))/86400000));

function weekStatus(mondayISO){
  const m=parse(mondayISO), today=todayISO();
  const days=[...Array(7)].map((_,i)=>iso(addD(m,i)));
  if(activeProfile().setup) return{state:'setup',hit:0,of:0,days,complete:false};
  const beforeProgramme=days[6]<START_FOR();             // week ends before the programme begins
  if(beforeProgramme) return{state:'prestart',hit:0,of:4,days};
  const started=days[0]<=today;
  if(!started) return{state:'planned',hit:0,of:4,days};
  if(weekAway(mondayISO)) return{state:'away',hit:0,of:4,days,complete:days[6]<today,partial:true};

  let hit=0, due=0;
  CORE.forEach(c=>{
    const off=(c.dow+6)%7;           // convert Sun-start dow to Mon-start index
    const ds=days[off];
    if(isAway(ds)) return;           // excused day doesn't count against you
    if(ds<today) due++;          // today isn't a miss until the day is over
    const e=DB.log[ds];
    // Gym sessions count wherever in the week you actually did them —
    // the day is a default, not a requirement. Basketball is date-fixed.
    if(c.type==='gymA'||c.type==='gymB'){
      if(days.some(dd=>{const x=DB.log[dd];return x&&x.done&&x.type===c.type;})) hit++;
    } else if(e&&e.done) hit++;
  });

  const of=Math.max(1,CORE.filter(c=>!isAway(days[(c.dow+6)%7])).length);
  const complete=days[6]<today;
  let state;
  if(!complete) state = hit>=3?'ontrack' : (due-hit)>=2 ? 'slipping' : 'inprogress';
  else state = hit>=of-1 ? 'ontrack' : 'offtrack';
  return{state,hit,of,due,days,complete,partial:weekPartlyAway(mondayISO)};
}

function allWeeks(){
  START=START_FOR();
  const first=monOf(parse(START)), now=monOf(new Date()), out=[];
  const from = now<first ? now : first;          // handles being a day or two before start
  for(let d=new Date(from); d<=now; d=addD(d,7)) out.push(iso(d));
  if(!out.length) out.push(iso(now));
  return out;
}

/* ============================================================
   MEMBERSHIP ECONOMICS
   ------------------------------------------------------------
   Not a forfeit — a utilisation read. Sunk cost does not drive
   behaviour, but knowing your real cost-per-visit does tell you
   honestly whether the membership is earning its place.
   ============================================================ */
const CLUB_TYPES=['gymA','gymB','flexGym'];

function clubVisits(){
  const m=DB.membership, out=[];
  Object.keys(DB.log).forEach(d=>{
    const e=DB.log[d];
    if(e&&e.done&&CLUB_TYPES.includes(e.type)&&d>=m.start) out.push({date:d,type:e.type});
  });
  (DB.visits||[]).forEach(v=>{ if(v.date>=m.start) out.push(v); });
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

function membershipStats(){
  const m=DB.membership, t=todayISO();
  const v=clubVisits();
  const days=Math.max(1,Math.round((parse(t)-parse(m.start))/86400000)+1);
  // The whole year's cost, divided by visits so far. Starts enormous, falls every
  // time you turn up. That fall IS the metric.
  const basis = m.basis==='total' ? m.annualCost : m.myShare;
  const costPer = v.length ? basis/v.length : null;
  const perDay=v.length/days;
  const projected=Math.max(v.length,Math.round(perDay*365));
  const projCostPer = projected ? basis/projected : null;
  const target=m.targetPerVisit||15;
  const visitsNeeded=Math.ceil(basis/target);
  const stillNeeded=Math.max(0,visitsNeeded-v.length);
  const perWeekNeeded=visitsNeeded/52;
  const altAnnual=m.altMonthly*12;
  const premium=basis-altAnnual;
  const thisMonth=v.filter(x=>x.date.slice(0,7)===t.slice(0,7)).length;
  // what one more visit does to the number
  const nextCostPer = basis/(v.length+1);
  return{visits:v,days,basis,costPer,projected,projCostPer,thisMonth,
         altAnnual,premium,target,visitsNeeded,stillNeeded,perWeekNeeded,nextCostPer};
}

const GUIDE={
'Back Squat':{pose:'squat',kit:'Hammer Strength rack + Olympic bar',

const guideFor=n=>GUIDE[n]||null;

/* Photos live in /img as <slug>.jpg. If one is missing the drawn
   diagram shows through instead, so the app never breaks on a gap. */
const slug=n=>n.toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function exImg(name,cls){
  return `<img class="${cls}" src="img/${slug(name)}.jpg" alt="" loading="lazy"
     onerror="this.style.display='none'">`;
}

function openGuide(name){
  const g=guideFor(name); if(!g) return;
  const el=document.getElementById('sheet');
  el.innerHTML=`<div class="sheetInner">
    <div class="sheetTop">
      <div class="poseBig">${POSE[g.pose]?`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${POSE[g.pose]}</svg>`:''}${exImg(name,'photoFill')}</div>
      <div style="flex:1;min-width:0">
        <h2>${name}</h2>
        <div class="muted">${g.kit}</div>
      </div>
      <button class="xbtn" onclick="closeGuide()" aria-label="Close">✕</button>
    </div>
    <div class="shot">${exImg(name,'photoWide')}</div>
    <a class="btn primary" style="display:block;text-align:center;text-decoration:none;margin:14px 0 4px"
       href="https://www.youtube.com/results?search_query=${encodeURIComponent(g.watch)}" target="_blank" rel="noopener">▶ Watch how it is done</a>
    <div class="muted" style="text-align:center;margin-bottom:16px">Opens a YouTube search — pick any clear demo</div>
    <h3 style="margin-bottom:6px">Set up</h3>
    <ul class="glist">${g.setup.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h3 style="margin:16px 0 6px">Step by step</h3>

function closeGuide(){

}
window.openGuide=openGuide; window.closeGuide=closeGuide;
function poseIcon(name){
  const g=guideFor(name);
  if(!g||!POSE[g.pose]) return '';
  return `<button class="poseBtn" onclick="event.stopPropagation();openGuide(${JSON.stringify(name).replace(/"/g,'&quot;')})" aria-label="How to do ${name}">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${POSE[g.pose]}</svg>
    ${exImg(name,'photoFill')}

}

const I={
  check:'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  alert:'<svg viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  plane:'<svg viewBox="0 0 24 24"><path d="M17 3l4 4-7 5 1 8-2 1-3-7-5 2-1 3-2-1 1-5-5-3 1-2 8 1z"/></svg>',
  dot:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.1L12 17.8 6.4 20l1.2-6.1L3 9.6l6.3-.8z"/></svg>'
};
function pill(state){
  const M={
    ontrack:  ['p-good','check','On track'],
    inprogress:['p-off','dot','In progress'],
    slipping: ['p-warn','alert','Slipping'],
    offtrack: ['p-bad','x','Off track'],
    away:     ['p-off','plane','Away'],
    future:   ['p-off','dot','Upcoming'],
    prestart: ['p-off','dot','Before start'],
    planned:  ['p-off','dot','Planned'],
    starting: ['p-good','check','Starts tomorrow'],
    soon:     ['p-good','check','Starting soon'],
    bonus:    ['p-good','star','Bonus'],
    setup:    ['p-off','dot','Not set up']
  }[state]||['p-off','dot','—'];
  return `<span class="pill ${M[0]}">${I[M[1]]}${M[2]}</span>`;
}

let TAB='today';
let WEEKOFF=0;   // 0 = this week, -1 last, +1 next
let MORE=null;   // which sub-page of the ••• tab is open
const view=document.getElementById('view');

function render(){
  if(gateActive()){ renderGate(); return; }
  document.getElementById('tabs').classList.remove('hide');
  const ws=weekStatus(weekKey(new Date()));
  const pre = notStarted();
  document.getElementById('hdrPill').innerHTML =
    pre ? pill(daysToStart()===1?'starting':'soon') : pill(ws.state);
  const MT={reward:'Reward ladder',membership:'Membership',records:'Personal records',
            fuel:'Nutrition',review:'Progress review',niggles:'Niggles',random:'Random workout',
            log:'Log an activity'};
  const T={today:'Today',week:'This week',progress:'Progress',
           more:MORE?MT[MORE]:'More',plan:'The plan',sync:'Sync'};
  document.getElementById('hdrTitle').textContent=T[TAB];
  document.getElementById('hdrSub').textContent=
    TAB==='today' ? new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})
    : pre ? (daysToStart()===1?'Week 1 starts tomorrow':`Week 1 starts in ${daysToStart()} days`)
    : weekTitle(new Date());
  if(TAB==='more'){ MORE?({reward:vReward,membership:vMembership,records:vRecords,
      fuel:vFuel,review:vReview,niggles:vNiggles,random:vRandom,log:vLog})[MORE]() : vMore(); }
  else ({today:vToday,week:vWeek,progress:vProgress,plan:vPlan,sync:vSync})[TAB]();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===TAB));
}

/* ---------- TODAY ---------- */
function vToday(){
  const ds=todayISO(), d=new Date();
  const away=isAway(ds);
  const type=away?'rest':SCHEDULE[d.getDay()];
  const S=PROGRAMME[type];
  const e=DB.log[ds]||{};
  const isGym=type==='gymA'||type==='gymB';
  const ws=weekStatus(weekKey(d));

  let h='';

  if(away){
    h+=`<div class="banner b-info">${I.plane}<div><b>Flagged as away.</b> This day is excused — it will not count against your consistency.</div></div>`;
  } else if(notStarted()){
    const P=activeProfile();
    h+=`<div class="banner b-info" style="color:var(--green);border-color:var(--green)">${I.check}<div>
      <b>Week 1 starts ${daysToStart()===1?'tomorrow':`in ${daysToStart()} days`} — Monday ${fmtD(START_FOR()).replace(/^\w+, /,'')}.</b>
      ${P.setup?'':'First session is Monday basketball. '}Nothing counts until then, so today is a clean slate.
      Worth doing now: log your weight, and get a baseline Body Hub scan if you can.</div></div>`;
  } else if(ws.state==='slipping'){
    h+=`<div class="banner b-warn">${I.alert}<div><b>You are two sessions down this week.</b> One more miss and the week is off track. Going away? Flag it on the Membership tab <em>before</em> the week ends.</div></div>`;
  }

  if(activeProfile().setup){
    h+=`<div class="banner b-info">${I.alert}<div><b>${activeProfile().name}, your programme has not been built yet.</b>
      Nothing is scheduled and nothing is being scored — no week will ever show as off track until a plan exists.
      Logging your weight and any extras still works, and it all carries over once the programme is added.</div></div>`;
  }

  h+=`<div class="card">
    <div class="row"><div>
      <h2>${S.label}</h2><div class="sec">${S.sub}</div>
    </div>${e.done?pill('ontrack'):''}</div>
    ${S.tip?`<div class="note">${S.tip}</div>`:''}
  </div>`;

  if(isGym||(e.type==='gymA'||e.type==='gymB')){
    const key=e.type||type, prog=PROGRAMME[key];
    if(prog&&prog.ex.length){
      const wk=warmKind(key);
      h+=warmupBlock(wk);
      h+=`<h3 class="mt2" style="margin-bottom:8px">Log your sets</h3>`;
      prog.ex.forEach(x=>{
        const nAlts=(x.alts||[]).length;
        const vi=variantIdx(ds,x.k);
        const V=exVariant(x,vi);
        const sets=(e.sets&&e.sets[x.k])||[];
        const last=lastFor(x.k,ds,vi);
        const targetReps=(x.t.match(/×\s*([\d–—-]+)/)||[])[1]||'';
        const recW = last?last.w:'';
        const nRows = Math.max(3,sets.length+ (sets.length>=3?1:0));
        h+=`<div class="ex${sets.length?' done':''}">
          <div class="top">
            <div style="flex:1;min-width:0">
              <div class="nm">${V.n}${vi?` <span class="muted" style="font-weight:600">· sub ${vi}</span>`:''}</div>
              <div class="tgt">${x.t}${last?` · last: ${last.w}kg × ${last.r}`:''}</div>
            </div>
            ${poseIcon(V.n)}
          </div>
          <div class="setHead"><div>Set</div><div>Weight (kg)</div><div>Reps</div></div>
          ${Array.from({length:nRows}).map((_,i)=>`<div class="setrow">
            <div class="n">${i+1}</div>
            <input inputmode="decimal" placeholder="${recW||'—'}" value="${sets[i]?.w??''}" onchange="setLog('${x.k}',${i},'w',this.value)">
            <input inputmode="numeric" placeholder="${targetReps||'—'}" value="${sets[i]?.r??''}" onchange="setLog('${x.k}',${i},'r',this.value)">
          </div>`).join('')}
          <button class="addSet" onclick="addSetRow('${x.k}')">+ Add a set</button>
          <div class="note">${V.note}</div>
          ${nAlts?`<div class="swap">
            ${vi<nAlts
              ? `<button onclick="bumpVariant('${ds}','${x.k}',${nAlts})">Taken — swap it</button>
                 <span class="step">${nAlts-vi} left</span>`
              : `<span class="step" style="color:var(--warning);white-space:normal">All ${nAlts} alternatives gone — the gym is rammed. Do something equivalent and log it here.</span>`}
            ${vi?`<button onclick="resetVariant('${ds}','${x.k}')">Back to ${x.n}</button>`:''}
          </div>`:''}
        </div>`;
      });

      // anything extra you did on top of the plan
      const extras=(e.extraEx||[]);
      if(extras.length){
        h+=`<h3 class="mt2" style="margin-bottom:8px">Extra — on top of the plan ★</h3>`;
        extras.forEach((x,xi)=>{
          const sets=(e.sets&&e.sets[x.k])||[];
          const lastX=lastFor(x.k,ds,0);
          const rows=Math.max(3,sets.length+(sets.length>=3?1:0));
          h+=`<div class="ex${sets.length?' done':''}">
            <div class="top">
              <div style="flex:1;min-width:0">
                <div class="nm">${x.n}</div>
                <div class="tgt">Extra${lastX?` · last: ${lastX.w}kg × ${lastX.r}`:''}</div>
              </div>
              ${poseIcon(x.n)}
            </div>
            <div class="setHead"><div>Set</div><div>Weight (kg)</div><div>Reps</div></div>
            ${Array.from({length:rows}).map((_,i)=>`<div class="setrow">
              <div class="n">${i+1}</div>
              <input inputmode="decimal" placeholder="${lastX?lastX.w:'—'}" value="${sets[i]?.w??''}" onchange="setLog('${x.k}',${i},'w',this.value)">
              <input inputmode="numeric" placeholder="—" value="${sets[i]?.r??''}" onchange="setLog('${x.k}',${i},'r',this.value)">
            </div>`).join('')}
            <button class="addSet" onclick="addSetRow('${x.k}')">+ Add a set</button>
            <div class="swap"><button onclick="rmExtraEx(${xi})">Remove this exercise</button></div>
          </div>`;
        });
      }
      h+=`<details><summary>+ Add an exercise</summary>
        <div class="sec mt" style="margin-bottom:8px">Did something extra — a machine you fancied, an accessory lift? Add it here and it logs like the rest. It earns a ★ and never changes your session score.</div>
        <label class="f">Exercise</label>
        <select id="xPick">${Object.keys(GUIDE).sort().map(n=>`<option>${n}</option>`).join('')}</select>
        <button class="btn mt" onclick="addExtraEx()">Add it</button>
      </details>`;

      h+=stretchBlock(warmKind(key));
      h+=recoveryBlock(ds);

      // session feedback
      h+=`<div class="card"><h3>How was that?</h3>
        <div class="sec mt" style="margin-bottom:2px">Difficulty</div>
        ${feelScale(ds,'rpe','diff')}
        <div class="sec" style="margin-top:14px;margin-bottom:2px">How you felt</div>
        ${feelScale(ds,'mood','mood')}
        <div class="note">Two different things: how hard the session was, and how you felt doing it. Difficulty creeping up while mood drops is the pattern worth catching early.</div>
      </div>`;
    }
  }

  if(type==='bball'){
    h+=`<div class="card"><h3>How was that?</h3>
      <div class="sec mt" style="margin-bottom:2px">Difficulty</div>
      ${feelScale(ds,'rpe','diff')}
      <div class="sec" style="margin-top:14px;margin-bottom:2px">How you felt</div>
      ${feelScale(ds,'mood','mood')}
      <div class="note">Legs flat on a Thursday is the clearest sign the week is carrying too much fatigue.</div>
    </div>`;
  }

  if(type!=='open'&&type!=='rest'&&type!=='tba'){
    h+=`<button class="btn ${e.done?'':'primary'}" onclick="toggleDone()">${e.done?'Completed ✓ — tap to undo':'Mark complete'}</button>`;
  }

  // ---- Optional extras: credit only, never a penalty ----
  const done=bonusOn(ds);
  const suggested=SUGGEST[d.getDay()]||[];
  const others=Object.keys(BONUS).filter(k=>!suggested.includes(k));

  if(done.length){
    h+=`<div class="banner b-info" style="color:var(--good);border-color:var(--good)">${I.star}<div>
      <b>Above and beyond.</b> ${done.map(k=>BONUS[k].label).join(' + ')} logged today — none of this was required. ${bonusThisWeek()} extra${bonusThisWeek()===1?'':'s'} this week.
    </div></div>`;
  }

  h+=`<div class="card"><div class="row"><h3>Optional extras</h3>
      <span class="muted">Bonus only — skipping costs nothing</span></div>`;
  if(suggested.length){
    h+=`<div class="sec mt" style="margin-bottom:8px">Suggested today</div>`;
    suggested.forEach(k=>{
      const on=done.includes(k);
      h+=`<div class="ex${on?' done':''}" style="cursor:pointer" onclick="toggleBonus('${ds}','${k}')">
        <div class="top"><div>
          <div class="nm">${on?'★ ':''}${BONUS[k].label}</div>
          <div class="tgt">${BONUS[k].sub}</div>
        </div>${on?pill('bonus'):`<span class="pill p-off">${I.star}Add</span>`}</div>
      </div>`;
    });
  }
  h+=`<button class="btn mt" onclick="openMore('log')">Log a run, swim or class — with details</button>`;
  h+=`<details style="margin-top:8px"><summary>Quick tick — no details</summary>
    <div class="mt">${others.map(k=>{
      const on=done.includes(k);
      return `<div class="ex${on?' done':''}" style="cursor:pointer" onclick="toggleBonus('${ds}','${k}')">
        <div class="top"><div><div class="nm">${on?'★ ':''}${BONUS[k].label}</div>
        <div class="tgt">${BONUS[k].sub}</div></div>
        ${on?pill('bonus'):`<span class="pill p-off">${I.star}Add</span>`}</div></div>`;}).join('')}</div>
  </details>`;
  h+=`</div>`;


  // weight
  const w=DB.weights[ds];
  h+=`<div class="card mt2"><h3>Morning weight</h3>
    <div class="row mt" style="gap:8px">
      <input id="wIn" inputmode="decimal" placeholder="lb" value="${w??''}" style="flex:1">
      <button class="btn primary" style="width:auto;padding:11px 18px" onclick="submitWeight()">${w!=null?'Update':'Log'}</button>
    </div>
    <div class="muted mt">${w!=null?`Logged today: ${w} lb · `:''}${trendTxt()}</div>
    <div class="note">Same conditions each time — after the bathroom, before food. Single readings mean little; the 7-day average is the signal.</div>
  </div>`;

  const bf=DB.bodyfat[ds], lastBf=lastBodyFat(ds);
  h+=`<details><summary>Body Hub scan${bf?` · ${bf}%`:''}</summary>
    <div class="mt"><label class="f">Body fat %</label>
    <input inputmode="decimal" placeholder="%" value="${bf??''}" onchange="logBodyFat(this.value)"></div>
    ${lastBf?`<div class="muted" style="margin-top:6px">Last scan: ${lastBf.v}% on ${fmtD(lastBf.d)}</div>`:''}
    <div class="note">Monthly, not weekly — these readings bounce around day to day. This is the only measure that separates fat loss from muscle loss, which the scale cannot do.</div>
  </details>`;

  // nutrition reference
  if(activeProfile().nutrition) h+=`<details><summary>Daily nutrition targets</summary>
    <table class="mt"><tbody>
      <tr><td>Calories</td><td class="num">${NUTRITION.kcal} kcal</td></tr>
      <tr><td>Protein</td><td class="num">${NUTRITION.protein} g</td></tr>
      <tr><td>Fat</td><td class="num">${NUTRITION.fat} g</td></tr>
      <tr><td>Carbs</td><td class="num">${NUTRITION.carbs} g</td></tr>
    </tbody></table>
    <div class="note">Log in MyFitnessPal. Protein is the one to hit consistently — it protects muscle while you are in a deficit.</div>
  </details>`;

  view.innerHTML=h;
}

function lastFor(k,before,variant){
  const ds=Object.keys(DB.log).filter(d=>d<before).sort().reverse();
  for(const d of ds){
    const rec=DB.log[d]; const st=rec?.sets?.[k];
    if(!st||!st.length||!st[0].w) continue;
    const v=(rec.variant&&rec.variant[k])||0;
    if(variant!==undefined&&v!==variant) continue;   // only compare the same movement
    return st[0];
  }
  return null;
}
window.addExtraEx=()=>{
  const n=document.getElementById('xPick').value, ds=todayISO();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[new Date().getDay()],sets:{}});
  e.extraEx=e.extraEx||[];
  if(e.extraEx.some(x=>x.n===n)) return;
  e.extraEx.push({n,k:'x_'+slug(n)});
  const cur=new Set(bonusOn(ds)); cur.add('extra');
  DB.bonus=DB.bonus||{}; DB.bonus[ds]=[...cur];
  save(); render();
};
window.rmExtraEx=i=>{
  const ds=todayISO(), e=DB.log[ds];
  const gone=e.extraEx.splice(i,1)[0];
  if(e.sets) delete e.sets[gone.k];
  if(!e.extraEx.length&&DB.bonus[ds]){
    const cur=new Set(DB.bonus[ds]); cur.delete('extra');
    if(cur.size) DB.bonus[ds]=[...cur]; else delete DB.bonus[ds];
  }
  save(); render();
};
window.addSetRow=k=>{
  const ds=todayISO();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[new Date().getDay()],sets:{}});
  e.sets=e.sets||{}; e.sets[k]=e.sets[k]||[];
  while(e.sets[k].length<3) e.sets[k].push({});
  e.sets[k].push({});
  save(); render();
};
window.setLog=(k,i,f,v)=>{
  const ds=todayISO();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[new Date().getDay()],sets:{}});
  e.sets=e.sets||{}; e.sets[k]=e.sets[k]||[];
  e.sets[k][i]=e.sets[k][i]||{}; e.sets[k][i][f]=v;
  save();
};
window.toggleDone=()=>{
  const ds=todayISO();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[new Date().getDay()],sets:{}});
  e.done=!e.done; save(); render();
};
window.mark=t=>{
  const ds=todayISO();
  DB.log[ds]={...(DB.log[ds]||{}),type:t,done:t!=='rest',sets:DB.log[ds]?.sets||{}};
  save(); render();
};
function lastBodyFat(before){
  const ds=Object.keys(DB.bodyfat||{}).filter(d=>d<before).sort().reverse();
  return ds.length?{d:ds[0],v:DB.bodyfat[ds[0]]}:null;
}
window.logBodyFat=v=>{
  const ds=todayISO(), n=parseFloat(v);
  if(isNaN(n)) delete DB.bodyfat[ds]; else DB.bodyfat[ds]=n;
  save(); render();
};
window.submitWeight=()=>{
  const el=document.getElementById('wIn'); if(!el) return;
  const ds=todayISO(), n=parseFloat(el.value);
  if(isNaN(n)) delete DB.weights[ds]; else DB.weights[ds]=Math.round(n*10)/10;
  save(); render();
};

function avg7(end){
  const e=parse(end),v=[];
  for(let i=0;i<7;i++){const k=DB.weights[iso(addD(e,-i))];if(k!=null)v.push(k);}
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function trendTxt(){
  const now=avg7(todayISO()), then=avg7(iso(addD(new Date(),-14)));
  if(now==null) return 'No data yet';
  if(then==null) return `7-day avg ${now.toFixed(1)}lb`;
  const d=now-then;
  return `7-day avg ${now.toFixed(1)}lb · ${d>0?'+':''}${d.toFixed(1)}lb /2wk`;
}

/* ---------- WEEK ---------- */
function vWeek(){
  const base=monOf(new Date());
  const mon=addD(base,WEEKOFF*7);
  const wk=iso(mon), s=weekStatus(wk), t=todayISO();
  const wn=weekNum(mon);
  const label = WEEKOFF===0?'This week':WEEKOFF===-1?'Last week':WEEKOFF===1?'Next week'
    :WEEKOFF<0?`${-WEEKOFF} weeks ago`:`In ${WEEKOFF} weeks`;
  const future = wk>iso(base);

  let h=`<div class="weeknav">
    <button onclick="shiftWeek(-1)" aria-label="Previous week">‹</button>
    <div>
      <div class="wl">${label}</div>
      <div class="wd">${fmtD(wk).replace(/^\w+, /,'')} – ${fmtD(iso(addD(mon,6))).replace(/^\w+, /,'')}</div>
    </div>
    <button onclick="shiftWeek(1)" aria-label="Next week">›</button>
  </div>`;
  if(WEEKOFF!==0) h+=`<button class="btn ghost" style="margin-bottom:12px" onclick="shiftWeek(0,true)">Back to this week</button>`;

  h+=`<div class="card">
    <div class="row"><div><h2>${weekTitle(mon)}</h2>
    <div class="sec">${s.state==='setup'?'Programme not built yet'
      : future?'Planned — nothing logged yet'
      : `${s.hit} of ${s.of} core sessions`}</div></div>${pill(s.state)}</div>
    <div class="week mt">${s.days.map(ds=>{
      const dd=parse(ds), ty=isAway(ds)?'rest':SCHEDULE[dd.getDay()], e=DB.log[ds]||{};
      const bn=bonusOn(ds).length;
      const before=ds<START_FOR();
      const m=before?'·':isAway(ds)?'✈︎':e.done?'✓':bn?'★':ds<t?(ty==='open'||ty==='rest'||ty==='tba'?'—':'·'):(ty==='rest'||ty==='open'||ty==='tba')?'—':'○';
      return `<div class="day${ds===t?' today':''}"><div class="d">${DOW[dd.getDay()][0]}</div><div class="m">${m}</div></div>`;
    }).join('')}</div>
    <div class="legendless">✓ done · ★ bonus extra · ○ upcoming · · nothing required · — rest · ✈︎ away</div>
    ${(!future&&bonusCountWeek(wk))?`<div class="banner b-info mt" style="color:var(--good);border-color:var(--good)">${I.star}<div><b>${bonusCountWeek(wk)} extra${bonusCountWeek(wk)===1?'':'s'}</b> that week on top of the plan.</div></div>`:''}
  </div>`;

  h+=`<h3 class="mt2" style="margin-bottom:8px">${future?'Planned':'Schedule'}</h3>`;
  const scored = s.state!=='future'&&s.state!=='setup';
  s.days.forEach(ds=>{
    const dd=parse(ds), away=isAway(ds), ty=away?'rest':SCHEDULE[dd.getDay()];
    const P=PROGRAMME[ty], e=DB.log[ds]||{};
    const swapped = e.type && e.type!==ty ? PROGRAMME[e.type] : null;
    const core=CORE.some(c=>((c.dow+6)%7)===((dd.getDay()+6)%7)&&!away);
    const sug=(SUGGEST[dd.getDay()]||[]).map(k=>BONUS[k].label);
    h+=`<div class="card tight"><div class="row">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14.5px">${DOW[dd.getDay()]} · ${P.label}</div>
        <div class="muted">${away?'Flagged away':P.sub}${core?' · counts toward your week':''}</div>
        ${swapped?`<div class="muted">Logged instead: ${swapped.label}</div>`:''}

/* ---------- CHARTS ---------- */
// Single series → no legend box; the title names it. One hue, 2px line, 8px markers.
function weightChart(){
  const pts=Object.keys(DB.weights).sort().map(d=>({d,v:DB.weights[d]}));
  if(pts.length<2) return `<h3>Weight trend</h3><div class="muted mt">Log at least two mornings to see a trend.</div>`;
  const W=560,H=170,P={t:12,r:14,b:24,l:34};
  const xs=pts.map(p=>parse(p.d).getTime()), vs=pts.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  let v0=Math.min(...vs),v1=Math.max(...vs); const pad=Math.max(0.6,(v1-v0)*0.18); v0-=pad;v1+=pad;
  const X=t=>P.l+((t-x0)/((x1-x0)||1))*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-v0)/((v1-v0)||1))*(H-P.t-P.b);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(parse(p.d).getTime()).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const ticks=[v0+(v1-v0)*0.15,(v0+v1)/2,v1-(v1-v0)*0.15];
  return `<h3>Weight trend <span class="muted" style="font-weight:400">· lb, daily</span></h3>
  <svg class="chart" id="wc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Body weight over time">
    ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${P.l-7}" y="${(Y(t)+4).toFixed(1)}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="system-ui">${t.toFixed(1)}</text>`).join('')}
    <line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--axis)" stroke-width="1"/>
    <path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(parse(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"
       fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" data-d="${p.d}" data-v="${p.v}"/>`).join('')}
    <text x="${P.l}" y="${H-6}" fill="var(--muted)" font-size="11" font-family="system-ui">${fmtD(pts[0].d)}</text>
    <text x="${W-P.r}" y="${H-6}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="system-ui">${fmtD(pts[pts.length-1].d)}</text>
  </svg>`;
}

// Status colours + always a text label under each bar — never colour alone.
function consistencyChart(){
  const ws=allWeeks();
  const done=ws.filter(w=>{const s=weekStatus(w);return s.state!=='future';});
  if(!done.length) return `<h3>Weekly consistency</h3><div class="muted mt">Your first week has not started yet. Bars appear here once sessions are logged.</div>`;
  const show=done.slice(-12);

  <div style="display:flex;gap:4px;align-items:flex-end;height:92px;margin-top:14px">
    ${show.map(w=>{const s=weekStatus(w);
      const c=s.state==='away'?'var(--muted)':s.state==='offtrack'?'var(--critical)':s.state==='slipping'?'var(--warning)':s.state==='ontrack'?'var(--good)':'var(--axis)';
      const hgt=Math.max(6,(s.hit/Math.max(1,s.of))*78);
      return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px">
        <div style="width:100%;height:${hgt}px;background:${c};border-radius:4px 4px 0 0" title="${weekTitle(parse(w))}: ${s.hit}/${s.of}"></div>
        <div style="font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums">${s.state==='away'?'✈︎':s.hit}</div>
      </div>`;}).join('')}
  </div>
  <div class="legendless">Number under each bar = core sessions completed that week (out of 4). ✈︎ = flagged away.</div>`;
}

function wireChart(){
  const svg=document.getElementById('wc'), tip=document.getElementById('tip');
  if(!svg) return;
  const dots=[...svg.querySelectorAll('circle')];
  const move=ev=>{
    const p=ev.touches?ev.touches[0]:ev, r=svg.getBoundingClientRect();
    let best=null,bd=1e9;
    dots.forEach(c=>{const cr=c.getBoundingClientRect();
      const d=Math.abs((cr.left+cr.width/2)-p.clientX); if(d<bd){bd=d;best=c;}});
    if(!best||bd>60){tip.style.opacity=0;return;}
    tip.innerHTML=`<b>${best.dataset.v} lb</b><br><span style="color:var(--muted)">${fmtD(best.dataset.d)}</span>`;
    tip.style.opacity=1;
    const br=best.getBoundingClientRect();
    tip.style.left=Math.min(window.innerWidth-110,Math.max(8,br.left-40))+'px';
    tip.style.top=(br.top-52)+'px';
  };
  ['mousemove','touchstart','touchmove'].forEach(e=>svg.addEventListener(e,move,{passive:true}));
  ['mouseleave','touchend'].forEach(e=>svg.addEventListener(e,()=>tip.style.opacity=0));
}

/* ============================================================
   CLOUD SYNC — Firebase Auth (Google) + Firestore
   ------------------------------------------------------------
   Entirely optional. With no config the app runs exactly as
   before, storing everything locally on the device.
   ============================================================ */
const BUILD='2026-08-24 · v22';   // shown on the Sync tab — check this to confirm an update landed
const FBV='https://www.gstatic.com/firebasejs/10.12.5';

/* Firebase config lives in its own file — config.js — which this file never
   touches. That means updating the app is a straight overwrite of index.html
   and your sign-in keeps working. Falls back to a config pasted into the Sync
   tab, then to local-only. */
const FIREBASE_CONFIG = (typeof window!=='undefined' && window.FIREBASE_CONFIG) || null;

// Union-merge two DBs so signing in on a second device never destroys data.
function mergeDB(a,b){
  const newer = (b.updatedAt||0) > (a.updatedAt||0) ? b : a;
  const older = newer===a ? b : a;
  const mergeMap=(x={},y={})=>{const o={...y,...x};return o;};   // newer wins per key
  return {
    log:      mergeMap(newer.log,older.log),
    weights:  mergeMap(newer.weights,older.weights),
    bodyfat:  mergeMap(newer.bodyfat,older.bodyfat),
    away:     (()=>{const seen=new Set(),out=[];
                 [...(newer.away||[]),...(older.away||[])].forEach(v=>{
                   const k=`${v.from}|${v.to}`; if(!seen.has(k)){seen.add(k);out.push(v);}});
                 return out;})(),
    membership: Object.assign({},older.membership||{},newer.membership||{}),
    bonus:    mergeMap(newer.bonus,older.bonus),
    fuel:     mergeMap(newer.fuel,older.fuel),
    adhoc:    mergeMap(newer.adhoc,older.adhoc),
    activities:(()=>{const seen=new Set(),out=[];
                 [...(newer.activities||[]),...(older.activities||[])].forEach(v=>{
                   const k=`${v.date}|${v.sub}|${JSON.stringify(v.vals||{})}`;
                   if(!seen.has(k)){seen.add(k);out.push(v);}});
                 return out;})(),
    rewards:  newer.rewards||older.rewards||null,
    niggles:  (()=>{const seen=new Set(),out=[];
                 [...(newer.niggles||[]),...(older.niggles||[])].forEach(v=>{
                   const k=`${v.date}|${v.area}`; if(!seen.has(k)){seen.add(k);out.push(v);}});
                 return out;})(),
    visits:   (()=>{const seen=new Set(),out=[];
                 [...(newer.visits||[]),...(older.visits||[])].forEach(v=>{
                   const k=`${v.date}|${v.type}`; if(!seen.has(k)){seen.add(k);out.push(v);}});
                 return out;})(),
    settings: Object.assign({},older.settings||{},newer.settings||{}),
    updatedAt: Math.max(a.updatedAt||0,b.updatedAt||0)
  };
}

const Cloud=(()=>{
  let app=null,auth=null,fs=null,api=null,user=null,timer=null,
      status='off', lastSync=0, err='';

  // Built-in config wins; the Sync tab is a fallback for one-off devices.
  const cfg=()=>(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)?FIREBASE_CONFIG:Store.get('coach.fbcfg',null);
  const builtIn=()=>!!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey);
  const setStatus=(s,e='')=>{status=s;err=e;if(TAB==='sync')render();else updateBadge();};

  function resolvedAuthDomain(c){
    const h=location.hostname;
    // Same-origin authDomain is required for signInWithRedirect to work in
    // Safari / iOS standalone apps. Firebase Hosting serves the auth handler
    // on both *.web.app and *.firebaseapp.com, so this is safe there.
    if(/\.web\.app$|\.firebaseapp\.com$/.test(h)) return h;
    return c.authDomain;
  }
  const sameOrigin=c=>resolvedAuthDomain(c)===location.hostname;

  async function init(){
    const c=cfg();
    if(!c||!c.apiKey||!c.projectId){setStatus('off');return;}
    try{
      setStatus('connecting');
      const [A,Au,Fs]=await Promise.all([
        import(`${FBV}/firebase-app.js`),
        import(`${FBV}/firebase-auth.js`),
        import(`${FBV}/firebase-firestore.js`)
      ]);
      api={...Au,...Fs};
      app=A.initializeApp({...c,authDomain:resolvedAuthDomain(c)});
      auth=Au.getAuth(app); fs=Fs.getFirestore(app);
      try{ await Au.getRedirectResult(auth); }catch(e){ /* surfaced by onAuthStateChanged */ }
      Au.onAuthStateChanged(auth,async u=>{
        user=u;
        if(u){ setStatus('syncing'); await pull(); setStatus('on'); }
        else setStatus('out');
        render();
      });
    }catch(e){ setStatus('error','Could not load Firebase: '+e.message); }
  }

  async function signIn(){
    const c=cfg(); if(!auth){await init();}
    if(!auth){setStatus('error','Firebase is not configured yet.');return;}
    const p=new api.GoogleAuthProvider();
    try{
      // Redirect is the reliable flow inside an iOS home-screen app, but only
      // when the auth domain matches the site's own origin.
      if(sameOrigin(c)) await api.signInWithRedirect(auth,p);
      else await api.signInWithPopup(auth,p);
    }catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
        try{ await api.signInWithRedirect(auth,p); }
        catch(e2){ setStatus('error',e2.message); }
      } else setStatus('error',e.code==='auth/unauthorized-domain'
        ? `This domain (${location.hostname}) is not authorised in Firebase → Authentication → Settings → Authorized domains.`
        : e.message);
    }
  }
  async function doSignOut(){ if(auth){ await api.signOut(auth); user=null; setStatus('out'); render(); } }

  async function pull(){
    if(!user||!fs) return;
    try{
      const ref=api.doc(fs,'users',user.uid);
      const snap=await api.getDoc(ref);
      if(snap.exists()){
        DB=mergeDB(DB,snap.data());
        Store.set('coach.db',DB);
      }
      await push(true);
      lastSync=Date.now();
    }catch(e){ setStatus('error',e.message); }
  }

  async function push(silent){
    if(!user||!fs) return;
    try{
      await api.setDoc(api.doc(fs,'users',user.uid),JSON.parse(JSON.stringify(DB)));
      lastSync=Date.now();
      if(!silent) setStatus('on');
    }catch(e){ setStatus('error',e.message); }
  }

  function queue(){ if(!user) return; clearTimeout(timer); timer=setTimeout(()=>push(),1200); }

  function updateBadge(){
    const el=document.getElementById('syncDot'); if(!el) return;
    el.style.background = status==='on'?'var(--good)' : status==='error'?'var(--critical)'
      : status==='syncing'||status==='connecting'?'var(--warning)':'var(--muted)';
  }

  return{init,signIn,signOut:doSignOut,queue,pull,push,get builtIn(){return builtIn()},
    get user(){return user}, get status(){return status}, get err(){return err},
    get lastSync(){return lastSync}, get configured(){return !!cfg()},
    get sameOrigin(){const c=cfg();return c?sameOrigin(c):false},
    saveCfg(o){Store.set('coach.fbcfg',o);init();},
    clearCfg(){Store.set('coach.fbcfg',null);location.reload();}};
})();
window.Cloud=Cloud;

/* ---------- 2. PERSONAL RECORDS ---------- */
function vRecords(){
  const names={squat:'Back Squat',rdl:'Romanian Deadlift',chest:'Chest Press',pull:'Lat Pulldown',
               ohp:'Shoulder Press',row:'Seated Row',push2:'Dip / second push',calf:'Calf Raise',
               pallof:'Pallof Press',carry:'Carry'};
  const recs=[];
  Object.keys(names).forEach(k=>{
    let best=null;
    Object.keys(DB.log).forEach(d=>{
      const rec=DB.log[d], st=rec?.sets?.[k]; if(!st) return;
      if((rec.variant&&rec.variant[k])||0) return;      // primary movement only
      st.forEach(x=>{ const w=parseFloat(x?.w), r=parseInt(x?.r);
        if(!isNaN(w)&&w>0&&(!best||w>best.w||(w===best.w&&r>best.r))) best={w,r:isNaN(r)?0:r,d}; });
    });
    if(best) recs.push({k,n:names[k],...best});
  });
  let h=backBar();
  if(!recs.length){
    h+=`<div class="card"><h3>No records yet</h3>
      <div class="muted mt">Log the weight and reps on a set and your bests appear here automatically.</div></div>`;
    view.innerHTML=h; return;
  }
  h+=`<div class="card"><h3>Best set on each lift</h3>
    <table class="mt"><thead><tr><th>Lift</th><th class="num">Best</th><th class="num">When</th></tr></thead><tbody>
    ${recs.sort((a,b)=>b.w-a.w).map(r=>`<tr><td>${r.n}</td>
      <td class="num" style="color:var(--green);font-weight:700">${r.w}kg${r.r?` × ${r.r}`:''}</td>
      <td class="num muted">${fmtD(r.d).replace(/^\w+, /,'')}</td></tr>`).join('')}
    </tbody></table>
    <div class="note">Only counts your primary movement — a leg press does not become a squat record. Substituted sessions are tracked separately.</div>
  </div>`;
  const est=recs.find(r=>r.k==='squat');
  if(est&&est.r>=3&&est.r<=10){
    const e1=Math.round(est.w*(1+est.r/30));
    h+=`<div class="card"><h3>Estimated squat max</h3>
      <div class="hero mt">${e1}<span class="u"> kg</span></div>
      <div class="sec">From ${est.w}kg × ${est.r}</div>
      <div class="note">An estimate from a rep-max formula, not a number to go and test. It is useful for seeing the trend, and for setting working weights at roughly 75–85% of it.</div>
    </div>`;
  }
  view.innerHTML=h;
}

/* ---------- 3. PROGRESS REVIEW ---------- */
function vReview(){
  const t=todayISO();
  const wNow=avg7(t), wThen=avg7(iso(addD(new Date(),-21)));
  const trend = (wNow!=null&&wThen!=null) ? wNow-wThen : null;
  // strength change across the block
  let up=0,down=0,flat=0;
  ['squat','rdl','chest','pull','ohp','row'].forEach(k=>{
    const ds=Object.keys(DB.log).filter(d=>DB.log[d]?.sets?.[k]?.[0]?.w&&!((DB.log[d].variant||{})[k])).sort();
    if(ds.length<2) return;
    const a=parseFloat(DB.log[ds[0]].sets[k][0].w), b=parseFloat(DB.log[ds[ds.length-1]].sets[k][0].w);
    if(b>a) up++; else if(b<a) down++; else flat++;
  });
  const weeks=allWeeks().filter(w=>weekStatus(w).complete&&weekStatus(w).state!=='prestart');
  const onTrack=weeks.filter(w=>weekStatus(w).state==='ontrack').length;
  const feels=Object.keys(DB.log).filter(d=>DB.log[d].rpe||DB.log[d].mood).sort().slice(-6);
  const avg=(arr,f)=>{const v=arr.map(d=>DB.log[d][f]).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const mood=avg(feels,'mood'), rpe=avg(feels,'rpe');

  // The actual coaching call
  let verdict, why, tone='b-info';
  if(trend==null){ verdict='Not enough data yet'; why='Log your morning weight for two to three weeks and this becomes useful. Single readings tell you nothing.'; }
  else if(trend<-0.4 && down===0){ verdict='Working — change nothing'; tone='b-info';
    why='Weight is coming down and your lifts are holding or climbing. That is fat loss with muscle protected, which is exactly the target. Do not cut calories further just because it is going well.'; }
  else if(trend<-0.4 && down>up){ verdict='Deficit too aggressive'; tone='b-warn';
    why='Weight is falling but more lifts are going backwards than forwards. Add roughly 150–200 kcal a day, mostly as carbs around training, and hold there for two weeks.'; }
  else if(trend>-0.15 && trend<0.15){ verdict='Stalled'; tone='b-warn';
    why='The 3-week trend is flat. Before cutting calories, check your logging is honest for a week — weighing food, counting drinks and weekends. If it genuinely is, drop about 150–200 kcal a day.'; }
  else if(trend>=0.15){ verdict='Weight trending up'; tone='b-warn';
    why='If this is not deliberate, the most likely cause is unlogged food rather than metabolism. Tighten the logging for a fortnight before changing anything.'; }
  else { verdict='On track'; why='Trend is moving the right way. Keep going and reassess in a fortnight.'; }

  let h=backBar();
  h+=`<div class="card"><h3>Where you are</h3>
    <div class="hero mt" style="font-size:26px;line-height:1.25">${verdict}</div>
    <div class="banner ${tone} mt">${tone==='b-warn'?I.alert:I.check}<div>${why}</div></div>
  </div>`;
  h+=`<div class="card"><h3>The four signals</h3>
    <table class="mt"><tbody>
      <tr><td>Weight, 3-week trend</td><td class="num">${trend==null?'—':`${trend>0?'+':''}${trend.toFixed(1)} lb`}</td></tr>
      <tr><td>Lifts up / flat / down</td><td class="num">${up} / ${flat} / ${down}</td></tr>
      <tr><td>Weeks on track</td><td class="num">${onTrack} of ${weeks.length}</td></tr>
      <tr><td>Difficulty · felt</td><td class="num">${rpe?rpe.toFixed(1):'—'} · ${mood?mood.toFixed(1):'—'}</td></tr>
    </tbody></table>
    <div class="note">Judged together, never one at a time. Falling weight only counts as success if your lifts hold — otherwise you are losing the muscle you are training to keep.</div>
  </div>`;
  h+=`<div class="card"><h3>Review points</h3>
    <table class="mt"><tbody>
      ${[4,8,12].map(w=>{const cur=weekNum(new Date());
        return `<tr><td>Week ${w}</td><td class="num ${cur>=w?'':'muted'}">${cur>w?'passed':cur===w?'now':`in ${w-cur} weeks`}</td></tr>`;}).join('')}
    </tbody></table>
    <div class="note">Export your data from the Sync tab at each of these and send it over — the numbers make the conversation far more useful than memory does.</div>
  </div>`;
  view.innerHTML=h;
}

/* ============================================================
   RANDOM WORKOUT — for turning up with no plan
   ------------------------------------------------------------
   Built from what is actually on the David Lloyd floor. Once
   accepted it lives on today's date, logs like any session, and
   counts as a ★ bonus — never as a scored session, because it
   was not part of the plan.
   ============================================================ */
const POOL={
  legs:['Back Squat','Linear Hack Squat','Seated Leg Press','Goblet Squat','Dumbbell Romanian Deadlift',
        'Seated Leg Curl','Single-leg DB RDL','Standing DB Calf Raise','Leg Press Calf Raise'],
  push:['Chest Press','DB Bench Press','Incline Press','Shoulder Press','DB Overhead Press',
        'Assisted Dip','Cable Triceps Pushdown'],
  pull:['Lat Pulldown','Assisted Chin-up','Seated Row','Cable Low Row','Single-arm DB Row',
        'Plate-loaded Row','EZ-Bar Preacher Curl'],
  core:['Pallof Press','Dead Bug','Abdominal Machine','Farmer’s Carry','Suitcase Lunge'],
  arms:['EZ-Bar Preacher Curl','Cable Triceps Pushdown','Assisted Chin-up','Assisted Dip','Single-arm DB Row']
};
const FOCUS=[
  {k:'full', t:'Full body',    mix:['legs','push','pull','core']},
  {k:'legs', t:'Legs',         mix:['legs','legs','legs','core']},
  {k:'upper',t:'Upper body',   mix:['push','pull','push','pull']},
  {k:'push', t:'Push',         mix:['push','push','push','core']},
  {k:'pull', t:'Pull',         mix:['pull','pull','pull','core']},
  {k:'arms', t:'Arms',         mix:['arms','arms','arms','core']},
  {k:'core', t:'Core',         mix:['core','core','core','core']}
];
const INTENSITY={
  easy:     {t:'Easy',     sets:2, reps:'12–15', rpe:'RPE 6 — comfortable, leave plenty in the tank'},
  moderate: {t:'Moderate', sets:3, reps:'8–12',  rpe:'RPE 7–8 — two or three reps left at the end'},
  hard:     {t:'Hard',     sets:4, reps:'5–8',   rpe:'RPE 8–9 — one or two reps left, and only when fresh'}
};
const MINS={20:3,30:4,45:5,60:6};

function genWorkout(focusKey,mins,intKey){
  const F=FOCUS.find(f=>f.k===focusKey), n=MINS[mins]||4, I=INTENSITY[intKey];
  const picked=[], used=new Set();
  for(let i=0;i<n;i++){
    const group=F.mix[i%F.mix.length];
    const opts=POOL[group].filter(x=>!used.has(x));
    const list=opts.length?opts:POOL[group];
    const pick=list[Math.floor(Math.random()*list.length)];
    used.add(pick);
    picked.push({n:pick,k:slug(pick),t:`${I.sets} × ${I.reps}`});
  }
  return {focus:focusKey,focusLabel:F.t,mins,intensity:intKey,ex:picked,rpeNote:I.rpe};
}

// Honest guardrail: a hard legs session next to a game is a bad trade.
function adhocWarning(w){
  const d=new Date(), dow=d.getDay();
  const legsy=['legs','full'].includes(w.focus);
  const gameTomorrow=[0,3].includes(dow);          // Sun→Mon game, Wed→Thu game
  const gameToday=[1,4].includes(dow);
  if(legsy&&w.intensity==='hard'&&gameTomorrow)
    return 'Hard legs the day before a game will cost you on court. Drop to moderate, or switch the focus to upper body.';
  if(legsy&&gameToday)
    return 'You have a 2-hour game today. Anything heavy on legs now competes directly with it.';
  if(dow===5&&legsy)
    return 'Gym — Lower already trains legs hard today. Doing both is more volume than it is worth.';
  return null;
}

function vRandom(){
  const ds=todayISO();
  const w=(DB.adhoc||{})[ds];
  let h=backBar();

  if(w&&w.accepted){
    const done=bonusOn(ds).includes('adhoc');
    h+=`<div class="card"><div class="row"><div>
      <h2>${w.focusLabel} · ${w.mins} min</h2>
      <div class="sec">${INTENSITY[w.intensity].t} · logged as a bonus, never scored</div>
    </div>${done?pill('bonus'):''}</div>
    <div class="note">${w.rpeNote}</div></div>`;

    const wk = w.focus==='legs'?'lower' : ['push','pull','upper','arms'].includes(w.focus)?'upper' : 'general';
    h+=warmupBlock(wk);
    h+=`<h3 style="margin:0 0 8px">Log your sets</h3>`;
    w.ex.forEach(x=>{
      const sets=(w.sets&&w.sets[x.k])||[];
      h+=`<div class="ex${sets.length?' done':''}">
        <div class="top">

          <div class="n">${i+1}</div>

          <input inputmode="numeric" placeholder="${INTENSITY[w.intensity].reps}" value="${sets[i]?.r??''}" onchange="adhocSet('${x.k}',${i},'r',this.value)">
        </div>`).join('')}
        <button class="addSet" onclick="adhocAddSet('${x.k}')">+ Add a set</button>
      </div>`;
    });

    h+=stretchBlock(wk);

    h+=`<div class="card"><h3>How was that?</h3>
      <div class="sec mt" style="margin-bottom:2px">Difficulty</div>${adhocScale('rpe','diff')}
      <div class="sec" style="margin-top:14px;margin-bottom:2px">How you felt</div>${adhocScale('mood','mood')}
    </div>`;
    h+=`<button class="btn ${done?'':'primary'}" onclick="finishAdhoc()">${done?'Logged ✓ — tap to undo':'Mark done — earns a ★'}</button>`;
    h+=`<button class="btn ghost mt" onclick="if(confirm('Discard this workout?'))clearAdhoc()">Discard</button>`;
    view.innerHTML=h; return;
  }

  // three options to choose between
  if(w&&w.options&&w.pick==null){
    h+=`<div class="card"><h3>Pick one</h3>
      <div class="sec mt">${FOCUS.find(f=>f.k===w.focus).t} · ${w.mins} min · ${INTENSITY[w.intensity].t}</div>
      <div class="note">Three options, same focus and effort. Pick whichever suits what is free on the floor.</div></div>`;
    w.options.forEach((o,n)=>{
      h+=`<div class="card" style="cursor:pointer" onclick="pickOption(${n})">
        <div class="row"><div style="font-weight:650;font-size:15px">Option ${n+1}</div>
        <div class="muted" style="font-size:20px">›</div></div>
        <div class="mt">${o.ex.map(x=>`<div class="wrow"><div class="wa">${x.n}</div><div class="wb">${x.t}</div></div>`).join('')}</div>
      </div>`;
    });
    h+=`<button class="btn ghost" onclick="rerollAdhoc()">Three more</button>`;
    h+=`<button class="btn ghost mt" onclick="clearAdhoc()">Start over</button>`;
    view.innerHTML=h; return;
  }

  if(w&&!w.accepted){
    const warn=adhocWarning(w);
    h+=`<div class="card"><div class="row"><div>
      <h2>${w.focusLabel} · ${w.mins} min</h2>
      <div class="sec">${INTENSITY[w.intensity].t}${w.pick!=null?` · option ${w.pick+1}`:''}</div></div></div>
      <div class="note">${w.rpeNote}</div></div>`;
    if(warn) h+=`<div class="banner b-warn">${I.alert}<div><b>Worth reconsidering.</b> ${warn}</div></div>`;
    h+=`<div class="card"><h3>The session</h3>
      <table class="mt"><tbody>${w.ex.map(x=>`<tr><td>
        <div style="display:flex;gap:10px;align-items:center">${poseIcon(x.n)}<div style="font-weight:600">${x.n}</div></div>
        </td><td class="num">${x.t}</td></tr>`).join('')}</tbody></table>
      <div class="note">Rest 90s on the big lifts, 60s on the rest. Tap any figure for full technique.</div>
    </div>`;
    h+=`<div class="btnrow"><button class="btn primary" onclick="acceptAdhoc()">Accept</button>
      <button class="btn" onclick="backToOptions()">Other options</button></div>`;
    h+=`<button class="btn ghost mt" onclick="clearAdhoc()">Start over</button>`;
    view.innerHTML=h; return;
  }

  // the form
  h+=`<div class="card"><h3>Turned up without a plan?</h3>
    <div class="sec mt">Tell it what you fancy and it builds something from what is actually on the floor here.</div>
    <div class="mt"><label class="f">What are you training</label>
      <select id="aFocus">${FOCUS.map(f=>`<option value="${f.k}">${f.t}</option>`).join('')}</select></div>
    <div class="grid2 mt">
      <div><label class="f">How long</label>
        <select id="aMins">${Object.keys(MINS).map(m=>`<option value="${m}"${m==='30'?' selected':''}>${m} min</option>`).join('')}</select></div>
      <div><label class="f">How hard</label>
        <select id="aInt">${Object.keys(INTENSITY).map(k=>`<option value="${k}"${k==='moderate'?' selected':''}>${INTENSITY[k].t}</option>`).join('')}</select></div>
    </div>
    <button class="btn primary mt" onclick="rollAdhoc()">Generate a workout</button>
  </div>`;
  h+=`<div class="banner b-info">${I.alert}<div>These count as a <b>★ bonus</b>, never as one of your four scored sessions. An unplanned session is a nice extra — it does not replace either gym session.</div></div>`;
  view.innerHTML=h;
}
function adhocScale(field,kind){
  const ds=todayISO(), w=(DB.adhoc||{})[ds]||{}, cur=w[field]||0;
  const labels=kind==='mood'?MOOD_LABEL:DIFF_LABEL;
  const icon = kind==='mood'?face:effort;
  return `<div class="feel">${[1,2,3,4,5].map(v=>`
    <button class="fbtn${cur===v?' on':''}" onclick="adhocFeel('${field}',${v})">${icon(v)}<span>${labels[v-1]}</span></button>`).join('')}</div>`;
}
window.rollAdhoc=()=>{
  const f=document.getElementById('aFocus').value;
  const m=parseInt(document.getElementById('aMins').value);
  const i=document.getElementById('aInt').value;
  DB.adhoc=DB.adhoc||{}; DB.activities=DB.activities||[];
  DB.adhoc[todayISO()]={options:[genWorkout(f,m,i),genWorkout(f,m,i),genWorkout(f,m,i)],
                        pick:null,accepted:false,sets:{},focus:f,mins:m,intensity:i};
  save(); render();
};
window.pickOption=n=>{
  const w=DB.adhoc[todayISO()];
  const o=w.options[n];
  DB.adhoc[todayISO()]={...o,options:w.options,pick:n,accepted:false,sets:{}};
  save(); render();
};
window.backToOptions=()=>{
  const w=DB.adhoc[todayISO()];
  DB.adhoc[todayISO()]={options:w.options,pick:null,accepted:false,sets:{},
                        focus:w.focus,mins:w.mins,intensity:w.intensity};
  save(); render();
};
window.rerollAdhoc=()=>{
  const w=DB.adhoc[todayISO()];
  DB.adhoc[todayISO()]={options:[genWorkout(w.focus,w.mins,w.intensity),genWorkout(w.focus,w.mins,w.intensity),
                                 genWorkout(w.focus,w.mins,w.intensity)],
                        pick:null,accepted:false,sets:{},focus:w.focus,mins:w.mins,intensity:w.intensity};
  save(); render();
};
window.acceptAdhoc=()=>{ DB.adhoc[todayISO()].accepted=true; save(); render(); };
window.clearAdhoc=()=>{ delete DB.adhoc[todayISO()]; save(); render(); };
window.adhocAddSet=k=>{
  const w=DB.adhoc[todayISO()]; w.sets=w.sets||{}; w.sets[k]=w.sets[k]||[];
  const min=INTENSITY[w.intensity].sets;
  while(w.sets[k].length<min) w.sets[k].push({});
  w.sets[k].push({}); save(); render();
};
window.adhocSet=(k,i,f,v)=>{
  const w=DB.adhoc[todayISO()]; w.sets=w.sets||{}; w.sets[k]=w.sets[k]||[];
  w.sets[k][i]=w.sets[k][i]||{}; w.sets[k][i][f]=v; save();

window.adhocFeel=(field,v)=>{ const w=DB.adhoc[todayISO()]; w[field]= w[field]===v?null:v; save(); render(); };

window.setRecovery=(ds,m)=>{
