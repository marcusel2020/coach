<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#0B0B0C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.4' fill='%2300594F'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3.2 17.4 8.6 11.5 12.6 15.5 20.8 6.5'/%3E%3Cpath d='M15 6.5h5.8v5.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.4' fill='%2300594F'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3.2 17.4 8.6 11.5 12.6 15.5 20.8 6.5'/%3E%3Cpath d='M15 6.5h5.8v5.8'/%3E%3C/g%3E%3C/svg%3E">
<title>Coach</title>
<style>
:root{
  color-scheme: dark;
  /* Premium dark — near-black, Aston Martin racing green, white */
  --plane:#0B0B0C; --surface:#17171A; --surface-2:#1F1F23; --raised:#26262B;
  --ink:#FFFFFF; --ink-2:#C9C9C4; --muted:#8C8C88;
  --grid:#26262A; --axis:#33333A; --border:rgba(255,255,255,0.09);
  --hair:rgba(255,255,255,0.055);
  /* Racing green: deep for fills (white sits on it at 8.3:1),
     light for text and icons on dark cards (6.1:1). */
  --green-deep:#00594F; --green:#199B80; --green-dim:#0E3B34;
  --series-1:#199B80;
  --good:#199B80; --warning:#E0A32E; --serious:#E08A5A; --critical:#E05A57;
  --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  padding-top:var(--safe-t); padding-bottom:calc(64px + var(--safe-b));
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-0.015em}
h3{text-transform:none}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:14px;color:var(--ink-2);font-weight:600}
.wrap{padding:16px 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted);font-size:13px}
.sec{color:var(--ink-2);font-size:14px}
.mt{margin-top:12px}.mt2{margin-top:20px}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(11,11,12,0.88);backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--border);padding:calc(var(--safe-t) + 10px) 16px 10px;margin-top:calc(-1 * var(--safe-t))}
header .row{max-width:640px;margin:0 auto}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(11,11,12,0.94);backdrop-filter:saturate(140%) blur(14px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;
  padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--green)}

/* status pill: icon + label, never colour alone */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:3px 9px 3px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.p-good{color:var(--good)}.p-warn{color:var(--warning)}.p-bad{color:var(--critical)}.p-off{color:var(--muted)}

.btn,button.btn{font:inherit;font-weight:600;font-size:15px;border-radius:11px;border:1px solid var(--border);
  background:var(--raised);color:var(--ink);padding:11px 14px;cursor:pointer;width:100%;text-decoration:none}
.btn.primary,button.btn.primary{background:var(--green-deep);border-color:#0A6B5E;color:#fff;letter-spacing:.01em}
.btn.primary:active{background:#00463E}
.btn.ghost,button.btn.ghost{background:transparent}
.btn.danger,button.btn.danger{color:var(--critical);border-color:var(--critical);background:transparent}
.btn:active{opacity:.7}
.btnrow{display:flex;gap:8px}

input,select{font:inherit;font-size:16px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--ink);border-radius:9px;padding:9px 10px;width:100%}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* hero */
.hero{font-size:44px;font-weight:700;letter-spacing:-0.035em;line-height:1.05;color:var(--ink)}
.hero .u{font-size:17px;color:var(--muted);font-weight:600;letter-spacing:0}

/* exercise log */
.ex{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface-2)}
.ex .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex .nm{font-weight:600;font-size:15px;line-height:1.3}
.ex .tgt{font-size:12.5px;color:var(--muted);margin-top:2px}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr;gap:7px;align-items:center;margin-top:8px}
.setrow .n{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.done{border-color:var(--good)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 2px;text-align:center;cursor:pointer}
.day .d{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.day .m{font-size:15px;margin-top:3px;line-height:1}
.day.today{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.ledger{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;gap:10px}
.ledger:last-child{border-bottom:0}

svg.chart{width:100%;display:block;overflow:visible;touch-action:none}
.tip{position:fixed;z-index:50;background:var(--raised);border:1px solid var(--border);border-radius:9px;
  padding:7px 10px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.legendless{font-size:12px;color:var(--muted);margin-top:6px}

/* pose icon + guide sheet */
.poseBtn{flex:none;width:46px;height:46px;border-radius:11px;border:1px solid var(--border);
  background:var(--raised);color:var(--green);padding:5px;cursor:pointer;position:relative}
.poseBtn svg{width:100%;height:100%;display:block}
.poseBtn::after{content:"?";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;
  background:var(--green-deep);color:#fff;font-size:10px;font-weight:800;line-height:15px;text-align:center;
  border:1.5px solid var(--surface-2)}
.poseBtn:active{opacity:.65}
.photoFill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.poseBig{position:relative;overflow:hidden}
.shot:empty{display:none}
.shot img{width:100%;border-radius:14px;display:block;margin-top:14px;border:1px solid var(--hair)}
.shot img[style*="display: none"]{margin-top:0}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheetInner{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:18px 18px calc(24px + var(--safe-b));
  -webkit-overflow-scrolling:touch}
.sheetTop{display:flex;gap:13px;align-items:flex-start}
.poseBig{flex:none;width:66px;height:66px;border-radius:14px;background:var(--green-dim);
  border:1px solid rgba(25,155,128,.35);color:var(--green);padding:7px}
.poseBig svg{width:100%;height:100%;display:block}
.xbtn{flex:none;background:var(--raised);border:1px solid var(--border);color:var(--ink-2);
  width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;line-height:1}
.glist{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);line-height:1.55}
.glist li{margin-bottom:7px}
.glist li::marker{color:var(--green)}
.glist.tip li::marker{content:"▸ "}
.glist.num li::marker{font-weight:700;color:var(--green)}

/* sign-in gate */
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:44px 20px 40px;min-height:62vh;justify-content:center}
.gateMark{width:96px;height:96px;border-radius:23px;background:var(--green-deep);
  border:1px solid rgba(255,255,255,.10);padding:16px}
.gateMark svg{width:100%;height:100%;display:block}
.linkish{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;
  text-decoration:underline;cursor:pointer;margin-top:26px;padding:6px}
.linkish:active{opacity:.6}

/* week navigator */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:8px 8px;margin-bottom:12px}
.weeknav button{background:var(--raised);border:1px solid var(--border);color:var(--ink);
  width:40px;height:40px;border-radius:11px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.weeknav button:active{opacity:.6}
.weeknav .wl{font-weight:650;font-size:15px;text-align:center}
.weeknav .wd{font-size:12px;color:var(--muted);text-align:center;margin-top:1px}

/* reward ladder */
.rung{border-top:1px solid var(--border);padding:12px 0}
.rung:first-of-type{border-top:0}
.rungTop{display:flex;align-items:center;gap:10px}
.rungDays{font-weight:700;font-size:19px;min-width:56px;color:var(--muted);font-variant-numeric:tabular-nums}
.rungDays span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.rung.hit .rungDays{color:var(--green)}
.rungLabel{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--border);
  border-radius:0;padding:5px 2px;font-size:14.5px;color:var(--ink)}
.rungLabel:focus{outline:none;border-bottom-color:var(--green)}
.bar{height:5px;background:var(--surface-2);border-radius:999px;margin-top:9px;overflow:hidden}
.bar div{height:100%;background:var(--green);border-radius:999px}

/* warm-up / stretch rows + recovery picker */
.wrow{padding:9px 0;border-top:1px solid var(--hair)}
.wrow.mob{display:flex;gap:11px;align-items:center;cursor:pointer}
.wrow.mob:active{opacity:.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.chip:active{opacity:.65}
.magicBtn{flex:none;background:var(--green-dim);border:1px solid var(--green);color:var(--green);
  width:34px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.magicBtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.magicBtn:active{opacity:.6}
.magicBox{display:flex;gap:8px;align-items:flex-start;margin-top:9px;padding-top:9px;border-top:1px solid var(--hair);
  font-size:12.5px;color:var(--green);line-height:1.45}
.magicBox svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.libRow{display:flex;gap:11px;align-items:center;cursor:pointer}
.libRow:active{opacity:.7}
.statRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.statRow .sv{font-size:22px;font-weight:700;letter-spacing:-.02em}
.statRow .sl{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.tblWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--hair);border-radius:12px;background:var(--surface)}
table.hist{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
table.hist th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-size:10px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:9px 10px;text-align:left;white-space:nowrap}
table.hist td{padding:9px 10px;border-top:1px solid var(--hair);vertical-align:top}
table.hist td.dt{color:var(--muted);white-space:nowrap;font-size:12px}
table.hist td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hn{font-weight:600;line-height:1.3}
.hnote{font-size:11.5px;color:var(--muted);margin-top:2px}
.catChip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.c-gym{color:var(--green);border-color:rgba(25,155,128,.4)}
.c-basketball{color:var(--warning);border-color:rgba(224,163,46,.4)}
.c-class{color:var(--series-1);border-color:rgba(25,155,128,.35)}
.c-cardio{color:var(--ink-2)}
.c-recovery{color:var(--muted)}
.starRow{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--hair);cursor:pointer}
.starRow:active{opacity:.65}
.stars{color:var(--green);font-size:13px;letter-spacing:1px;flex:none}
.starTxt{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starDrill{margin-top:8px}
.drillBlock{background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:10px 11px;margin-top:6px}
.dHead{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--green);margin-bottom:5px}
.dRow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;line-height:1.4}

/* rest timer bar */
.restBar{position:fixed;left:10px;right:10px;bottom:calc(70px + var(--safe-b));z-index:45;
  background:var(--raised);border:1px solid var(--green);border-radius:13px;padding:9px 11px;
  display:none;align-items:center;gap:9px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.restBar.show{display:flex}
.restL{font-size:12px;color:var(--muted);font-weight:600;flex:none}
.restT{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;flex:1;color:var(--green)}
.restT.done{color:var(--warning)}
.restBar button{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:9px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
.exTools{display:flex;gap:7px;margin-top:8px}
.exTools button{flex:1;background:transparent;border:1px solid var(--border);color:var(--ink-2);
  border-radius:9px;padding:7px 6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.exTools button:active{opacity:.6}
.suggest{font-size:12.5px;color:var(--green);margin-top:8px;font-weight:600}
.plate{font-size:11.5px;color:var(--muted);margin-top:3px}

/* measurements */
.measRow{margin-top:14px;padding-top:13px;border-top:1px solid var(--hair)}
.measLbl{font-size:13.5px;font-weight:600;margin-bottom:7px}
.measLbl span{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.measIn{display:flex;gap:8px}
.measIn input{flex:1}
.measIn button{width:auto;padding:11px 18px;flex:none}
.measOk{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12.5px;color:var(--good);font-weight:600}
.measOk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.measNo{margin-top:7px;font-size:12.5px;color:var(--muted)}
.wrow:first-of-type{border-top:0}
.wa{font-weight:600;font-size:14px}
.wb{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.recRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.recBtn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:10px;padding:10px 2px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.recBtn.on{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.recBtn:active{opacity:.65}

/* set table headers */
.setHead{display:grid;grid-template-columns:22px 1fr 1fr;gap:7px;margin-top:10px;padding:0 2px}
.setHead div{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.setHead div:first-child{text-align:center}
.addSet{background:transparent;border:1px dashed var(--border);color:var(--ink-2);border-radius:9px;
  padding:7px;font:inherit;font-size:12.5px;font-weight:600;width:100%;margin-top:8px;cursor:pointer}
.addSet:active{opacity:.6}
.rung.hit .bar div{background:var(--green)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.fbtn{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:9px 2px 7px;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit}
.fbtn span{font-size:9.5px;font-weight:600;letter-spacing:.01em}
.fbtn.on{color:var(--green);border-color:var(--green);background:var(--green-dim)}
.fbtn:active{opacity:.7}
.swap{display:flex;gap:8px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.swap button{flex:1;font:inherit;font-size:12.5px;font-weight:600;background:transparent;border:1px solid var(--border);
  color:var(--ink-2);border-radius:9px;padding:7px 8px;cursor:pointer}
.swap button:active{opacity:.6}
.swap .step{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}

details{border:1px solid var(--border);border-radius:11px;padding:12px;background:var(--surface);margin-bottom:10px}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";float:right;color:var(--muted);font-size:19px;line-height:1}
details[open] summary::after{content:"⌄"}
.hide{display:none !important}
.banner{border-radius:11px;padding:11px 13px;font-size:13.5px;border:1px solid;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.b-warn{color:var(--warning);border-color:var(--warning)}
.b-bad{color:var(--critical);border-color:var(--critical)}
.b-info{color:var(--ink-2);border-color:var(--border)}
.banner b{color:inherit}
.banner div{min-width:0;overflow-wrap:anywhere}
td.num{overflow-wrap:anywhere}

/* --- Progress: week navigator and the Mon–Sun strip --- */
.wknav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wknav button{flex:0 0 40px;height:40px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink);font-size:19px;line-height:1;cursor:pointer}
.wknav button:disabled{opacity:.3;cursor:default}
.wknav>div{flex:1;text-align:center}
.wknav .wkt{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.wknav .wks{font-size:12.5px;color:var(--muted);margin-top:1px}
.dayList{display:flex;flex-direction:column;gap:1px;background:var(--border);
  border-radius:11px;overflow:hidden}
.dayRow{display:flex;align-items:center;gap:12px;padding:10px 12px;

.dayRow.hit{border-left-color:var(--good)}
.dayRow.miss{border-left-color:var(--critical)}
.dayRow.fut{opacity:.5}
.dayRow .dd{flex:0 0 34px;text-align:center;line-height:1.15}
.dayRow .dd b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.dayRow .dm{flex:1;min-width:0}
.dayRow .dl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayRow .db{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayRow.miss .db{color:var(--critical)}
.dayRow .ds{flex:0 0 auto;color:var(--good);font-size:12px;letter-spacing:-1px}
.noteBody p{margin:0 0 10px;font-size:14.5px;line-height:1.6}
.noteBody p:last-child{margin-bottom:0}

/* --- recovery session ticks --- */
.recRowItem{display:flex;align-items:center;gap:11px}
.recRowItem.done{border-color:var(--good)}
.tick{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid var(--border);

.eqEx{display:flex;flex-wrap:wrap;gap:6px}

<script>
/* ============================================================
   STORAGE — localStorage with in-memory fallback
   ============================================================ */
const Store=(()=>{
  let mem={}, ok=true;
  try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){ok=false;}
  return{
    ok,
    get(k,d){ try{ const v = ok?localStorage.getItem(k):mem[k]; return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ const s=JSON.stringify(v); if(ok)localStorage.setItem(k,s); else mem[k]=s; }catch(e){ mem[k]=JSON.stringify(v); } }
  };
})();

/* ============================================================

       alts:[

        {n:'Heavy DB Hold',    note:'Stand and hold for 3 × 30s if space is tight.'},

       ]}
    ],
    tip:'Tuesday sits 24h after Monday’s game and 48h before Thursday’s. Upper body only by design — your legs get the whole gap to recover.'
  },
  bball:{ id:'bball', label:'Basketball', sub:'2 hours · the priority', ex:[], tip:'This is what the whole programme serves. Turn up fresh.' },
  open:{  id:'open',  label:'Open day',   sub:'Nothing required — extras only if you fancy them', ex:[],
          tip:'Rest is doing work here. Anything you add today is a bonus, never an obligation.'},
  rest:{  id:'rest',  label:'Rest / Reset', sub:'Recovery is part of the plan', ex:[],
          tip:'Deliberate. Walk if you like, but nothing that costs recovery.'},
  tba:{   id:'tba',   label:'To be arranged', sub:'Programme not built yet', ex:[],
          tip:'Nothing is scheduled yet. Logging weight and extras still works, and none of it counts against you.'}
};
// 0=Sun … 6=Sat
const SCHEDULE_M={1:'bball',2:'gymB',3:'open',4:'bball',5:'gymA',6:'open',0:'open'};

/* Optional extras. These NEVER count against you — they only ever earn credit. */
const BONUS={
  blaze:  {label:'BLAZE class',      sub:'45 min · HIIT, boxing, treadmill, strength'},
  yoga:   {label:'Yoga class',       sub:'Hips and ankles — feeds squat depth and landing'},
  run:    {label:'Easy 5km',         sub:'Conversational pace, tracked on Strava'},
  swim:   {label:'Swim',             sub:'Indoor or the heated outdoor pool'},
  sauna:  {label:'Sauna',            sub:'Finnish, fire & ice, citrus or salt'},
  plunge: {label:'Cold plunge',      sub:'10°C — not straight after lifting (see Plan)'},
  hottub: {label:'Hot tub',          sub:'Low effort, genuinely relaxing'},
  massage:{label:'Massage gun / roller', sub:'Soreness relief on stiff days'},
  racquet:{label:'Tennis / badminton / pickleball', sub:'Bonus movement — watch fatigue before games'},
  adhoc:  {label:'Random workout',   sub:'An unplanned session you turned up for'},
  recovery:{label:'Recovery session', sub:'Mobility, pool or spa — keeps you on the court'},
  activity:{label:'Extra activity',  sub:'Something logged outside the plan'},
  extra:   {label:'Extra exercise',  sub:'Added on top of a planned session'}
};
// What's suggested on each day (0=Sun … 6=Sat)
const SUGGEST_M={1:[],2:[],3:['swim','sauna','massage'],4:[],5:['sauna','massage'],6:['blaze','run','yoga','racquet'],0:['sauna','hottub','swim']};
// The four commitments a week is scored on
const CORE_M=[{dow:1,type:'bball'},{dow:2,type:'gymB'},{dow:4,type:'bball'},{dow:5,type:'gymA'}];

const NUTRITION_M={kcal:2200,protein:175,fat:70,carbs:215};

/* ============================================================
   PROFILES
   ------------------------------------------------------------
   One entry per person, matched on the signed-in Google email.
   Each carries its own schedule, programme, scoring and macros,
   so two people share one deployment without sharing anything else.
   ============================================================ */
const PROFILES={
  'marcusel2020@gmail.com':{
    name:'Marcus', start:'2026-08-24',
    schedule:SCHEDULE_M, suggest:SUGGEST_M, core:CORE_M,
    programme:PROGRAMME_M, nutrition:NUTRITION_M,
    settings:{startWeight:175,goalWeight:159,unitMigrated:true}
  },
  'ro.racheloconnor@gmail.com':{
    name:'Rachel', start:'2026-08-24', setup:true,
    schedule:{0:'tba',1:'tba',2:'tba',3:'tba',4:'tba',5:'tba',6:'tba'},
    suggest:{0:['swim','sauna'],1:[],2:[],3:[],4:[],5:[],6:['swim','sauna','racquet']},
    core:[],                       // nothing scored until the programme exists
    programme:PROGRAMME_M,         // only 'tba' and 'rest' are reachable via her schedule
    nutrition:null,                // no targets set yet
    settings:{startWeight:null,goalWeight:null,unitMigrated:true}
  }
};
const DEFAULT_PROFILE='marcusel2020@gmail.com';

function activeProfile(){
  const email=(window.Cloud&&Cloud.user&&Cloud.user.email||'').toLowerCase();
  return PROFILES[email]||PROFILES[Store.get('coach.profile',DEFAULT_PROFILE)]||PROFILES[DEFAULT_PROFILE];
}
// Accessors used everywhere below, so the active profile drives the whole app.
const SCHEDULE  =new Proxy({},{get:(_,k)=>activeProfile().schedule[k]});
const SUGGEST   =new Proxy({},{get:(_,k)=>activeProfile().suggest[k]});
const PROGRAMME =new Proxy({},{get:(_,k)=>activeProfile().programme[k]});
const NUTRITION =new Proxy({},{get:(_,k)=>(activeProfile().nutrition||{})[k]});
Object.defineProperty(window,'CORE',{get:()=>activeProfile().core});
const START_FOR=()=>activeProfile().start;

/* ============================================================
   DATE HELPERS  (local-time safe)
   ============================================================ */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const todayISO=()=>iso(new Date());
// Monday-start week
const monOf=d=>{const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x;};
const weekKey=d=>iso(monOf(d));
const fmtD=s=>parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function weekNum(d){
  START=START_FOR();
  const diff=Math.round((monOf(d)-monOf(parse(START)))/604800000);
  return diff+1;                       // ≤0 means the week is before the programme starts
}
// How to title a week: "Week 3 of 12", "Before Week 1", or "Week 14" past the block.
function weekTitle(d){
  const n=weekNum(d);
  if(n<1) return 'Before Week 1';
  return n<=12 ? `Week ${n} of 12` : `Week ${n}`;
}

/* ============================================================
   DATA
   ============================================================ */
/* ------------------------------------------------------------
   THE SHAPE OF THE STORE
   Every top-level key, and how two copies of it get merged.
   mergeDB, the backup importer and the boot path all read this,
   so adding a key here is the only step needed to make it sync
   and restore correctly. Anything NOT listed is still carried
   through untouched rather than dropped — a key added by a newer
   version of the app can never be silently deleted by an older one.
   ------------------------------------------------------------ */
const MEMBERSHIP_DEFAULT={annualCost:3746,myShare:1873,basis:'share',currency:'£',
                          start:'2026-08-24',altMonthly:45,targetPerVisit:15};
// NOTE: unitMigrated is deliberately NOT defaulted here. Its absence is what
// tells the kg→lb migration that this is an old store that still needs
// converting. normalise() stamps it only on a genuinely fresh install.
const SETTINGS_DEFAULT={startWeight:175,goalWeight:159};
const SHAPE={
  log:       {kind:'byDate', of:'entry'},     // 'YYYY-MM-DD': one planned session
  weights:   {kind:'byDate'},                 // 'YYYY-MM-DD': lb
  bodyfat:   {kind:'byDate'},                 // 'YYYY-MM-DD': %
  fuel:      {kind:'byDate'},                 // 'YYYY-MM-DD': {kcal,protein}
  bonus:     {kind:'byDate', of:'strings'},   // 'YYYY-MM-DD': ['sauna','swim']
  adhoc:     {kind:'byDate', of:'workouts'},  // 'YYYY-MM-DD': [workout, ...]
  away:      {kind:'list', id:v=>`${v.from}|${v.to}`},
  activities:{kind:'list', id:v=>`${v.date}|${v.sub}|${JSON.stringify(v.vals||{})}`},
  niggles:   {kind:'list', id:v=>`${v.date}|${v.area}`},
  visits:    {kind:'list', id:v=>`${v.date}|${v.type}`},
  membership:{kind:'obj',  def:MEMBERSHIP_DEFAULT},
  settings:  {kind:'obj',  def:SETTINGS_DEFAULT},
  rewards:   {kind:'newest'},
  notes:     {kind:'byDate'},                 // Monday of a week: {text, at, by}
  recovery:  {kind:'byDate', of:'workouts'}   // date: [recovery session, ...]
};

// Fill in anything missing and repair old shapes, without touching
// keys this version does not recognise.
function normalise(d){
  const fresh = !d || typeof d!=='object' || !('log' in d);
  const o={...(d||{})};
  Object.keys(SHAPE).forEach(k=>{
    const s=SHAPE[k];
    if(s.kind==='byDate')     o[k]=o[k]&&typeof o[k]==='object'?o[k]:{};
    else if(s.kind==='list')  o[k]=Array.isArray(o[k])?o[k]:[];
    else if(s.kind==='obj')   o[k]=Object.assign({},s.def||{},o[k]||{});
    else if(o[k]===undefined) o[k]=null;
  });
  // adhoc was one session per day before v18; now a list
  Object.keys(o.adhoc).forEach(d2=>{ if(!Array.isArray(o.adhoc[d2])) o.adhoc[d2]=[o.adhoc[d2]]; });
  // every ad-hoc workout needs a stable id so two devices can merge it
  // rather than each keeping its own copy
  Object.keys(o.adhoc).forEach(d2=>o.adhoc[d2].forEach((w,i)=>{ if(w&&!w.id) w.id=d2+'#'+i; }));
  Object.keys(o.recovery).forEach(d2=>{
    if(!Array.isArray(o.recovery[d2])) o.recovery[d2]=[o.recovery[d2]];
    o.recovery[d2].forEach((w,i)=>{ if(w&&!w.id) w.id='r'+d2+'#'+i; });
  });
  // A brand-new install is already in lb, so it must not be run through the
  // kg→lb conversion. An existing store without the flag genuinely needs it.
  if(fresh) o.settings.unitMigrated=true;
  o.updatedAt=o.updatedAt||0;
  return o;
}

let DB=normalise(Store.get('coach.db',null));
const save=()=>{ DB.updatedAt=Date.now(); Store.set('coach.db',DB); if(window.Cloud) Cloud.queue(); };

// One-time migration: body weight used to be stored in kg, now lb.
// Lifting loads stay in kg and are untouched.
if(!DB.rewards) DB.rewards=[
  {days:10,  label:'New gym top',                claimed:false},
  {days:20,  label:'Proper sports massage',      claimed:false},
  {days:40,  label:'New trainers',               claimed:false},
  {days:75,  label:'Weekend away',               claimed:false},
  {days:120, label:'Something big — your call',  claimed:false}
];
// New install: seed weight goals from the profile (null for a profile still being set up)
if(DB.settings.startWeight===undefined) DB.settings.startWeight=175;
if(!DB.settings.unitMigrated){
  const K=2.20462;
  Object.keys(DB.weights||{}).forEach(d=>{
    const v=parseFloat(DB.weights[d]);
    if(!isNaN(v)) DB.weights[d]=Math.round(v*K*10)/10;
  });
  if(DB.settings.startWeight) DB.settings.startWeight=Math.round(DB.settings.startWeight*K);
  if(DB.settings.goalWeight)  DB.settings.goalWeight =Math.round(DB.settings.goalWeight*K);
  DB.settings.unitMigrated=true;
  Store.set('coach.db',DB);
}

const isAway=s=>DB.away.some(a=>s>=a.from&&s<=a.to);
function weekAway(mondayISO){
  const m=parse(mondayISO);
  for(let i=0;i<7;i++) if(!isAway(iso(addD(m,i)))) return false;
  return true;
}
function weekPartlyAway(mondayISO){
  const m=parse(mondayISO);
  for(let i=0;i<7;i++) if(isAway(iso(addD(m,i)))) return true;
  return false;
}

/* ============================================================
   SCORING  — the accountability engine
   ------------------------------------------------------------
   Four core commitments a week (Mon bball, Tue Upper, Thu bball, Fri Lower).
   3 of 4  → on track. One miss is free, by design.
   ≤2 of 4 → off track.
   A week flagged as away in advance is excused entirely.
   Consecutive off-track weeks escalate ×1 → ×1.5 → ×2 (capped).
   ============================================================ */
const notStarted=()=>todayISO()<START_FOR();
const daysToStart=()=>Math.max(0,Math.round((parse(START_FOR())-parse(todayISO()))/86400000));

function weekStatus(mondayISO){
  const m=parse(mondayISO), today=todayISO();
  const days=[...Array(7)].map((_,i)=>iso(addD(m,i)));
  if(activeProfile().setup) return{state:'setup',hit:0,of:0,days,complete:false};
  const beforeProgramme=days[6]<START_FOR();             // week ends before the programme begins
  if(beforeProgramme) return{state:'prestart',hit:0,of:4,days};
  const started=days[0]<=today;
  if(!started) return{state:'planned',hit:0,of:4,days};
  if(weekAway(mondayISO)) return{state:'away',hit:0,of:4,days,complete:days[6]<today,partial:true};

  let hit=0, due=0;
  CORE.forEach(c=>{
    const off=(c.dow+6)%7;           // convert Sun-start dow to Mon-start index
    const ds=days[off];
    if(isAway(ds)) return;           // excused day doesn't count against you
    if(ds<today) due++;          // today isn't a miss until the day is over
    const e=DB.log[ds];
    // Gym sessions count wherever in the week you actually did them —
    // the day is a default, not a requirement. Basketball is date-fixed.
    if(c.type==='gymA'||c.type==='gymB'){
      if(days.some(dd=>{const x=DB.log[dd];return x&&x.done&&x.type===c.type;})) hit++;
    } else if(e&&e.done) hit++;
  });

  const of=Math.max(1,CORE.filter(c=>!isAway(days[(c.dow+6)%7])).length);
  const complete=days[6]<today;
  let state;
  if(!complete) state = hit>=3?'ontrack' : (due-hit)>=2 ? 'slipping' : 'inprogress';
  else state = hit>=of-1 ? 'ontrack' : 'offtrack';
  return{state,hit,of,due,days,complete,partial:weekPartlyAway(mondayISO)};
}

function allWeeks(){
  START=START_FOR();
  const first=monOf(parse(START)), now=monOf(new Date()), out=[];
  const from = now<first ? now : first;          // handles being a day or two before start
  for(let d=new Date(from); d<=now; d=addD(d,7)) out.push(iso(d));
  if(!out.length) out.push(iso(now));
  return out;
}

/* ============================================================
   MEMBERSHIP ECONOMICS
   ------------------------------------------------------------
   Not a forfeit — a utilisation read. Sunk cost does not drive
   behaviour, but knowing your real cost-per-visit does tell you
   honestly whether the membership is earning its place.
   ============================================================ */
const CLUB_TYPES=['gymA','gymB','flexGym'];

function clubVisits(){
  const m=DB.membership, out=[];
  Object.keys(DB.log).forEach(d=>{
    const e=DB.log[d];
    if(e&&e.done&&CLUB_TYPES.includes(e.type)&&d>=m.start) out.push({date:d,type:e.type});
  });
  (DB.visits||[]).forEach(v=>{ if(v.date>=m.start) out.push(v); });
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

function membershipStats(){
  const m=DB.membership, t=todayISO();
  const v=clubVisits();
  const days=Math.max(1,Math.round((parse(t)-parse(m.start))/86400000)+1);
  // The whole year's cost, divided by visits so far. Starts enormous, falls every
  // time you turn up. That fall IS the metric.
  const basis = m.basis==='total' ? m.annualCost : m.myShare;
  const costPer = v.length ? basis/v.length : null;
  const perDay=v.length/days;
  const projected=Math.max(v.length,Math.round(perDay*365));
  const projCostPer = projected ? basis/projected : null;
  const target=m.targetPerVisit||15;
  const visitsNeeded=Math.ceil(basis/target);
  const stillNeeded=Math.max(0,visitsNeeded-v.length);
  const perWeekNeeded=visitsNeeded/52;
  const altAnnual=m.altMonthly*12;
  const premium=basis-altAnnual;
  const thisMonth=v.filter(x=>x.date.slice(0,7)===t.slice(0,7)).length;
  // what one more visit does to the number
  const nextCostPer = basis/(v.length+1);
  return{visits:v,days,basis,costPer,projected,projCostPer,thisMonth,
         altAnnual,premium,target,visitsNeeded,stillNeeded,perWeekNeeded,nextCostPer};
}

function variantIdx(ds,k){ return (DB.log[ds]&&DB.log[ds].variant&&DB.log[ds].variant[k])||0; }
function bumpVariant(ds,k,max){
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[parse(ds).getDay()],sets:{}});
  e.variant=e.variant||{};
  const cur=e.variant[k]||0;
  if(cur>=max) return;
  e.variant[k]=cur+1;
  if(e.sets&&e.sets[k]) delete e.sets[k];   // different movement, different loads
  if(e.exName) delete e.exName[k];          // and a different name to record
  save(); render();
}
function resetVariant(ds,k){
  const e=DB.log[ds]; if(!e||!e.variant) return;
  delete e.variant[k];
  if(e.sets&&e.sets[k]) delete e.sets[k];
  if(e.exName) delete e.exName[k];
  save(); render();
}

}

const guideFor=n=>GUIDE[n]||null;

/* Photos live in /img as <slug>.jpg. If one is missing the drawn
   diagram shows through instead, so the app never breaks on a gap. */
const slug=n=>n.toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function exImg(name,cls){
  return `<img class="${cls}" src="img/${slug(name)}.jpg" alt="" loading="lazy"
     onerror="this.style.display='none'">`;
}

function openGuide(name){
  const g=guideFor(name); if(!g) return;
  const el=document.getElementById('sheet');
  el.innerHTML=`<div class="sheetInner">
    <div class="sheetTop">
      <div class="poseBig">${POSE[g.pose]?`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${POSE[g.pose]}</svg>`:''}${exImg(name,'photoFill')}</div>
      <div style="flex:1;min-width:0">
        <h2>${name}</h2>
        <div class="muted">${g.kit}</div>
      </div>
      <button class="xbtn" onclick="closeGuide()" aria-label="Close">✕</button>
    </div>
    <div class="shot">${exImg(name,'photoWide')}</div>
    <a class="btn primary" style="display:block;text-align:center;text-decoration:none;margin:14px 0 4px"
       href="https://www.youtube.com/results?search_query=${encodeURIComponent(g.watch)}" target="_blank" rel="noopener">▶ Watch how it is done</a>
    <div class="muted" style="text-align:center;margin-bottom:16px">Opens a YouTube search — pick any clear demo</div>
    <h3 style="margin-bottom:6px">Set up</h3>
    <ul class="glist">${g.setup.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h3 style="margin:16px 0 6px">Step by step</h3>
    <ol class="glist num">${g.steps.map(x=>`<li>${x}</li>`).join('')}</ol>
    <h3 style="margin:16px 0 6px">Getting the most from it</h3>
    <ul class="glist tip">${g.tips.map(x=>`<li>${x}</li>`).join('')}</ul>
    ${(()=>{ const ids=EX_EQUIP[name]||[]; if(!ids.length) return '';
      return `<h3 style="margin:16px 0 6px">Equipment</h3>
      <div class="eqEx">${ids.map(id=>{ const e=EQUIP.find(x=>x.id===id);
        return `<button class="chip" onclick="closeGuide();goEquip('${id}')">${e.n}</button>`; }).join('')}</div>`; })()}
    <button class="btn ghost" style="margin:18px 0 8px" onclick="closeGuide()">Close</button>
  </div>`;
  el.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeGuide(){
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow='';
}
window.openGuide=openGuide; window.closeGuide=closeGuide;
function poseIcon(name){
  const g=guideFor(name);
  if(!g||!POSE[g.pose]) return '';
  return `<button class="poseBtn" onclick="event.stopPropagation();openGuide(${JSON.stringify(name).replace(/"/g,'&quot;')})" aria-label="How to do ${name}">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${POSE[g.pose]}</svg>
    ${exImg(name,'photoFill')}
  </button>`;
}

  star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.1L12 17.8 6.4 20l1.2-6.1L3 9.6l6.3-.8z"/></svg>'
};
function pill(state){
  const M={
    ontrack:  ['p-good','check','On track'],
    inprogress:['p-off','dot','In progress'],
    slipping: ['p-warn','alert','Slipping'],
    offtrack: ['p-bad','x','Off track'],
    away:     ['p-off','plane','Away'],
    future:   ['p-off','dot','Upcoming'],
    prestart: ['p-off','dot','Before start'],
    planned:  ['p-off','dot','Planned'],
    starting: ['p-good','check','Starts tomorrow'],
    soon:     ['p-good','check','Starting soon'],
    bonus:    ['p-good','star','Bonus'],
    setup:    ['p-off','dot','Not set up']
  }[state]||['p-off','dot','—'];
  return `<span class="pill ${M[0]}">${I[M[1]]}${M[2]}</span>`;
}

let TAB='today';
let WEEKOFF=0;   // 0 = this week, -1 last, +1 next
let MORE=null;   // which sub-page of the ••• tab is open
const view=document.getElementById('view');

function render(){
  if(gateActive()){ renderGate(); return; }
  document.getElementById('tabs').classList.remove('hide');
  const ws=weekStatus(weekKey(new Date()));
  const pre = notStarted();
  document.getElementById('hdrPill').innerHTML =
    pre ? pill(daysToStart()===1?'starting':'soon') : pill(ws.state);
  const MT={reward:'Reward ladder',membership:'Membership',            fuel:'Nutrition',review:'Progress review',niggles:'Niggles',random:'Random workout',
            log:'Log an activity',library:'Library',sync:'Sync details',history:'History',
            recovery:'Recovery session',equipment:'Equipment library'};
  const T={today:'Today',week:'This week',progress:'Progress',
           more:MORE?MT[MORE]:'More',plan:'The plan'};
  document.getElementById('hdrTitle').textContent=T[TAB];
  document.getElementById('hdrSub').textContent=
    TAB==='today' ? new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})
    : pre ? (daysToStart()===1?'Week 1 starts tomorrow':`Week 1 starts in ${daysToStart()} days`)
    : weekTitle(new Date());
  if(TAB==='more'){ MORE?({reward:vReward,membership:vMembership,
      fuel:vFuel,review:vReview,niggles:vNiggles,random:vRandom,log:vLog,
      library:vLibrary,sync:vSync,history:vHistory,
      recovery:vRecovery,equipment:vEquipment})[MORE]() : vMore(); }
  else ({today:vToday,week:vWeek,progress:vProgress,plan:vPlan})[TAB]();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===TAB));
}

function lastFor(k,before,variant){
  const ds=Object.keys(DB.log).filter(d=>d<before).sort().reverse();
  for(const d of ds){
    const rec=DB.log[d]; const st=rec?.sets?.[k];
    if(!st||!st.length||!st[0].w) continue;
    const v=(rec.variant&&rec.variant[k])||0;
    if(variant!==undefined&&v!==variant) continue;   // only compare the same movement
    return st[0];
  }
  return null;
}
window.addExtraEx=()=>{
  const n=document.getElementById('xPick').value, ds=curDate();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[parse(ds).getDay()],sets:{}});
  e.extraEx=e.extraEx||[];
  if(e.extraEx.some(x=>x.n===n)) return;
  e.extraEx.push({n,k:'x_'+slug(n)});
  const cur=new Set(bonusOn(ds)); cur.add('extra');
  DB.bonus=DB.bonus||{}; DB.bonus[ds]=[...cur];
  save(); render();
};
window.rmExtraEx=i=>{
  const ds=curDate(), e=DB.log[ds];
  const gone=e.extraEx.splice(i,1)[0];
  if(e.sets) delete e.sets[gone.k];
  if(!e.extraEx.length&&DB.bonus[ds]){
    const cur=new Set(DB.bonus[ds]); cur.delete('extra');
    if(cur.size) DB.bonus[ds]=[...cur]; else delete DB.bonus[ds];
  }
  save(); render();
};
/* The store keys sets by a short code (squat, pull). The display name
   comes from the programme — which will change when we write the next
   block. Stamp the name as it was AT THE TIME OF LOGGING so history can
   never be silently relabelled by a future programme. */
function stampName(e,ds,k){
  e.exName=e.exName||{};
  if(e.exName[k]) return;
  const prog=PROGRAMME[e.type||SCHEDULE[parse(ds).getDay()]];
  const x=(prog&&prog.ex||[]).find(y=>y.k===k);
  if(x){ e.exName[k]=exVariant(x,(e.variant&&e.variant[k])||0).n; return; }
  const ex=(e.extraEx||[]).find(y=>y.k===k);
  if(ex) e.exName[k]=ex.n;
}

window.addSetRow=k=>{
  const ds=curDate();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[parse(ds).getDay()],sets:{}});
  e.sets=e.sets||{}; e.sets[k]=e.sets[k]||[];
  while(e.sets[k].length<3) e.sets[k].push({});
  e.sets[k].push({});
  save(); render();
};
window.setLog=(k,i,f,v)=>{
  const ds=curDate();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[parse(ds).getDay()],sets:{}});
  e.sets=e.sets||{}; e.sets[k]=e.sets[k]||[];
  e.sets[k][i]=e.sets[k][i]||{}; e.sets[k][i][f]=v;
  stampName(e,ds,k);
  save();
};
window.toggleDone=()=>{
  const ds=curDate();
  const e=DB.log[ds]||(DB.log[ds]={type:SCHEDULE[parse(ds).getDay()],sets:{}});
  e.done=!e.done; save(); render();
};
window.mark=t=>{
  const ds=curDate();

function lastBodyFat(before){
  const ds=Object.keys(DB.bodyfat||{}).filter(d=>d<before).sort().reverse();

}
/* The Today screen edits ONE date at a time. Default is today, but you can

window.submitWeight=()=>{

function avg7(end){
  const e=parse(end),v=[];
  for(let i=0;i<7;i++){const k=DB.weights[iso(addD(e,-i))];if(k!=null)v.push(k);}
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function trendTxt(){
  const now=avg7(todayISO()), then=avg7(iso(addD(new Date(),-14)));
  if(now==null) return 'No data yet';
  if(then==null) return `7-day avg ${now.toFixed(1)}lb`;
  const d=now-then;
  return `7-day avg ${now.toFixed(1)}lb · ${d>0?'+':''}${d.toFixed(1)}lb /2wk`;
}

/* ---------- WEEK ---------- */
function vWeek(){
  const base=monOf(new Date());
  const mon=addD(base,WEEKOFF*7);
  const wk=iso(mon), s=weekStatus(wk), t=todayISO();
  const wn=weekNum(mon);
  const label = WEEKOFF===0?'This week':WEEKOFF===-1?'Last week':WEEKOFF===1?'Next week'
    :WEEKOFF<0?`${-WEEKOFF} weeks ago`:`In ${WEEKOFF} weeks`;
  const future = wk>iso(base);

  let h=`<div class="weeknav">
    <button onclick="shiftWeek(-1)" aria-label="Previous week">‹</button>
    <div>
      <div class="wl">${label}</div>
      <div class="wd">${fmtD(wk).replace(/^\w+, /,'')} – ${fmtD(iso(addD(mon,6))).replace(/^\w+, /,'')}</div>
    </div>
    <button onclick="shiftWeek(1)" aria-label="Next week">›</button>
  </div>`;
  if(WEEKOFF!==0) h+=`<button class="btn ghost" style="margin-bottom:12px" onclick="shiftWeek(0,true)">Back to this week</button>`;

  h+=`<div class="card">
    <div class="row"><div><h2>${weekTitle(mon)}</h2>
    <div class="sec">${s.state==='setup'?'Programme not built yet'
      : future?'Planned — nothing logged yet'
      : `${s.hit} of ${s.of} core sessions`}</div></div>${pill(s.state)}</div>
    <div class="week mt">${s.days.map(ds=>{
      const dd=parse(ds), ty=isAway(ds)?'rest':SCHEDULE[dd.getDay()], e=DB.log[ds]||{};
      const bn=bonusOn(ds).length;
      const before=ds<START_FOR();
      const m=before?'·':isAway(ds)?'✈︎':e.done?'✓':bn?'★':ds<t?(ty==='open'||ty==='rest'||ty==='tba'?'—':'·'):(ty==='rest'||ty==='open'||ty==='tba')?'—':'○';
      return `<div class="day${ds===t?' today':''}" onclick="openDay('${ds}')"><div class="d">${DOW[dd.getDay()][0]}</div><div class="m">${m}</div></div>`;
    }).join('')}</div>

    ${(!future&&bonusCountWeek(wk))?`<div class="banner b-info mt" style="color:var(--good);border-color:var(--good)">${I.star}<div><b>${bonusCountWeek(wk)} extra${bonusCountWeek(wk)===1?'':'s'}</b> that week on top of the plan.</div></div>`:''}
  </div>`;

  h+=`<h3 class="mt2" style="margin-bottom:8px">${future?'Planned':'Schedule'}</h3>`;
  const scored = s.state!=='future'&&s.state!=='setup';
  s.days.forEach(ds=>{
    const dd=parse(ds), away=isAway(ds), ty=away?'rest':SCHEDULE[dd.getDay()];
    const P=PROGRAMME[ty], e=DB.log[ds]||{};
    const swapped = e.type && e.type!==ty ? PROGRAMME[e.type] : null;
    const core=CORE.some(c=>((c.dow+6)%7)===((dd.getDay()+6)%7)&&!away);
    const sug=(SUGGEST[dd.getDay()]||[]).map(k=>BONUS[k].label);
    h+=`<div class="card tight"><div class="row">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14.5px">${DOW[dd.getDay()]} · ${P.label}</div>
        <div class="muted">${away?'Flagged away':P.sub}${core?' · counts toward your week':''}</div>
        ${swapped?`<div class="muted">Logged instead: ${swapped.label}</div>`:''}
        ${sug.length?`<div class="muted">★ optional: ${sug.join(' · ')}</div>`:''}
      </div>
      ${e.done?pill('ontrack'):away?pill('away'):(scored&&ds<t&&core&&ds>=START_FOR())?pill('offtrack'):''}
    </div>
    ${starRow(ds)}
    </div>`;
  });
  view.innerHTML=h;
}
function bonusCountWeek(mondayISO){ return bonusCount(mondayISO, iso(addD(parse(mondayISO),6))); }

/* ============================================================
   PROGRESSION HELPERS
   ------------------------------------------------------------
   The app knows what you lifted and how hard it felt, so it
   should do the arithmetic rather than leaving it to you at
   the end of a session.
   ============================================================ */
const BARBELL=['Back Squat','Barbell RDL','Barbell Bench Press','Standing Barbell Press'];
const BIG_LEG=['Back Squat','Linear Hack Squat','Seated Leg Press'];
// Barbell legs move in 5kg steps; everything else in 2.5kg, which is the
// smallest honest jump on a machine stack or a dumbbell rack.
const incFor=name=>BIG_LEG.includes(name)?5:2.5;

// Last completed session for this exercise, same variant only.
function lastSession(k,before,variant){
  const ds=Object.keys(DB.log).filter(d=>d<before).sort().reverse();
  for(const d of ds){
    const rec=DB.log[d], st=rec?.sets?.[k];
    if(!st||!st.some(v=>v&&v.w)) continue;
    if(variant!==undefined && ((rec.variant&&rec.variant[k])||0)!==variant) continue;
    return {date:d,sets:st,rpe:rec.rpe};
  }
  return null;
}
// What to load next, and why.
function suggestWeight(k,target,variant,name){
  const L=lastSession(k,todayISO(),variant);
  if(!L) return null;
  const done=L.sets.filter(v=>v&&v.w);
  if(!done.length) return null;
  const top=parseFloat(done[0].w);
  const reps=done.map(v=>parseInt(v.r)||0);
  // "3 × 5" or "3 × 8–12" — the rep target is the number AFTER the ×, not the set count
  const topTarget=parseInt((String(target).match(/×\s*(\d+)/)||[])[1])||5;
  const enough=reps.length>=2;                       // one logged set is not evidence of anything
  const allHit=!enough || reps.every(r=>r>=topTarget);
  const inc=incFor(name);
  const isBar=BARBELL.includes(name);
  if(L.rpe>=5 || !allHit) return {w:Math.max(inc,Math.round((top*0.9)/inc)*inc),why:L.rpe>=5?'Last one was maximal — back off and rebuild.':`Reps fell short of ${topTarget} last time. Drop slightly and rebuild.`,hold:true};
  if(L.rpe===4)          return {w:top,why:'Last one was hard. Repeat this weight until it feels solid.',hold:true};
  if(!enough)            return {w:top,why:`Only one set logged last time — repeat ${top}kg and log all of them.`,hold:true};
  return {w:top+inc,
    why:`Last time was ${L.rpe?DIFF_LABEL[L.rpe-1].toLowerCase():'completed'} at ${top}kg — go up ${inc}kg${isBar?'':', or the next one up on the rack'}.`};
}
// Plate maths for barbell lifts, 20kg bar.
const PLATES=[25,20,15,10,5,2.5,1.25];
function plateText(total){
  let side=(total-20)/2;
  if(side<0) return 'Lighter than the bar';
  if(side===0) return 'Empty bar';
  const out=[];
  PLATES.forEach(pl=>{ while(side>=pl-0.001){ out.push(pl); side=Math.round((side-pl)*100)/100; } });
  if(side>0.01) return `${out.join(' + ')} per side (+${side}kg short)`;
  return `${out.join(' + ')} per side`;
}

/* ---------- rest timer ---------- */
let REST={end:0,tick:null,label:''};
function startRest(sec,label){
  REST.end=Date.now()+sec*1000; REST.label=label||'Rest';
  clearInterval(REST.tick);
  REST.tick=setInterval(paintRest,250);
  paintRest();
}
function stopRest(){ clearInterval(REST.tick); REST.tick=null; REST.end=0; paintRest(); }
function paintRest(){
  const bar=document.getElementById('restBar'); if(!bar) return;
  if(!REST.end){ bar.classList.remove('show'); return; }
  const left=Math.max(0,Math.round((REST.end-Date.now())/1000));
  bar.classList.add('show');
  const m=Math.floor(left/60), sec=String(left%60).padStart(2,'0');
  bar.innerHTML=`<div class="restL">${REST.label}</div>
    <div class="restT${left===0?' done':''}">${m}:${sec}</div>
    <button onclick="startRest(30,'Rest')">+30s</button>
    <button onclick="stopRest()">Done</button>`;
  if(left===0 && REST.tick){ clearInterval(REST.tick); REST.tick=null;
    if(navigator.vibrate) try{navigator.vibrate([200,100,200])}catch(e){} }
}
window.startRest=startRest; window.stopRest=stopRest;

/* ============================================================
   BONUS STARS — inline under each day, tap to see what you did
   ============================================================ */
function dayExtras(ds){
  const out=[];
  bonusOn(ds).forEach(k=>{
    if(k==='adhoc'){
      const ws=adhocList(ds);
      if(ws.length) ws.forEach((w,i)=>out.push({k,label:`${w.focusLabel||'Workout'} · ${w.mins} min`,detail:'adhoc',idx:i}));
      else out.push({k,label:'Random workout',detail:'adhoc',idx:0});
    } else if(k==='activity'){
      (DB.activities||[]).filter(a=>a.date===ds).forEach(a=>out.push({k,label:a.sub,detail:'activity',data:a}));
    } else if(k==='extra'){
      const ex=(DB.log[ds]||{}).extraEx||[];
      out.push({k,label:`${ex.length} extra exercise${ex.length===1?'':'s'}`,detail:'extra'});
    } else {
      out.push({k,label:(BONUS[k]||{}).label||k});
    }
  });
  return out;
}
function starRow(ds){
  const ex=dayExtras(ds);
  if(!ex.length) return '';
  const open=OPEN_STARS===ds;
  return `<div class="starRow" onclick="toggleStars('${ds}')">

  </div>
  ${open?`<div class="starDrill">${ex.map(x=>starDetail(ds,x)).join('')}</div>`:''}`;
}
function starDetail(ds,x){
  if(x.detail==='adhoc'){
    const w=adhocList(ds)[x.idx||0]; if(!w||!w.ex) return '';
    return `<div class="drillBlock">
      <div class="dHead">${w.focusLabel} · ${w.mins} min · ${INTENSITY[w.intensity].t}</div>

      }).join('')}
      ${w.rpe||w.mood?`<div class="dRow"><span class="muted">Difficulty ${w.rpe?DIFF_LABEL[w.rpe-1]:'—'} · felt ${w.mood?MOOD_LABEL[w.mood-1]:'—'}</span></div>`:''}
    </div>`;
  }
  if(x.detail==='extra'){
    const e=DB.log[ds]||{}, ex=e.extraEx||[];
    return `<div class="drillBlock">
      <div class="dHead">Extra on top of the session</div>
      ${ex.map(v=>{
        const st=(e.sets&&e.sets[v.k])||[];
        const done=st.filter(z=>z&&z.w).map(z=>`${z.w}kg × ${z.r||'?'}`).join(', ');
        return `<div class="dRow"><span>${v.n}</span><span class="muted">${done||'not logged'}</span></div>`;
      }).join('')}
    </div>`;
  }
  if(x.detail==='activity'){
    const a=x.data, F=(ACTIVITIES[a.cat]||{}).fields||[];
    const bits=Object.entries(a.vals||{}).filter(([,v])=>v!==''&&v!=null)
      .map(([k,v])=>{const f=F.find(z=>z[0]===k);return f?`${f[1]}: ${v} ${f[2]}`:v;});
    return `<div class="drillBlock">

      ${a.note?`<div class="dRow"><span class="muted">“${a.note}”</span></div>`:''}
    </div>`;

  return `<div class="drillBlock"><div class="dHead">${b.label||x.k}</div>
    <div class="dRow"><span class="muted">${b.sub||''}</span></div></div>`;
}

/* ---------- PROGRESS ---------- */
/* ============================================================
   PROGRESS — a week at a time
   ------------------------------------------------------------
   Monday to Sunday. Did the week hold together, what did the
   scale do, what did you do beyond the plan. Long-term trends
   sit underneath, because they only mean anything across blocks.
   ============================================================ */
let PW=null;                                   // Monday of the week being viewed
const pWeek=()=>PW||weekKey(new Date());
window.shiftWeek=n=>{
  const m=iso(addD(parse(pWeek()),n*7));
  if(m>weekKey(new Date())) return;            // no looking forward
  PW = m===weekKey(new Date()) ? null : m;
  window.scrollTo(0,0); render();
};

// What actually happened on each day of a week.
function weekRows(mon){
  const days=[...Array(7)].map((_,i)=>iso(addD(parse(mon),i)));
  return days.map(ds=>{
    const e=DB.log[ds]||{}, prog=PROGRAMME[e.type||SCHEDULE[parse(ds).getDay()]];
    const planned=SCHEDULE[parse(ds).getDay()];
    const done=!!e.done;
    const nSets=Object.keys(e.sets||{}).length;
    const extras=adhocList(ds).filter(w=>w.accepted);
    const acts=(DB.activities||[]).filter(a=>a.date===ds);
    const stars=(DB.bonus[ds]||[]).length;
    const bits=[];
    if(done) bits.push(e.type==='bball'?'Played':(nSets?`${nSets} exercise${nSets===1?'':'s'}`:'Done'));
    extras.forEach(w=>bits.push(`${w.focusLabel||'Random'} workout`));
    recList(ds).forEach(w=>bits.push(w.focusLabel));
    acts.forEach(a=>bits.push(a.sub));
    const label = e.type==='bball'||planned==='bball' ? 'Basketball'
                : prog ? prog.label
                : planned==='open' ? 'Open' : '—';
    const missed = !done && !extras.length && !acts.length
                 && ['bball','gymA','gymB'].includes(planned)
                 && ds<todayISO() && !isAway(ds);
    // bonus extras are shown on the day but never counted as sessions
    const extraLabels=(DB.bonus[ds]||[]).filter(k=>!['adhoc','activity','extra','recovery'].includes(k))
      .map(k=>(BONUS[k]||{}).label).filter(Boolean);
    return {ds,label,bits,extraLabels,stars,done,missed,away:isAway(ds),future:ds>todayISO()};
  });
}

function vProgress(){
  const mon=pWeek(), ws=weekStatus(mon);
  const days=[...Array(7)].map((_,i)=>iso(addD(parse(mon),i)));
  const isThis=mon===weekKey(new Date());
  const wn=weekNum(parse(mon));
  let h='';

  /* ---- week navigator ---- */
  const span=`${parse(mon).getDate()} ${parse(mon).toLocaleDateString('en-GB',{month:'short'})} – ${parse(days[6]).getDate()} ${parse(days[6]).toLocaleDateString('en-GB',{month:'short'})}`;
  h+=`<div class="wknav">
    <button onclick="shiftWeek(-1)" aria-label="Previous week">‹</button>
    <div><div class="wkt">${wn<1?'Before Week 1':wn<=12?`Week ${wn} of 12`:`Week ${wn}`}</div>
      <div class="wks">${isThis?'This week':span}</div></div>
    <button onclick="shiftWeek(1)" ${isThis?'disabled':''} aria-label="Next week">›</button>
  </div>`;

  /* ---- the four numbers ---- */
  const wEnd=avg7(days[6]>todayISO()?todayISO():days[6]);
  const wPrev=avg7(iso(addD(parse(mon),-1)));
  const dW = (wEnd!=null&&wPrev!=null) ? wEnd-wPrev : null;
  const stars=bonusCount(days[0],days[6]);
  const logged=weekRows(mon).reduce((t,r)=>t+(r.done?1:0)+r.bits.length-(r.done?1:0),0);
  const sessions=weekRows(mon).reduce((t,r)=>t+r.bits.length,0);

  h+=`<div class="card"><div class="row"><h3>The week</h3>${pill(ws.state)}</div>
    <div class="statRow mt">
      <div><div class="sv">${ws.state==='prestart'||ws.state==='planned'?'—':`${ws.hit}/${ws.of}`}</div><div class="sl">core sessions</div></div>
      <div><div class="sv" style="color:${dW==null?'var(--muted)':dW<0?'var(--good)':dW>0?'var(--warning)':'var(--muted)'}">${dW==null?'—':`${dW>0?'+':''}${dW.toFixed(1)}`}</div><div class="sl">lb change</div></div>
      <div><div class="sv" style="color:${stars?'var(--good)':'var(--muted)'}">${stars}</div><div class="sl">star${stars===1?'':'s'}</div></div>
      <div><div class="sv">${sessions}</div><div class="sl">things done</div></div>
    </div>
    <div class="note">${weekVerdict(ws,dW,stars)}</div>
  </div>`;

  /* ---- Monday to Sunday ---- */
  h+=`<div class="card"><h3>Monday to Sunday</h3><div class="dayList mt">`;
  weekRows(mon).forEach(r=>{
    const dt=parse(r.ds);
    const cls=r.missed?'miss':r.bits.length?'hit':r.future?'fut':'';
    h+=`<div class="dayRow ${cls}" onclick="openDay('${r.ds}')">
      <div class="dd"><b>${DOW[dt.getDay()]}</b><span>${dt.getDate()}</span></div>
      <div class="dm"><div class="dl">${r.label}</div>
        <div class="db">${(()=>{ const all=[...r.bits,...r.extraLabels];
          return r.away?'Away':all.length?all.join(' · '):r.missed?'Missed':r.future?'To come':'Nothing logged'; })()}</div></div>
      <div class="ds">${r.stars?'★'.repeat(Math.min(r.stars,3)):''}</div>
    </div>`;
  });
  h+=`</div><div class="note">Tap any day to open it and log something you forgot.</div></div>`;

  /* ---- coach note for this week ---- */
  h+=noteCard(mon);

  /* ---- long-term, underneath ---- */
  h+=`<h3 style="margin:22px 0 10px">Overall</h3>`;
  h+=overallCards();
  view.innerHTML=h; wireChart();
}

function weekVerdict(ws,dW,stars){
  if(ws.state==='setup')     return 'Nothing scheduled yet.';
  if(ws.state==='prestart')  return 'Before the programme started — nothing counted yet.';
  if(ws.state==='planned')   return 'Still to come.';
  if(ws.state==='away')      return 'Flagged as away. Excused in full — this week does not count against you.';
  const parts=[];
  if(ws.complete) parts.push(ws.state==='ontrack'
    ? `${ws.hit} of ${ws.of} core sessions — that is a good week.`
    : `${ws.hit} of ${ws.of} core sessions. Two misses is the line, so this one counts against you.`);
  else parts.push(`${ws.hit} of ${ws.of} so far.`);
  if(dW!=null&&Math.abs(dW)>=0.1) parts.push(`Weight ${dW<0?'down':'up'} ${Math.abs(dW).toFixed(1)}lb on the 7-day average.`);
  if(stars) parts.push(`${stars} extra${stars===1?'':'s'} on top.`);
  parts.push('One week is noise — the trend below is what matters.');
  return parts.join(' ');
}

    </div>`;
  }
  h+=`<div class="card">${consistencyChart()}</div>`;
  // difficulty & mood
  const feels=Object.keys(DB.log).filter(d=>DB.log[d].rpe||DB.log[d].mood).sort();

    const recent=feels.slice(-6), older=feels.slice(-12,-6);
    const rN=avg(recent,'rpe'), rO=avg(older,'rpe'), mN=avg(recent,'mood'), mO=avg(older,'mood');

          <div class="muted">${rN==null?'':DIFF_LABEL[Math.round(rN)-1]}</div></div>
        <div><div class="muted">Felt</div>
          <div style="font-size:26px;font-weight:700">${mN==null?'—':mN.toFixed(1)}<span class="muted" style="font-size:14px;font-weight:600">/5</span></div>

      </div>

            :`<div class="note">Watching for difficulty rising while mood falls — that combination is the early warning, not either number on its own.</div>`}
    </div>`;
  }

  const bw=bonusThisWeek(), ba=bonusAllTime();
  h+=`<div class="card"><h3>Above and beyond</h3>
    <div class="hero mt" style="color:var(--good)">${ba}</div>
    <div class="sec">optional extra${ba===1?'':'s'} logged · ${bw} this week</div>
    <div class="note">BLAZE, swims, spa, yoga and runs — none of these are required, and skipping them never counts against you. This is the credit column only.</div>
  </div>`;

  // strength
  const keys=[['squat','Back Squat'],['rdl','RDL'],['chest','Chest Press'],['pull','Lat Pulldown'],
              ['ohp','Shoulder Press'],['row','Seated Row']];
  const rows=keys.map(([k,n])=>{
    const hist=Object.keys(DB.log).filter(d=>DB.log[d]?.sets?.[k]?.[0]?.w).sort();
    if(!hist.length) return null;
    const f=DB.log[hist[0]].sets[k][0], l=DB.log[hist[hist.length-1]].sets[k][0];
    return{n,first:f,last:l,d:(parseFloat(l.w)||0)-(parseFloat(f.w)||0)};
  }).filter(Boolean);

  h+=`<div class="card"><h3>Strength trend</h3>`;
  h+= rows.length? `<table class="mt"><thead><tr><th>Lift</th><th class="num">First</th><th class="num">Latest</th><th class="num">Δ</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.n}</td><td class="num">${r.first.w}kg</td><td class="num">${r.last.w}kg</td>
    <td class="num" style="color:${r.d>0?'var(--good)':r.d<0?'var(--critical)':'var(--muted)'}">${r.d>0?'+':''}${r.d}kg</td></tr>`).join('')}
    </tbody></table>
    <div class="note">Falling weight with <em>stable or rising</em> lifts means the deficit is working. Falling weight with <em>falling</em> lifts means it is too aggressive — add 150–200 kcal back.</div>`
    : `<div class="muted mt">Log some sets and your strength trend will appear here.</div>`;
  h+=`</div>`;

  h+=`<div class="card"><h3>Goal</h3>
    <table class="mt"><tbody>
      <tr><td>Starting weight</td><td class="num">${start} lb</td></tr>
      <tr><td>Goal weight</td><td class="num">${goal} lb</td></tr>
    </tbody></table>
    <div class="note">Your starting weight is a fixed baseline — every trend on this page is measured from it, so it stays put.</div>
    <details style="margin-top:10px;border:0;padding:0;background:transparent">
      <summary style="font-size:13px;color:var(--muted);font-weight:600">Change the baseline</summary>
      <div class="grid2 mt">
        <div><label class="f">Start lb</label><input inputmode="decimal" value="${start}" onchange="setCfg('startWeight',this.value)"></div>
        <div><label class="f">Goal lb</label><input inputmode="decimal" value="${goal}" onchange="setCfg('goalWeight',this.value)"></div>
      </div>
      <div class="note">Only worth changing if the original figure was wrong — not to reset progress after a bad week.</div>
    </details></div>`;

  return h;
}

/* ---------- CHARTS ---------- */
// Single series → no legend box; the title names it. One hue, 2px line, 8px markers.
function weightChart(){
  const pts=Object.keys(DB.weights).sort().map(d=>({d,v:DB.weights[d]}));
  if(pts.length<2) return `<h3>Weight trend</h3><div class="muted mt">Log at least two mornings to see a trend.</div>`;
  const W=560,H=170,P={t:12,r:14,b:24,l:34};
  const xs=pts.map(p=>parse(p.d).getTime()), vs=pts.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  let v0=Math.min(...vs),v1=Math.max(...vs); const pad=Math.max(0.6,(v1-v0)*0.18); v0-=pad;v1+=pad;
  const X=t=>P.l+((t-x0)/((x1-x0)||1))*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-v0)/((v1-v0)||1))*(H-P.t-P.b);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(parse(p.d).getTime()).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const ticks=[v0+(v1-v0)*0.15,(v0+v1)/2,v1-(v1-v0)*0.15];
  return `<h3>Weight trend <span class="muted" style="font-weight:400">· lb, daily</span></h3>
  <svg class="chart" id="wc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Body weight over time">
    ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${P.l-7}" y="${(Y(t)+4).toFixed(1)}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="system-ui">${t.toFixed(1)}</text>`).join('')}
    <line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--axis)" stroke-width="1"/>
    <path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(parse(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"
       fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" data-d="${p.d}" data-v="${p.v}"/>`).join('')}
    <text x="${P.l}" y="${H-6}" fill="var(--muted)" font-size="11" font-family="system-ui">${fmtD(pts[0].d)}</text>
    <text x="${W-P.r}" y="${H-6}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="system-ui">${fmtD(pts[pts.length-1].d)}</text>
  </svg>`;
}

// Status colours + always a text label under each bar — never colour alone.
function consistencyChart(){
  const ws=allWeeks();
  const done=ws.filter(w=>{const s=weekStatus(w);return s.state!=='future';});
  if(!done.length) return `<h3>Weekly consistency</h3><div class="muted mt">Your first week has not started yet. Bars appear here once sessions are logged.</div>`;
  const show=done.slice(-12);
  return `<h3>Weekly consistency <span class="muted" style="font-weight:400">· core sessions completed</span></h3>
  <div style="display:flex;gap:4px;align-items:flex-end;height:92px;margin-top:14px">
    ${show.map(w=>{const s=weekStatus(w);
      const c=s.state==='away'?'var(--muted)':s.state==='offtrack'?'var(--critical)':s.state==='slipping'?'var(--warning)':s.state==='ontrack'?'var(--good)':'var(--axis)';
      const hgt=Math.max(6,(s.hit/Math.max(1,s.of))*78);
      return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px">
        <div style="width:100%;height:${hgt}px;background:${c};border-radius:4px 4px 0 0" title="${weekTitle(parse(w))}: ${s.hit}/${s.of}"></div>
        <div style="font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums">${s.state==='away'?'✈︎':s.hit}</div>
      </div>`;}).join('')}
  </div>
  <div class="legendless">Number under each bar = core sessions completed that week (out of 4). ✈︎ = flagged away.</div>`;
}

function wireChart(){
  const svg=document.getElementById('wc'), tip=document.getElementById('tip');
  if(!svg) return;
  const dots=[...svg.querySelectorAll('circle')];
  const move=ev=>{
    const p=ev.touches?ev.touches[0]:ev, r=svg.getBoundingClientRect();
    let best=null,bd=1e9;
    dots.forEach(c=>{const cr=c.getBoundingClientRect();
      const d=Math.abs((cr.left+cr.width/2)-p.clientX); if(d<bd){bd=d;best=c;}});
    if(!best||bd>60){tip.style.opacity=0;return;}
    tip.innerHTML=`<b>${best.dataset.v} lb</b><br><span style="color:var(--muted)">${fmtD(best.dataset.d)}</span>`;
    tip.style.opacity=1;
    const br=best.getBoundingClientRect();
    tip.style.left=Math.min(window.innerWidth-110,Math.max(8,br.left-40))+'px';
    tip.style.top=(br.top-52)+'px';
  };
  ['mousemove','touchstart','touchmove'].forEach(e=>svg.addEventListener(e,move,{passive:true}));
  ['mouseleave','touchend'].forEach(e=>svg.addEventListener(e,()=>tip.style.opacity=0));
}

/* ------------------------------------------------------------
   RECORD CENSUS — a straight count of what is actually held, so
   you can sense-check that nothing has gone missing.
   ------------------------------------------------------------ */
function census(d){
  d=d||DB;
  const sets=Object.values(d.log||{}).reduce((t,e)=>t+Object.keys(e&&e.sets||{}).length,0)
           + Object.values(d.adhoc||{}).flat().reduce((t,w)=>t+Object.keys(w&&w.sets||{}).length,0);
  const dates=[
    ...Object.keys(d.log||{}), ...Object.keys(d.weights||{}), ...Object.keys(d.bodyfat||{}),
    ...Object.keys(d.fuel||{}), ...Object.keys(d.bonus||{}), ...Object.keys(d.adhoc||{}),
    ...Object.keys(d.recovery||{}),
    ...(d.activities||[]).map(a=>a.date), ...(d.niggles||[]).map(n=>n.date),
    ...(d.visits||[]).map(v=>v.date)
  ].filter(Boolean).sort();
  return {
    rows:[
      ['Session days',        Object.keys(d.log||{}).length],
      ['Exercises with sets', sets],
      ['Random / custom workouts', Object.values(d.adhoc||{}).flat().length],
      ['Recovery sessions',   Object.values(d.recovery||{}).flat().length],
      ['Activities logged',   (d.activities||[]).length],
      ['Morning weights',     Object.keys(d.weights||{}).length],
      ['Body Hub scans',      Object.keys(d.bodyfat||{}).length],
      ['Nutrition days',      Object.keys(d.fuel||{}).length],
      ['Bonus extras',        Object.values(d.bonus||{}).flat().length],
      ['Club visits',         (d.visits||[]).length],
      ['Niggles',             (d.niggles||[]).length],
      ['Coach notes',         Object.keys(d.notes||{}).length]
    ],
    first:dates[0]||null, last:dates[dates.length-1]||null,
    bytes:JSON.stringify(d).length
  };
}
const censusLine=d=>{ const c=census(d);
  return `${Object.keys(d.log||{}).length} session days, ${Object.keys(d.weights||{}).length} weights, ${Object.keys(d.bodyfat||{}).length} scans`; };

window.importData=el=>{
  const f=el.files&&el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!('log' in d)) throw new Error('Not a Coach backup file');
      // Rebuild from the FILE, not from a fixed list of keys. Anything the
      // backup carries survives the restore, including keys written by a
      // newer version of the app than the one doing the restoring.
      DB=normalise(d);
      save(); render();
      alert('Backup restored — '+censusLine(DB)+'.');
    }catch(e){ alert('Could not read that file: '+e.message); }
    el.value='';
  };
  r.readAsText(f);
};
window.exportData=()=>{
  const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='coach-data.json';a.click();URL.revokeObjectURL(u);
};
