    <div class="sec mt"><b>Weeks 1–4 · Foundation.</b> Add the smallest available increment when form holds. Technique over load.</div>
    <div class="sec mt"><b>Weeks 5–8 · Overload.</b> Double progression — work up the rep range, then add weight.</div>
    <div class="sec mt"><b>Weeks 9–12 · Consolidation.</b> RPE 8–9 on primaries. Deload rather than push through if basketball or sleep is degrading.</div>
    <div class="note">Rest 90s on compounds, 60s on accessories. If a game leaves you beaten up, drop the next session’s load 10–15% rather than skipping it.</div>
  </details>`;

  h+=`<details><summary>Why it is built this way</summary>
    <div class="sec mt">Two gym sessions, so everything has to earn its place. Basketball already gives you jumping, deceleration, change of direction and conditioning. The gym covers what it does not: raw strength, posterior chain (the biggest lever against hamstring strains), single-leg strength, upper body, and calves/core for ankle and trunk resilience.</div>
    <div class="sec mt">No extra plyometrics — that would duplicate what two hours of basketball twice a week already does, at a real recovery cost.</div>
    <div class="sec mt">At around 27% body fat, losing fat <em>is</em> a performance move: less mass to accelerate, decelerate and jump with. The deficit is moderate on purpose — a steeper one costs you energy, gym performance and on-court sharpness, which defeats the point.</div>
  </details>`;

  h+=`<details><summary>Using the club properly</summary>
    <div class="sec mt"><b>BLAZE on Tuesday, once a week.</b> You enjoy it, and enjoyment keeps you turning up — that counts for more than the theoretical objection that it overlaps with basketball conditioning. Tuesday works because it is 24h after Monday’s game and 48h before Wednesday. Keep it to one a week: it is a genuinely hard session, and a second would start eating Thursday’s game.</div>
    <div class="sec mt"><b>If Thursday starts feeling flat, BLAZE is the first thing to drop</b> — not a gym day, and never basketball.</div>
    <div class="sec mt"><b>Yoga is the other one worth doing.</b> Hips and ankles feed straight into squat depth and landing mechanics, at almost no recovery cost.</div>
    <div class="sec mt"><b>No cycling</b> — off the table for your knee. It is cycling-specific, so nothing else here needs adjusting.</div>
    <div class="sec mt"><b>Other strength classes will not replace either gym session.</b> Light loads, high reps — fine if you enjoy them, but they will not progress your squat.</div>
    <div class="sec mt"><b>Cold plunge: not within about 4 hours of lifting.</b> This is the one facility with a real downside — cold-water immersion straight after resistance training measurably blunts the strength and muscle adaptations you just trained for. Use it after basketball, on rest days, or well separated from either gym session. Saunas do not have this problem.</div>
    <div class="sec mt"><b>Saunas, hot tub, pools, massage gun</b> — all fine any time, all count as club visits, and they are a large part of what the membership premium actually buys.</div>
    <div class="sec mt"><b>Tennis, badminton, pickleball</b> are good bonus movement, but they are high-intensity and on your feet like basketball. Keep them away from Monday and Thursday if your legs are already loaded.</div>
    <div class="sec mt"><b>Body Hub: use it monthly, not weekly.</b> Body-composition readings bounce around day to day. Monthly matches how we assess everything else — trends, not single numbers.</div>
  </details>`;
  h+=`<div class="banner b-info mt2">${I.alert}<div><b>Logging is manual.</b> A home-screen web app cannot read Apple Health — only a native App Store app can. Manual ticking takes seconds, and typing your top sets is what drives the progression targets anyway.</div></div>`;
  view.innerHTML=h;
}

/* ============================================================
   CLOUD SYNC — Firebase Auth (Google) + Firestore
   ------------------------------------------------------------
   Entirely optional. With no config the app runs exactly as
   before, storing everything locally on the device.
   ============================================================ */
const BUILD='2026-08-24 · v36';   // shown on the Sync tab — check this to confirm an update landed
const FBV='https://www.gstatic.com/firebasejs/10.12.5';

/* Firebase config lives in its own file — config.js — which this file never
   touches. That means updating the app is a straight overwrite of index.html
   and your sign-in keeps working. Falls back to a config pasted into the Sync
   tab, then to local-only. */
const FIREBASE_CONFIG = (typeof window!=='undefined' && window.FIREBASE_CONFIG) || null;

// Union-merge two DBs so signing in on a second device never destroys data.
/* ------------------------------------------------------------
   MERGING TWO COPIES OF THE STORE
   Signing in on a second device, or coming back online after
   editing offline, means two versions of the same data. The rule
   is union, never replace: a record that exists on either side
   survives. Newer wins only where the same field on the same day
   genuinely conflicts.
   ------------------------------------------------------------ */
function mergeList(N,O,id){
  const seen=new Set(), out=[];
  [...(N||[]),...(O||[])].forEach(v=>{ if(!v) return;
    let k; try{k=id(v);}catch(e){k=JSON.stringify(v);}
    if(!seen.has(k)){seen.add(k);out.push(v);} });
  return out;
}
// Merge one day's planned session: union the sets rather than letting
// the newer device's copy of the day replace the other's outright.
function mergeEntry(n,o){
  const out={...o,...n};
  out.sets   ={...(o.sets||{}),   ...(n.sets||{})};
  out.variant={...(o.variant||{}),...(n.variant||{})};
  out.exName ={...(o.exName||{}), ...(n.exName||{})};
  const ex=[...(n.extraEx||[]),...(o.extraEx||[])];
  out.extraEx=ex.filter((x,i)=>ex.findIndex(y=>y.k===x.k)===i);
  if(!out.extraEx.length) delete out.extraEx;
  return out;
}
function mergeWorkouts(n,o){
  const byId=new Map();
  (o||[]).forEach(w=>w&&byId.set(w.id||JSON.stringify(w),w));
  (n||[]).forEach(w=>{ if(!w) return;
    const k=w.id||JSON.stringify(w), prev=byId.get(k);
    byId.set(k, prev?{...prev,...w,sets:{...(prev.sets||{}),...(w.sets||{})}}:w); });
  return [...byId.values()];
}
function mergeByDate(N,O,of){
  const out={};
  new Set([...Object.keys(O||{}),...Object.keys(N||{})]).forEach(d=>{
    const n=(N||{})[d], o=(O||{})[d];
    if(n===undefined){ out[d]=o; return; }
    if(o===undefined){ out[d]=n; return; }
    if(of==='entry')         out[d]=mergeEntry(n,o);
    else if(of==='workouts') out[d]=mergeWorkouts(n,o);
    else if(of==='strings')  out[d]=[...new Set([...(o||[]),...(n||[])])];
    else                     out[d]=n;            // a single reading — newer wins
  });
  return out;
}
function mergeDB(a,b){
  const newer=(b.updatedAt||0)>(a.updatedAt||0)?b:a, older=newer===a?b:a;
  const out={};
  // Start by carrying EVERY key through, newer first. A key written by a
  // future version of the app is preserved even though nothing here knows
  // what it is — the alternative is silently deleting the user's data.
  Object.keys({...older,...newer}).forEach(k=>{
    if(k==='updatedAt') return;
    out[k] = newer[k]!==undefined ? newer[k] : older[k];
  });
  // Then merge properly the keys we do understand.
  Object.keys(SHAPE).forEach(k=>{
    const sp=SHAPE[k], N=newer[k], O=older[k];
    if(sp.kind==='byDate')     out[k]=mergeByDate(N,O,sp.of);
    else if(sp.kind==='list')  out[k]=mergeList(N,O,sp.id);
    else if(sp.kind==='obj')   out[k]=Object.assign({},sp.def||{},O||{},N||{});
    else                       out[k]=N||O||null;
  });
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return out;
}

const Cloud=(()=>{
  let app=null,auth=null,fs=null,api=null,user=null,timer=null,
      status='off', lastSync=0, err='';

  // Built-in config wins; the Sync tab is a fallback for one-off devices.
  const cfg=()=>(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)?FIREBASE_CONFIG:Store.get('coach.fbcfg',null);
  const builtIn=()=>!!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey);
  const setStatus=(s,e='')=>{status=s;err=e;if(TAB==='sync')render();else updateBadge();};

  function resolvedAuthDomain(c){
    const h=location.hostname;
    // Same-origin authDomain is required for signInWithRedirect to work in
    // Safari / iOS standalone apps. Firebase Hosting serves the auth handler
    // on both *.web.app and *.firebaseapp.com, so this is safe there.
    if(/\.web\.app$|\.firebaseapp\.com$/.test(h)) return h;
    return c.authDomain;
  }
  const sameOrigin=c=>resolvedAuthDomain(c)===location.hostname;

  async function init(){
    const c=cfg();
    if(!c||!c.apiKey||!c.projectId){setStatus('off');return;}
    try{
      setStatus('connecting');
      const [A,Au,Fs]=await Promise.all([
        import(`${FBV}/firebase-app.js`),
        import(`${FBV}/firebase-auth.js`),
        import(`${FBV}/firebase-firestore.js`)
      ]);
      api={...Au,...Fs};
      app=A.initializeApp({...c,authDomain:resolvedAuthDomain(c)});
      auth=Au.getAuth(app); fs=Fs.getFirestore(app);
      try{ await Au.getRedirectResult(auth); }catch(e){ /* surfaced by onAuthStateChanged */ }
      Au.onAuthStateChanged(auth,async u=>{
        user=u;
        if(u){ setStatus('syncing'); await pull(); setStatus('on'); }
        else setStatus('out');
        render();
      });
    }catch(e){ setStatus('error','Could not load Firebase: '+e.message); }
  }

  async function signIn(){
    const c=cfg(); if(!auth){await init();}
    if(!auth){setStatus('error','Firebase is not configured yet.');return;}
    const p=new api.GoogleAuthProvider();
    try{
      // Redirect is the reliable flow inside an iOS home-screen app, but only
      // when the auth domain matches the site's own origin.
      if(sameOrigin(c)) await api.signInWithRedirect(auth,p);
      else await api.signInWithPopup(auth,p);
    }catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
        try{ await api.signInWithRedirect(auth,p); }
        catch(e2){ setStatus('error',e2.message); }
      } else setStatus('error',e.code==='auth/unauthorized-domain'
        ? `This domain (${location.hostname}) is not authorised in Firebase → Authentication → Settings → Authorized domains.`
        : e.message);
    }
  }
  async function doSignOut(){ if(auth){ await api.signOut(auth); user=null; setStatus('out'); render(); } }

  async function pull(){
    if(!user||!fs) return;
    try{
      const ref=api.doc(fs,'users',user.uid);
      const snap=await api.getDoc(ref);
      if(snap.exists()){
        DB=mergeDB(DB,snap.data());
        Store.set('coach.db',DB);
      }
      await push(true);
      lastSync=Date.now();
    }catch(e){ setStatus('error',e.message); }
  }

  async function push(silent){
    if(!user||!fs) return;
    try{
      await api.setDoc(api.doc(fs,'users',user.uid),JSON.parse(JSON.stringify(DB)));
      lastSync=Date.now();
      if(!silent) setStatus('on');
    }catch(e){ setStatus('error',e.message); }
  }

  function queue(){ if(!user) return; clearTimeout(timer); timer=setTimeout(()=>push(),1200); }

  function updateBadge(){
    const el=document.getElementById('syncDot'); if(!el) return;
    el.style.background = status==='on'?'var(--good)' : status==='error'?'var(--critical)'
      : status==='syncing'||status==='connecting'?'var(--warning)':'var(--muted)';
  }

  return{init,signIn,signOut:doSignOut,queue,pull,push,get builtIn(){return builtIn()},
    get user(){return user}, get status(){return status}, get err(){return err},
    get lastSync(){return lastSync}, get configured(){return !!cfg()},
    get sameOrigin(){const c=cfg();return c?sameOrigin(c):false},
    saveCfg(o){Store.set('coach.fbcfg',o);init();},
    clearCfg(){Store.set('coach.fbcfg',null);location.reload();}};
})();
window.Cloud=Cloud;

function recordCards(){
  const names={squat:'Back Squat',rdl:'Romanian Deadlift',chest:'Chest Press',pull:'Lat Pulldown',
               ohp:'Shoulder Press',row:'Seated Row',push2:'Dip / second push',calf:'Calf Raise',
               pallof:'Pallof Press',carry:'Carry'};
  const recs=[];
  Object.keys(names).forEach(k=>{
    let best=null;
    Object.keys(DB.log).forEach(d=>{
      const rec=DB.log[d], st=rec?.sets?.[k]; if(!st) return;
      if((rec.variant&&rec.variant[k])||0) return;      // primary movement only
      st.forEach(x=>{ const w=parseFloat(x?.w), r=parseInt(x?.r);
        if(!isNaN(w)&&w>0&&(!best||w>best.w||(w===best.w&&r>best.r))) best={w,r:isNaN(r)?0:r,d}; });
    });
    if(best) recs.push({k,n:names[k],...best});
  });
  let h='';
  if(!recs.length) return '';
  h+=`<div class="card"><h3>Best set on each lift</h3>
    <table class="mt"><thead><tr><th>Lift</th><th class="num">Best</th><th class="num">When</th></tr></thead><tbody>
    ${recs.sort((a,b)=>b.w-a.w).map(r=>`<tr><td>${r.n}</td>
      <td class="num" style="color:var(--green);font-weight:700">${r.w}kg${r.r?` × ${r.r}`:''}</td>
      <td class="num muted">${fmtD(r.d).replace(/^\w+, /,'')}</td></tr>`).join('')}
    </tbody></table>
    <div class="note">Only counts your primary movement — a leg press does not become a squat record. Substituted sessions are tracked separately.</div>
  </div>`;
  const est=recs.find(r=>r.k==='squat');
  if(est&&est.r>=3&&est.r<=10){
    const e1=Math.round(est.w*(1+est.r/30));
    h+=`<div class="card"><h3>Estimated squat max</h3>
      <div class="hero mt">${e1}<span class="u"> kg</span></div>
      <div class="sec">From ${est.w}kg × ${est.r}</div>
      <div class="note">An estimate from a rep-max formula, not a number to go and test. It is useful for seeing the trend, and for setting working weights at roughly 75–85% of it.</div>
    </div>`;
  }
  return h;
}



/* ============================================================
   MAGIC SUGGESTION
   ------------------------------------------------------------
   Reads your history for that movement, what you have trained
   in the last 48h, and any open niggles, then proposes a load
   and rep target — with the reasoning, so you can disagree.
   ============================================================ */
const NIGGLE_AREA={
  'Knee':['Legs'],'Hip':['Legs'],'Hamstring':['Legs'],'Calf':['Legs'],'Ankle':['Legs'],
  'Lower back':['Legs','Pull'],'Shoulder':['Push','Pull'],'Elbow':['Push','Arms'],
  'Wrist':['Push','Arms'],'Other':[]
};
function recentLoad(area,ds){
  // did the same pattern get hit in the previous 2 days?
  let hits=0;
  for(let i=1;i<=2;i++){
    const d=iso(addD(parse(ds),-i));
    const e=DB.log[d];
    Object.keys((e&&e.sets)||{}).forEach(k=>{ if((LIB_AREA[k]||'')===area) hits++; });
    adhocList(d).forEach(w=>(w.ex||[]).forEach(x=>{ if(LIB_AREA[x.n]===area) hits++; }));
  }
  return hits;
}
// A movement can be stored under the programme's short key (squat), its slug
// (back-squat) from a random workout, or x_<slug> when added as an extra.
const NAME_KEYS=(()=>{
  const m={};
  ['gymA','gymB'].forEach(g=>(PROGRAMME_M[g].ex||[]).forEach(x=>{
    m[x.n]=m[x.n]||[]; m[x.n].push(x.k);
    (x.alts||[]).forEach(a=>{ m[a.n]=m[a.n]||[]; m[a.n].push(x.k); });
  }));
  return m;
})();
function keysFor(name){
  const out=new Set(NAME_KEYS[name]||[]);
  out.add(slug(name)); out.add('x_'+slug(name));
  return [...out];
}
// What movement was actually recorded under this key on this day?
function storedName(e,k){
  for(const g of ['gymA','gymB']){
    const x=(PROGRAMME_M[g].ex||[]).find(z=>z.k===k);
    if(x) return exVariant(x,(e.variant&&e.variant[k])||0).n;
  }
  const ex=(e.extraEx||[]).find(z=>z.k===k);
  return ex?ex.n:null;
}
function magicHint(name,ds){
  const area=LIB_AREA[name]||'Mobility';
  const ks=keysFor(name);
  const nig=(DB.niggles||[]).filter(n=>!n.resolved&&(NIGGLE_AREA[n.area]||[]).includes(area));
  const worst=nig.reduce((m,n)=>Math.max(m,n.level),0);

  // Most recent time THIS movement was done — not just this movement pattern.
  let best=null;
  Object.keys(DB.log).filter(d=>d<=ds).sort().reverse().some(d=>{
    const e=DB.log[d];
    const hit=Object.keys(e.sets||{}).find(key=>ks.includes(key)&&storedName(e,key)===name);
    if(hit){ const sum=setSummary(e.sets[hit]); if(sum&&sum.top!=null){ best={top:sum.top,reps:sum.reps,rpe:e.rpe,d}; return true; } }
    return false;
  });
  if(!best){
    Object.keys(DB.adhoc||{}).filter(d=>d<=ds).sort().reverse().some(d=>
      adhocList(d).some(w=>{
        const x=(w.ex||[]).find(z=>z.n===name); if(!x) return false;
        const sum=setSummary((w.sets||{})[x.k]);
        if(sum&&sum.top!=null){ best={top:sum.top,reps:sum.reps,rpe:w.rpe,d}; return true; }
        return false;
      }));
  }

  const rec=recentLoad(area,ds);
  let reps=best&&best.reps?best.reps:'8–12';

  if(!best){
    const why=[];
    if(worst>=3) why.push(`a level ${worst} ${nig[0].area.toLowerCase()} niggle means go very light here, or skip it`);
    else if(worst===2) why.push(`ease off — ${nig[0].area.toLowerCase()} niggle`);
    if(rec>=3) why.push(`${area.toLowerCase()} was trained in the last 48h`);
    return {text:`No history for this yet — start light, find a weight you control for ${reps} reps, and log it.${why.length?' Also: '+why.join('; ')+'.':''}`,w:null,reps};
  }

  // base progression from last time
  let base, lead;
  if(best.rpe>=5){ base=Math.round(best.top*0.9*2)/2; lead=`last one was maximal at ${best.top}kg, so back off`; }
  else if(best.rpe===4){ base=best.top; lead=`last one was hard at ${best.top}kg, so hold`; }
  else { base=best.top+(BIG_LEG.includes(name)?5:2.5); lead=`${best.top}kg last time, so go up`; }

  // then adjust for how you are actually feeling
  let w=base; const adj=[];
  if(worst>=3){ w=Math.round(base*0.8*2)/2; reps='12–15';
    adj.push(`cut back for a level ${worst} ${nig[0].area.toLowerCase()} niggle — light or skip`); }
  else if(worst===2){ w=Math.round(base*0.9*2)/2;
    adj.push(`eased off for a ${nig[0].area.toLowerCase()} niggle`); }
  if(rec>=3){ if(!adj.length) w=Math.round(base*0.95*2)/2;
    adj.push(`${area.toLowerCase()} already trained in the last 48h`); }

  const when=fmtD(best.d).replace(/^\w+, /,'');
  const text = adj.length
    ? `${w}kg × ${reps} — ${lead} to ${base}kg, but ${adj.join(' and ')} (${when})`
    : `${w}kg × ${reps} — ${lead} (${when})`;
  return {text,w,reps};
}

/* ============================================================
   HISTORY — every rep, every mile, one table
   ------------------------------------------------------------
   Gym sets and cardio do not share units, so instead of forcing
   them into the same columns the table uses three neutral value
   columns and labels the units per row.
   ============================================================ */
const CAT_ORDER=['Gym','Basketball','Class','Sport','Cardio','Recovery','Other'];
function catOf(sub,cat){
  if(cat==='Class') return 'Class';
  if(cat==='Sport') return 'Sport';
  if(cat==='Recovery') return 'Recovery';
  if(cat==='Cardio') return 'Cardio';
  return 'Other';
}
function setSummary(sets){
  const done=(sets||[]).filter(v=>v&&(v.w||v.r));
  if(!done.length) return null;
  const ws=done.map(v=>parseFloat(v.w)).filter(n=>!isNaN(n));
  const rs=done.map(v=>parseInt(v.r)).filter(n=>!isNaN(n));
  const top=ws.length?Math.max(...ws):null;
  const vol=done.reduce((t,v)=>t+((parseFloat(v.w)||0)*(parseInt(v.r)||0)),0);
  return {sets:done.length,top,reps:rs.length?(rs.every(r=>r===rs[0])?String(rs[0]):`${Math.min(...rs)}–${Math.max(...rs)}`):null,vol};
}
// key -> readable name, across every session in the programme. Used as a
// fallback when a set was logged under a session that no longer lists that key.
const KEY_NAME=(()=>{
  const m={};
  Object.keys(PROGRAMME_M||{}).forEach(g=>((PROGRAMME_M[g]||{}).ex||[]).forEach(x=>{ m[x.k]=m[x.k]||x.n; }));
  Object.assign(m,{squat:'Back Squat',rdl:'Romanian Deadlift',chest:'Chest Press',pull:'Lat Pulldown',
    ohp:'Shoulder Press',row:'Seated Row',push2:'Dip / second push',calf:'Calf Raise',
    pallof:'Pallof Press',carry:'Suitcase Lunge'});
  return m;
})();
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const keyName=k=>KEY_NAME[k]||String(k).replace(/^x_/,'').replace(/-/g,' ')
  .replace(/\b\w/g,c=>c.toUpperCase());

// One flat, sortable list of everything ever logged.
function historyRows(){
  const out=[];
  // planned sessions
  Object.keys(DB.log).forEach(d=>{
    const e=DB.log[d]; if(!e) return;
    const prog=PROGRAMME[e.type];
    // One summary row per session, whatever the type — this is where the
    // difficulty, how you felt and the recovery you took actually land.
    const logged=e.done||Object.keys(e.sets||{}).length||e.rpe||e.mood||e.recovery!=null;
    if(logged&&e.type!=='rest'&&e.type!=='open'){
      const label=e.type==='bball'?'Basketball':(prog?prog.label:'Session');
      out.push({d,cat:e.type==='bball'?'Basketball':'Gym',name:label,
        v1:'—', v2:e.type==='bball'?'2 h':(e.recovery!=null?`${e.recovery} min recovery`:'—'),
        v3:e.rpe?DIFF_LABEL[e.rpe-1]:'—',
        note:['session summary',e.mood?`felt ${MOOD_LABEL[e.mood-1]}`:''].filter(Boolean).join(' · ')});
    }
    const named={};
    (prog&&prog.ex||[]).forEach(x=>{ const vi=(e.variant&&e.variant[x.k])||0; named[x.k]=exVariant(x,vi).n; });
    (e.extraEx||[]).forEach(x=>{ named[x.k]=x.n+' (extra)'; });
    Object.keys(e.sets||{}).forEach(k=>{
      const sum=setSummary(e.sets[k]); if(!sum) return;
      out.push({d,cat:'Gym',name:(e.exName&&e.exName[k])||named[k]||keyName(k),
        v1:sum.top!=null?`${sum.top} kg`:'—', v2:sum.reps?`${sum.reps} reps`:'—', v3:plural(sum.sets,'set'),
        note:sum.vol?`${Math.round(sum.vol)} kg volume`:'', session:prog?prog.label:''});
    });
  });
  // random workouts
  Object.keys(DB.adhoc||{}).forEach(d=>{
    adhocList(d).forEach(w=>{
      if(!w.accepted) return;
      out.push({d,cat:'Gym',name:`${w.focusLabel||'Random'} workout`,
        v1:'—', v2:w.recovery!=null?`${w.recovery} min recovery`:(w.mins?`${w.mins} min`:'—'),
        v3:w.rpe?DIFF_LABEL[w.rpe-1]:'—',
        note:['session summary',w.mood?`felt ${MOOD_LABEL[w.mood-1]}`:''].filter(Boolean).join(' · ')});
      (w.ex||[]).forEach(x=>{
        const sum=setSummary((w.sets||{})[x.k]);
        out.push({d,cat:'Gym',name:x.n,
          v1:sum&&sum.top!=null?`${sum.top} kg`:'—',
          v2:sum&&sum.reps?`${sum.reps} reps`:'—',
          v3:sum?plural(sum.sets,'set'):'—',
          note:`${w.focusLabel||'Random'} workout`, session:'Random workout'});
      });
    });
  });
  // recovery sessions
  Object.keys(DB.recovery||{}).forEach(d=>{
    recList(d).forEach(w=>{
      const nDone=Object.values(w.did||{}).filter(Boolean).length;
      const V=REC_VENUE.find(v=>v.k===w.venue);
      out.push({d,cat:'Recovery',name:w.focusLabel,
        v1:V?V.t:'—', v2:w.mins?`${w.mins} min`:'—', v3:`${nDone}/${(w.ex||[]).length} done`,
        note:['session summary',w.mood?`felt ${MOOD_LABEL[w.mood-1]}`:''].filter(Boolean).join(' · ')});
      (w.ex||[]).forEach(x=>{
        out.push({d,cat:'Recovery',name:x.n,v1:'—',v2:x.t,
          v3:(w.did||{})[x.k]?'done':'—', note:w.focusLabel});
      });
    });
  });

  // logged activities
  (DB.activities||[]).forEach(a=>{
    const v=a.vals||{};
    const dist=v.dist?`${v.dist} km`:(v.pace?`${v.pace} /km`:'—');
    const time=v.time?`${v.time} min`:'—';
    const cal=v.cal?`${v.cal} kcal`:'—';
    out.push({d:a.date,cat:catOf(a.sub,a.cat),name:a.sub,v1:dist,v2:time,v3:cal,note:a.note||''});
  });
  // bonus extras with nothing else recorded
  Object.keys(DB.bonus||{}).forEach(d=>{
    (DB.bonus[d]||[]).forEach(k=>{
      if(['adhoc','activity','extra','recovery'].includes(k)) return;
      const b=BONUS[k]; if(!b) return;
      const cat=['sauna','plunge','hottub','massage'].includes(k)?'Recovery'
              :['blaze','yoga'].includes(k)?'Class'
              :k==='racquet'?'Sport':k==='run'?'Cardio':k==='swim'?'Cardio':'Other';
      out.push({d,cat,name:b.label,v1:'—',v2:'—',v3:'—',note:'bonus extra'});
    });
  });
  return out.sort((a,b)=> a.d<b.d?1 : a.d>b.d?-1 : 0);   // newest first
}

/* ---------- 3. PROGRESS REVIEW ---------- */
function vReview(){
  const t=todayISO();
  const wNow=avg7(t), wThen=avg7(iso(addD(new Date(),-21)));
  const trend = (wNow!=null&&wThen!=null) ? wNow-wThen : null;
  // strength change across the block
  let up=0,down=0,flat=0;
  ['squat','rdl','chest','pull','ohp','row'].forEach(k=>{
    const ds=Object.keys(DB.log).filter(d=>DB.log[d]?.sets?.[k]?.[0]?.w&&!((DB.log[d].variant||{})[k])).sort();
    if(ds.length<2) return;
    const a=parseFloat(DB.log[ds[0]].sets[k][0].w), b=parseFloat(DB.log[ds[ds.length-1]].sets[k][0].w);
    if(b>a) up++; else if(b<a) down++; else flat++;
  });
  const weeks=allWeeks().filter(w=>weekStatus(w).complete&&weekStatus(w).state!=='prestart');
  const onTrack=weeks.filter(w=>weekStatus(w).state==='ontrack').length;
  const feels=Object.keys(DB.log).filter(d=>DB.log[d].rpe||DB.log[d].mood).sort().slice(-6);
  const avg=(arr,f)=>{const v=arr.map(d=>DB.log[d][f]).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const mood=avg(feels,'mood'), rpe=avg(feels,'rpe');

  // The actual coaching call
  let verdict, why, tone='b-info';
  if(trend==null){ verdict='Not enough data yet'; why='Log your morning weight for two to three weeks and this becomes useful. Single readings tell you nothing.'; }
  else if(trend<-0.4 && down===0){ verdict='Working — change nothing'; tone='b-info';
    why='Weight is coming down and your lifts are holding or climbing. That is fat loss with muscle protected, which is exactly the target. Do not cut calories further just because it is going well.'; }
  else if(trend<-0.4 && down>up){ verdict='Deficit too aggressive'; tone='b-warn';
    why='Weight is falling but more lifts are going backwards than forwards. Add roughly 150–200 kcal a day, mostly as carbs around training, and hold there for two weeks.'; }
  else if(trend>-0.15 && trend<0.15){ verdict='Stalled'; tone='b-warn';
    why='The 3-week trend is flat. Before cutting calories, check your logging is honest for a week — weighing food, counting drinks and weekends. If it genuinely is, drop about 150–200 kcal a day.'; }
  else if(trend>=0.15){ verdict='Weight trending up'; tone='b-warn';
    why='If this is not deliberate, the most likely cause is unlogged food rather than metabolism. Tighten the logging for a fortnight before changing anything.'; }
  else { verdict='On track'; why='Trend is moving the right way. Keep going and reassess in a fortnight.'; }

  let h=backBar();
  h+=`<div class="card"><h3>Where you are</h3>
    <div class="hero mt" style="font-size:26px;line-height:1.25">${verdict}</div>
    <div class="banner ${tone} mt">${tone==='b-warn'?I.alert:I.check}<div>${why}</div></div>
  </div>`;
  h+=`<div class="card"><h3>The four signals</h3>
    <table class="mt"><tbody>
      <tr><td>Weight, 3-week trend</td><td class="num">${trend==null?'—':`${trend>0?'+':''}${trend.toFixed(1)} lb`}</td></tr>
      <tr><td>Lifts up / flat / down</td><td class="num">${up} / ${flat} / ${down}</td></tr>
      <tr><td>Weeks on track</td><td class="num">${onTrack} of ${weeks.length}</td></tr>
      <tr><td>Difficulty · felt</td><td class="num">${rpe?rpe.toFixed(1):'—'} · ${mood?mood.toFixed(1):'—'}</td></tr>
    </tbody></table>
    <div class="note">Judged together, never one at a time. Falling weight only counts as success if your lifts hold — otherwise you are losing the muscle you are training to keep.</div>
  </div>`;
  h+=`<div class="card"><h3>Review points</h3>
    <table class="mt"><tbody>
      ${[4,8,12].map(w=>{const cur=weekNum(new Date());
        return `<tr><td>Week ${w}</td><td class="num ${cur>=w?'':'muted'}">${cur>w?'passed':cur===w?'now':`in ${w-cur} weeks`}</td></tr>`;}).join('')}
    </tbody></table>
    <div class="note">Export your data from the Sync tab at each of these and send it over — the numbers make the conversation far more useful than memory does.</div>
  </div>`;
  view.innerHTML=h;
}

/* ------------------------------------------------------------
   RECOVERY SESSIONS
   Same idea as the random workout, aimed at keeping you on the
   court rather than adding training load. Nothing here should
   leave you tired.
   ------------------------------------------------------------ */
const RECOVERY_TARGETS=[
  {k:'all', t:'All-rounder', why:'A bit of everything — spine, hips, shoulders, ankles. The default when nothing in particular hurts.',
   floor:[['Cat–Cow','8 slow cycles'],['Open Book Rotation','8 each side'],['90/90 Hip Switch','10 switches'],
          ['World’s Greatest Stretch','5 each side'],['Deep Squat Hold','2 × 45s'],['Dead Hang','3 × 30s'],
          ['Bird Dog','8 each side'],['Hip Adduction','2 × 15'],['Knee-to-Wall Ankle Rock','10 each side']]},
  {k:'knee', t:'Knee', why:'Isometrics and slow lowering. This is what settles an irritable knee — not rest, and not stretching it.',
   floor:[['Wall Sit','3 × 45s'],['Spanish Squat','3 × 10 slow'],['Terminal Knee Extension','2 × 15 each'],
          ['Slow Step-down','3 × 8 each side'],['Seated Leg Extension','3 × 20 light'],['Hip Abduction','3 × 18'],
          ['Standing DB Calf Raise','2 × 15'],['Seated Leg Curl','2 × 12 light'],
          ['Couch Stretch','60s each side'],['Deep Squat Hold','2 × 45s']]},
  {k:'wrist', t:'Wrists', why:'Everything you lift closes the hand. This opens it again and loads the wrist through its full range.',
   floor:[['Wrist CARs','10 each direction'],['Wrist Rocks','10 each position'],['Reverse Wrist Curl','3 × 15 light'],
          ['Wrist Curl','3 × 15 light'],['Finger Extension','3 × 20'],['Dead Hang','3 × 30s']]},
  {k:'back', t:'Back', why:'Control and gentle extension rather than stretching. A back that aches usually needs stability, not more range.',
   floor:[['Cat–Cow','8 slow cycles'],['Prone Press-up','10 reps'],['Bird Dog','8 each side'],['Dead Bug','8 each side'],
          ['McGill Curl-up','5 × 10s hold'],['Hip Hinge Drill','10 reps'],['Dead Hang','3 × 30s'],['90/90 Hip Switch','10 switches']]},
  {k:'ankle', t:'Ankle', why:'The joint that decides how deep you squat and how often you roll one on court.',
   floor:[['Knee-to-Wall Ankle Rock','15 each side'],['Ankle CARs','10 each direction'],['Single-leg Balance','3 × 30s each'],
          ['Toe Yoga','10 each way'],['Standing DB Calf Raise','3 × 15'],['Single-leg Step Calf Raise','2 × 12 each'],
          ['Hip Abduction','3 × 18'],['Deep Squat Hold','2 × 45s']]},
  {k:'posture', t:'Posture', why:'Getting the shoulders back where they belong. Upper back and the muscles that hold the shoulder blades down.',
   floor:[['Wall Slides','10 slow reps'],['Band or cable pull-aparts','3 × 20'],['Face Pull','3 × 18 light'],
          ['Prone Y-T-W','8 of each'],['Thoracic Extension over a Bench','3 × 30s'],['Open Book Rotation','8 each side'],
          ['Doorway or cable chest stretch','45s each side'],['Chin Tuck','10 × 5s']]}
];
// Pool and spa work is the same whatever is sore — the venue is the point.
const REC_POOL=[['Easy Swim','10–15 min'],['Water Walking','5 min, all directions'],
                ['Flutter Kick on a Board','4 lengths'],['Deep Squat Hold','3 × 30s in chest-deep water']];
const REC_SPA=[['Sauna','15–20 min'],['Steam Room','10–15 min'],['Hot Tub','10–15 min'],['Massage Gun','90s per tight area']];
const REC_VENUE=[{k:'floor',t:'Gym floor'},{k:'pool',t:'Pool'},{k:'spa',t:'Spa'}];
const REC_MINS={10:4,15:5,20:6,30:8};

function genRecovery(targetKey,mins,venue){
  const T=RECOVERY_TARGETS.find(t=>t.k===targetKey)||RECOVERY_TARGETS[0];
  const src = venue==='pool'?REC_POOL : venue==='spa'?REC_SPA : T.floor;
  const n=Math.min(REC_MINS[mins]||5, src.length);
  const pool=[...src], picked=[];
  // keep the listed order — these are sequenced deliberately, not random
  for(let i=0;i<n;i++) picked.push(pool[i]);
  return {mode:'recovery', focus:targetKey, focusLabel:T.t+' recovery', venue, mins,
          intensity:'easy', rpeNote:T.why,
          ex:picked.map(([n2,dose])=>({n:n2,k:slug(n2),t:dose}))};
}

const POOL={
  legs:['Back Squat','Linear Hack Squat','Seated Leg Press','Goblet Squat','Dumbbell Romanian Deadlift',
        'Seated Leg Curl','Single-leg DB RDL','Standing DB Calf Raise','Leg Press Calf Raise'],
  push:['Chest Press','DB Bench Press','Incline Press','Shoulder Press','DB Overhead Press',
        'Assisted Dip','Cable Triceps Pushdown'],
  pull:['Lat Pulldown','Assisted Chin-up','Seated Row','Cable Low Row','Single-arm DB Row',
        'Plate-loaded Row','EZ-Bar Preacher Curl'],
  core:['Pallof Press','Dead Bug','Abdominal Machine','Farmer’s Carry','Suitcase Lunge'],
  arms:['EZ-Bar Preacher Curl','Cable Triceps Pushdown','Assisted Chin-up','Assisted Dip','Single-arm DB Row']
};
const FOCUS=[
  {k:'full', t:'Full body',    mix:['legs','push','pull','core']},
  {k:'legs', t:'Legs',         mix:['legs','legs','legs','core']},
  {k:'upper',t:'Upper body',   mix:['push','pull','push','pull']},
  {k:'push', t:'Push',         mix:['push','push','push','core']},
  {k:'pull', t:'Pull',         mix:['pull','pull','pull','core']},
  {k:'arms', t:'Arms',         mix:['arms','arms','arms','core']},
  {k:'core', t:'Core',         mix:['core','core','core','core']}
];
const INTENSITY={
  easy:     {t:'Easy',     sets:2, reps:'12–15', rpe:'RPE 6 — comfortable, leave plenty in the tank'},
  moderate: {t:'Moderate', sets:3, reps:'8–12',  rpe:'RPE 7–8 — two or three reps left at the end'},
  hard:     {t:'Hard',     sets:4, reps:'5–8',   rpe:'RPE 8–9 — one or two reps left, and only when fresh'}
};
const MINS={20:3,30:4,45:5,60:6};

function genWorkout(focusKey,mins,intKey){
  const F=FOCUS.find(f=>f.k===focusKey), n=MINS[mins]||4, I=INTENSITY[intKey];
  const picked=[], used=new Set();
  for(let i=0;i<n;i++){
    const group=F.mix[i%F.mix.length];
    const opts=POOL[group].filter(x=>!used.has(x));
    const list=opts.length?opts:POOL[group];
    const pick=list[Math.floor(Math.random()*list.length)];
    used.add(pick);
    picked.push({n:pick,k:slug(pick),t:`${I.sets} × ${I.reps}`});
  }
  return {focus:focusKey,focusLabel:F.t,mins,intensity:intKey,ex:picked,rpeNote:I.rpe};
}

// Honest guardrail: a hard legs session next to a game is a bad trade.
function adhocWarning(w){
  const d=new Date(), dow=d.getDay();
  const legsy=['legs','full'].includes(w.focus);
  const gameTomorrow=[0,3].includes(dow);          // Sun→Mon game, Wed→Thu game
  const gameToday=[1,4].includes(dow);
  if(legsy&&w.intensity==='hard'&&gameTomorrow)
    return 'Hard legs the day before a game will cost you on court. Drop to moderate, or switch the focus to upper body.';
  if(legsy&&gameToday)
    return 'You have a 2-hour game today. Anything heavy on legs now competes directly with it.';
  if(dow===5&&legsy)
    return 'Gym — Lower already trains legs hard today. Doing both is more volume than it is worth.';
  return null;
}

function adhocList(ds){ const a=DB.adhoc[ds]; return Array.isArray(a)?a:(a?[a]:[]); }

// exercise ↔ equipment, both directions, derived from the guides
const EQUIP_EX=(()=>{
  const map={}; EQUIP.forEach(e=>map[e.id]=[]);
  Object.keys(GUIDE).forEach(n=>{
    const kit=(GUIDE[n].kit||'').toLowerCase();
    if(!kit||kit==='nothing') return;
    EQUIP.forEach(e=>{ if(e.m.some(k=>kit.includes(k))) map[e.id].push(n); });
  });
  Object.keys(map).forEach(k=>map[k].sort());
  return map;
})();
const EX_EQUIP=(()=>{
  const map={};
  Object.keys(EQUIP_EX).forEach(id=>EQUIP_EX[id].forEach(n=>{ (map[n]=map[n]||[]).push(id); }));
  return map;
})();
const EQ_CATS=[...new Set(EQUIP.map(e=>e.cat))];

function vEquipment(){
  const q=(Store.get('coach.eqQ','')||'').toLowerCase();
  const fCat=Store.get('coach.eqCat','All');
  let items=EQUIP.slice();
  if(fCat!=='All') items=items.filter(e=>e.cat===fCat);
  if(q) items=items.filter(e=>e.n.toLowerCase().includes(q)||e.targets.toLowerCase().includes(q)
    ||e.p.toLowerCase().includes(q)||EQUIP_EX[e.id].some(n=>n.toLowerCase().includes(q)));

  let h=backBar();
  h+=`<div class="card">
    <input id="eqQ" placeholder="Search equipment, muscles, exercises…" value="${q}" oninput="eqSearch(this.value)">
    <div class="chips mt">${['All',...EQ_CATS].map(c=>
      `<button class="chip${c===fCat?' on':''}" onclick="libSet('eqCat','${c}')">${c}</button>`).join('')}</div>
    <div class="muted mt">${items.length} of ${EQUIP.length}</div>
  </div>`;

  if(!items.length){
    h+=`<div class="card"><div class="muted">Nothing matches. Try clearing a filter.</div></div>`;
    view.innerHTML=h; return;
  }
  let group='';
  items.forEach(e=>{
    if(e.cat!==group){ group=e.cat; h+=`<h3 class="mt2" style="margin-bottom:8px">${group}</h3>`; }
    const ex=EQUIP_EX[e.id];
    h+=`<div class="card"><div class="row"><div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:15px">${e.n}</div>
        <div class="muted" style="margin-top:2px">${e.targets}</div>
      </div></div>
      <div class="note" style="margin-top:9px">${e.p}</div>
      ${ex.length?`<div style="margin-top:11px"><div class="f" style="margin-bottom:6px">What you do on it</div>
        <div class="eqEx">${ex.map(n=>`<button class="chip" onclick="openGuide(${JSON.stringify(n).replace(/"/g,'&quot;')})">${n}</button>`).join('')}</div></div>`
        :`<div class="muted" style="margin-top:10px;font-size:12.5px">Nothing in your programme uses this yet.</div>`}
    </div>`;
  });
  view.innerHTML=h;
}

/* ---------- RECOVERY SESSIONS ---------- */
function recList(ds){ const a=(DB.recovery||{})[ds]; return Array.isArray(a)?a:(a?[a]:[]); }
let REC_IDX=null, REC_NEW=false;
window.shiftRecDay=n=>{
  const d=iso(addD(parse(curDate()),n));
  VIEW_DATE = d>todayISO()? null : d;
  REC_IDX=null; REC_NEW=false; render();
};
window.openRec=i=>{ REC_IDX=i; window.scrollTo(0,0); render(); };
window.closeRec=()=>{ REC_IDX=null; REC_NEW=false; window.scrollTo(0,0); render(); };
window.newRec=()=>{ REC_IDX=null; REC_NEW=true; window.scrollTo(0,0); render(); };

function vRecovery(){
  const ds=curDate(), isToday=ds===todayISO();
  const list=recList(ds);
  let h=backBar();

  h+=`<div class="weeknav" style="margin-bottom:12px">
    <button onclick="shiftRecDay(-1)">‹</button>
    <div><div class="wl">${isToday?'Today':fmtD(ds).replace(/^(\w+), /,'$1 ')}</div>
    <div class="wd">${isToday?'':'logging a past day'}</div></div>
    <button onclick="shiftRecDay(1)" ${isToday?'disabled style="opacity:.3"':''}>›</button>
  </div>`;

  /* ---- an open session ---- */
  if(REC_IDX!=null && list[REC_IDX]){
    const i=REC_IDX, w=list[i];
    const done=(DB.bonus[ds]||[]).includes('recovery');
    const V=REC_VENUE.find(v=>v.k===w.venue);
    h+=`<div class="card"><div class="row"><div>
      <h2>${w.focusLabel}</h2>
      <div class="sec">${V?V.t:''} · ${w.mins} min${list.length>1?` · session ${i+1} of ${list.length}`:''}</div>
    </div>${done?pill('bonus'):''}</div>
    <div class="note">${w.rpeNote}</div></div>`;

    h+=`<h3 style="margin:0 0 8px">Work through these</h3>`;
    w.ex.forEach(x=>{
      const on=(w.did||{})[x.k];
      h+=`<div class="card tight recRowItem${on?' done':''}">
        <button class="tick${on?' on':''}" onclick="recTick('${i}','${x.k}')" aria-label="Mark ${x.n} done">${on?I.check:''}</button>
        <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0" onclick="openGuide(${JSON.stringify('').slice(0,0)}${JSON.stringify(x.n).replace(/"/g,'&quot;')})">
          ${poseIcon(x.n)}
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14.5px">${x.n}</div>
            <div class="muted">${x.t}</div>
          </div>
          <div class="muted" style="font-size:18px">›</div>
        </div>
      </div>`;
    });

    const nDone=Object.values(w.did||{}).filter(Boolean).length;
    h+=`<div class="card"><h3>How was that?</h3>
      <div class="muted mt">${nDone} of ${w.ex.length} done</div>
      ${feelScaleRec(i,'mood')}
      <button class="btn ${done?'':'primary'} mt" onclick="finishRec()">${done?'Logged ✓ — tap to undo':'Mark done — earns a ★'}</button>
    </div>`;
    h+=`<div class="btnrow mt"><button class="btn ghost" onclick="closeRec()">‹ All sessions</button>
      <button class="btn danger" onclick="discardRec(${i})">Discard</button></div>`;
    view.innerHTML=h; return;
  }

  /* ---- the day's existing sessions ---- */
  if(list.length && !REC_NEW){
    h+=`<h3 style="margin:0 0 8px">${list.length} recovery session${list.length===1?'':'s'} ${isToday?'today':'that day'}</h3>`;
    list.forEach((w,i)=>{
      const V=REC_VENUE.find(v=>v.k===w.venue);
      const nDone=Object.values(w.did||{}).filter(Boolean).length;
      h+=`<div class="card tight libRow" onclick="openRec(${i})">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14.5px">${w.focusLabel}</div>
          <div class="muted">${V?V.t:''} · ${w.mins} min · ${nDone} of ${w.ex.length} done</div>
        </div>
        <div class="muted" style="font-size:18px">›</div>
      </div>`;
    });
    h+=`<button class="btn ghost mt" onclick="newRec()">Another recovery session</button>`;
    view.innerHTML=h; return;
  }

  /* ---- the form ---- */
  if(REC_NEW && list.length)
    h+=`<button class="btn ghost" style="margin-bottom:12px" onclick="cancelNewRec()">‹ Back to ${list.length} session${list.length===1?'':'s'}</button>`;

  h+=`<div class="card"><h3>Recovery session</h3>
    <div class="sec mt">Keeping you on the court rather than adding training load. Nothing here should leave you tired, and none of it counts against a gym session.</div>
    <div class="mt"><label class="f">What are you looking after</label>
      <select id="rTarget">${RECOVERY_TARGETS.map(t=>`<option value="${t.k}">${t.t}</option>`).join('')}</select></div>
    <div class="grid2 mt">
      <div><label class="f">Where</label>
        <select id="rVenue">${REC_VENUE.map(v=>`<option value="${v.k}">${v.t}</option>`).join('')}</select></div>
      <div><label class="f">How long</label>
        <select id="rMins">${Object.keys(REC_MINS).map(m=>`<option value="${m}"${m==='15'?' selected':''}>${m} min</option>`).join('')}</select></div>
    </div>
    <button class="btn primary mt" onclick="rollRecovery()">Build the session</button>
  </div>`;

  h+=`<div class="card"><h3>What each one is for</h3>
    <div class="mt">${RECOVERY_TARGETS.map(t=>`<div class="wrow"><div class="wa">${t.t}</div></div>
      <div class="muted" style="margin:-4px 0 10px 0;font-size:12.5px;line-height:1.5">${t.why}</div>`).join('')}</div>
  </div>`;

  h+=`<div class="banner b-info">${I.alert}<div>Recovery earns a <b>★</b> like any other extra. It is never one of your four scored sessions, and doing one on a rest day is exactly the point of a rest day.</div></div>`;
  view.innerHTML=h;
}

function feelScaleRec(i,field){
  const w=recList(curDate())[i]||{}, cur=w[field]||0;
  return `<div class="feel mt">${[1,2,3,4,5].map(v=>`
    <button class="fbtn${cur===v?' on':''}" onclick="recFeel(${i},'${field}',${v})" aria-label="${MOOD_LABEL[v-1]}">
      ${face(v)}<span>${MOOD_LABEL[v-1]}</span></button>`).join('')}</div>`;
}
window.rollRecovery=()=>{
  const ds=curDate();
  const t=document.getElementById('rTarget').value;
  const v=document.getElementById('rVenue').value;
  const m=parseInt(document.getElementById('rMins').value);
  const w=genRecovery(t,m,v);
  DB.recovery=DB.recovery||{}; DB.recovery[ds]=recList(ds);
  w.id='r'+ds+'#'+DB.recovery[ds].length; w.did={};
  DB.recovery[ds].push(w);
  REC_IDX=DB.recovery[ds].length-1; REC_NEW=false;
  save(); window.scrollTo(0,0); render();
};
window.recTick=(i,k)=>{
  const w=recList(curDate())[parseInt(i)]; if(!w) return;
  w.did=w.did||{}; w.did[k]=!w.did[k]; save(); render();
};
window.recFeel=(i,f,v)=>{ const w=recList(curDate())[i]; if(!w) return;
  w[f]= w[f]===v?null:v; save(); render(); };
window.finishRec=()=>{ toggleBonus(curDate(),'recovery'); };
window.cancelNewRec=()=>{ REC_NEW=false; render(); };
window.discardRec=i=>{
  if(!confirm('Discard this recovery session?')) return;
  const ds=curDate();
  DB.recovery[ds]=recList(ds); DB.recovery[ds].splice(i,1);
  if(!DB.recovery[ds].length) delete DB.recovery[ds];
  REC_IDX=null; save(); render();
};

function vRandom(){
  const ds=curDate(), isToday=ds===todayISO();
  const list=adhocList(ds);
  let h=backBar();

  h+=`<div class="weeknav" style="margin-bottom:12px">
    <button onclick="shiftAdhocDay(-1)">‹</button>
    <div><div class="wl">${isToday?'Today':fmtD(ds).replace(/^(\w+), /,'$1 ')}</div>
    <div class="wd">${isToday?'':'logging a past day'}</div></div>
    <button onclick="shiftAdhocDay(1)" ${isToday?'disabled style="opacity:.3"':''}>›</button>
  </div>`;

  // ---- one open session ----
  if(ADHOC_IDX!=null && list[ADHOC_IDX]){
    const i=ADHOC_IDX, w=list[i];

    if(w.options && w.pick==null){
      h+=`<div class="card"><h3>Pick one</h3>
        <div class="sec mt">${FOCUS.find(f=>f.k===w.focus).t} · ${w.mins} min · ${INTENSITY[w.intensity].t}</div>
        <div class="note">Three options, same focus and effort. Pick whichever suits what is free on the floor.</div></div>`;
      w.options.forEach((o,n)=>{
        h+=`<div class="card" style="cursor:pointer" onclick="pickOption(${n})">
          <div class="row"><div style="font-weight:650;font-size:15px">Option ${n+1}</div>
          <div class="muted" style="font-size:20px">›</div></div>
          <div class="mt">${o.ex.map(x=>`<div class="wrow"><div class="wa">${x.n}</div><div class="wb">${x.t}</div></div>`).join('')}</div>

      });
      h+=`<button class="btn ghost" onclick="rerollAdhoc()">Three more</button>`;
      h+=`<button class="btn ghost mt" onclick="discardAdhoc(${i})">Cancel</button>`;
      view.innerHTML=h; return;
    }

    if(!w.accepted){
      const warn=adhocWarning(w);
      h+=`<div class="card"><div class="row"><div>
        <h2>${w.focusLabel} · ${w.mins} min</h2>
        <div class="sec">${INTENSITY[w.intensity].t}${w.pick!=null?` · option ${w.pick+1}`:''}</div></div></div>
        <div class="note">${w.rpeNote}</div></div>`;
      if(warn&&isToday) h+=`<div class="banner b-warn">${I.alert}<div><b>Worth reconsidering.</b> ${warn}</div></div>`;
      h+=`<div class="card"><h3>The session</h3>
        <table class="mt"><tbody>${w.ex.map(x=>`<tr><td>
          <div style="display:flex;gap:10px;align-items:center">${poseIcon(x.n)}<div style="font-weight:600">${x.n}</div></div>
          </td><td class="num">${x.t}</td></tr>`).join('')}</tbody></table>
        <div class="note">Rest 90s on the big lifts, 60s on the rest. Tap any figure for full technique.</div></div>`;
      h+=`<div class="btnrow"><button class="btn primary" onclick="acceptAdhoc()">Accept</button>
        <button class="btn" onclick="backToOptions()">Other options</button></div>`;
      h+=`<button class="btn ghost mt" onclick="discardAdhoc(${i})">Discard</button>`;
      view.innerHTML=h; return;
    }

    // accepted — log it
    const done=bonusOn(ds).includes('adhoc');
    h+=`<div class="card"><div class="row"><div>
      <h2>${w.focusLabel} · ${w.mins} min</h2>
      <div class="sec">${INTENSITY[w.intensity].t}${list.length>1?` · session ${i+1} of ${list.length}`:''}</div>
    </div>${done?pill('bonus'):''}</div>
    <div class="note">${w.rpeNote}</div></div>`;

    const wk = w.custom?'general' : w.focus==='legs'?'lower' : ['push','pull','upper','arms'].includes(w.focus)?'upper' : 'general';
    h+=warmupBlock(wk);
    h+=`<h3 style="margin:0 0 8px">Log your sets</h3>`;
    w.ex.forEach(x=>{
      const sets=(w.sets&&w.sets[x.k])||[];
      h+=`<div class="ex${sets.length?' done':''}">
        <div class="top">
          <div style="flex:1;min-width:0"><div class="nm">${x.n}</div><div class="tgt">${x.t}</div></div>
          ${poseIcon(x.n)}
        </div>
        <div class="setHead"><div>Set</div><div>Weight (kg)</div><div>Reps</div></div>
        ${Array.from({length:Math.max(INTENSITY[w.intensity].sets,sets.length)}).map((_,n)=>`<div class="setrow">
          <div class="n">${n+1}</div>
          <input inputmode="decimal" placeholder="${x.hw??'—'}" value="${sets[n]?.w??''}" onchange="adhocSet('${x.k}',${n},'w',this.value)">
          <input inputmode="numeric" placeholder="${INTENSITY[w.intensity].reps}" value="${sets[n]?.r??''}" onchange="adhocSet('${x.k}',${n},'r',this.value)">
        </div>`).join('')}
        <button class="addSet" onclick="adhocAddSet('${x.k}')">+ Add a set</button>
        <div class="exTools"><button onclick="startRest(${/Squat|Deadlift|RDL|Press|Row|Pulldown|Dip|Chin/.test(x.n)?90:60},'${x.n.replace(/'/g,'')}')">Rest ${/Squat|Deadlift|RDL|Press|Row|Pulldown|Dip|Chin/.test(x.n)?'90s':'60s'}</button></div>
      </div>`;
    });
    h+=stretchBlock(wk);
    h+=recoveryBlock(ds,i);
    h+=`<div class="card"><h3>How was that?</h3>
      <div class="sec mt" style="margin-bottom:2px">Difficulty</div>${adhocScale('rpe','diff')}
      <div class="sec" style="margin-top:14px;margin-bottom:2px">How you felt</div>${adhocScale('mood','mood')}
    </div>`;
    h+=`<button class="btn ${done?'':'primary'}" onclick="finishAdhoc()">${done?'Logged ✓ — tap to undo':'Mark done — earns a ★'}</button>`;
    h+=`<div class="btnrow mt"><button class="btn ghost" onclick="closeAdhoc()">‹ All sessions</button>
      <button class="btn danger" onclick="if(confirm('Discard this workout?'))discardAdhoc(${i})">Discard</button></div>`;
    view.innerHTML=h; return;
  }

  // ---- the day's list ----
  if(list.length && !NEW_ADHOC){
    h+=`<h3 style="margin-bottom:8px">${list.length} session${list.length===1?'':'s'} ${isToday?'today':'that day'}</h3>`;
    list.forEach((w,i)=>{
      const logged=Object.values(w.sets||{}).some(a=>a.some(v=>v&&v.w));
      h+=`<div class="card tight" style="cursor:pointer" onclick="openAdhoc(${i})">
        <div class="row"><div>
          <div style="font-weight:600;font-size:15px">${w.focusLabel||'Workout'} · ${w.mins} min</div>
          <div class="muted">${w.accepted?(logged?'Logged':'Accepted — not logged yet'):'Not accepted yet'}${w.intensity?` · ${INTENSITY[w.intensity].t}`:''}</div>
        </div><div class="muted" style="font-size:20px">›</div></div>
      </div>`;
    });
    h+=`<button class="btn mt" onclick="newAdhoc()">Generate another workout</button>`;
    view.innerHTML=h; return;
  }

  // ---- build your own ----
  if(BUILD_MODE){
    const picked=CUSTOM_EX;
    h+=`<button class="btn ghost" style="margin-bottom:12px" onclick="setBuildMode(false)">‹ Back</button>`;
    h+=`<div class="card"><h3>Build your own</h3>
      <div class="sec mt">Full-body warm-up and stretches come as standard. Add whatever you fancy doing.</div>
      <div class="mt"><label class="f">Add an exercise</label>
        <select id="cPick">${Object.keys(GUIDE).filter(n=>LIB_TYPE[n]==='Exercise').sort()
          .map(n=>`<option>${n}</option>`).join('')}</select></div>
      <button class="btn mt" onclick="addCustom()">Add</button>
    </div>`;
    if(picked.length){
      h+=`<h3 style="margin-bottom:8px">${picked.length} exercise${picked.length===1?'':'s'}</h3>`;
      picked.forEach((n,i)=>{
        h+=`<div class="card tight">
          <div class="row" style="align-items:flex-start">
            <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">
              ${poseIcon(n)}
              <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px">${n}</div>
              <div class="muted">${LIB_AREA[n]||''}</div></div>
            </div>
            <button class="magicBtn" onclick="showMagic('${n.replace(/'/g,"\\'")}',${i})" aria-label="Suggest weight">${I.star}</button>
            <button class="btn danger" style="width:auto;padding:5px 10px;font-size:12.5px" onclick="rmCustom(${i})">✕</button>
          </div>
          <div id="magic${i}"></div>
        </div>`;
      });
      h+=`<button class="btn primary mt" onclick="startCustom()">Start this workout</button>`;
    } else {
      h+=`<div class="banner b-info">${I.alert}<div>Tap the ${'★'} beside any exercise once added and it will suggest a weight and reps from your history, recent training and any open niggles.</div></div>`;
    }
    view.innerHTML=h; return;
  }

  // ---- the form ----
  if(NEW_ADHOC && list.length) h+=`<button class="btn ghost" style="margin-bottom:12px" onclick="cancelNewAdhoc()">‹ Back to ${list.length} session${list.length===1?'':'s'}</button>`;
  h+=`<div class="card"><h3>${isToday?'Turned up without a plan?':'Log a workout you did'}</h3>
    <div class="sec mt">Tell it what you fancy and it builds something from what is actually on the floor here.</div>
    <div class="mt"><label class="f">What are you training</label>
      <select id="aFocus">${FOCUS.map(f=>`<option value="${f.k}">${f.t}</option>`).join('')}</select></div>
    <div class="grid2 mt">
      <div><label class="f">How long</label>
        <select id="aMins">${Object.keys(MINS).map(m=>`<option value="${m}"${m==='30'?' selected':''}>${m} min</option>`).join('')}</select></div>
      <div><label class="f">How hard</label>
        <select id="aInt">${Object.keys(INTENSITY).map(k=>`<option value="${k}"${k==='moderate'?' selected':''}>${INTENSITY[k].t}</option>`).join('')}</select></div>
    </div>
    <button class="btn primary mt" onclick="rollAdhoc()">Generate a workout</button>
    <button class="btn ghost mt" onclick="setBuildMode(true)">Or build your own</button>
  </div>`;
  h+=`<div class="banner b-info">${I.alert}<div>These count as a <b>★ bonus</b>, never as one of your four scored sessions. An unplanned session is a nice extra — it does not replace either gym session.</div></div>`;
  view.innerHTML=h;
}
let ADHOC_IDX=null;
window.openAdhoc=i=>{ ADHOC_IDX=i; window.scrollTo(0,0); render(); };
window.closeAdhoc=()=>{ ADHOC_IDX=null; NEW_ADHOC=false; window.scrollTo(0,0); render(); };
window.newAdhoc=()=>{ ADHOC_IDX=null; NEW_ADHOC=true; window.scrollTo(0,0); render(); };
window.cancelNewAdhoc=()=>{ NEW_ADHOC=false; render(); };
let BUILD_MODE=false, CUSTOM_EX=[];
window.setBuildMode=v=>{ BUILD_MODE=v; if(!v) CUSTOM_EX=[]; window.scrollTo(0,0); render(); };
window.addCustom=()=>{
  const n=document.getElementById('cPick').value;
  if(!CUSTOM_EX.includes(n)) CUSTOM_EX.push(n);
  render();
};
window.rmCustom=i=>{ CUSTOM_EX.splice(i,1); render(); };
window.startCustom=()=>{
  const ds=curDate();
  const ex=CUSTOM_EX.map(n=>{ const m=magicHint(n,ds);
    // carry the suggestion through: target line reads "3 × 5 · try 67.5kg",
    // and the weight box shows it as a placeholder so it is one tap to accept.
    return {n,k:slug(n),t:m.w?`3 × ${m.reps} · try ${m.w}kg`:`3 × ${m.reps}`,hw:m.w}; });
  DB.adhoc=DB.adhoc||{}; DB.adhoc[ds]=adhocList(ds);
  DB.adhoc[ds].push({focus:'full',focusLabel:'Custom',mins:CUSTOM_EX.length*10,intensity:'moderate',
                     rpeNote:'Your own selection — pace it how you like.',
                     ex,accepted:true,sets:{},custom:true});
  ADHOC_IDX=DB.adhoc[ds].length-1; BUILD_MODE=false; CUSTOM_EX=[]; NEW_ADHOC=false;
  save(); render();
};
window.shiftAdhocDay=n=>{
  const d=iso(addD(parse(curDate()),n));
  VIEW_DATE = d>todayISO()? null : d;
  ADHOC_IDX=null; NEW_ADHOC=false; render();
};

function adhocScale(field,kind){
  const w=curAdhoc()||{}, cur=w[field]||0;
  const labels=kind==='mood'?MOOD_LABEL:DIFF_LABEL;
  const icon = kind==='mood'?face:effort;
  return `<div class="feel">${[1,2,3,4,5].map(v=>`
    <button class="fbtn${cur===v?' on':''}" onclick="adhocFeel('${field}',${v})">${icon(v)}<span>${labels[v-1]}</span></button>`).join('')}</div>`;
}
let NEW_ADHOC=false;
window.rollAdhoc=()=>{
  const ds=curDate();
  const f=document.getElementById('aFocus').value;
  const m=parseInt(document.getElementById('aMins').value);
  const i=document.getElementById('aInt').value;
  DB.adhoc=DB.adhoc||{}; DB.adhoc[ds]=adhocList(ds);
  DB.adhoc[ds].push({options:[genWorkout(f,m,i),genWorkout(f,m,i),genWorkout(f,m,i)],
                     pick:null,accepted:false,sets:{},focus:f,mins:m,intensity:i});
  ADHOC_IDX=DB.adhoc[ds].length-1; NEW_ADHOC=false;
  save(); render();
};
const curAdhoc=()=>adhocList(curDate())[ADHOC_IDX];
const putAdhoc=v=>{ DB.adhoc[curDate()][ADHOC_IDX]=v; };
window.pickOption=n=>{
  const w=curAdhoc(), o=w.options[n];
  putAdhoc({...o,options:w.options,pick:n,accepted:false,sets:{}});
  save(); render();
};
window.backToOptions=()=>{
  const w=curAdhoc();
  putAdhoc({options:w.options,pick:null,accepted:false,sets:{},focus:w.focus,mins:w.mins,intensity:w.intensity});
  save(); render();
};
window.rerollAdhoc=()=>{
  const w=curAdhoc();
  putAdhoc({options:[genWorkout(w.focus,w.mins,w.intensity),genWorkout(w.focus,w.mins,w.intensity),
                     genWorkout(w.focus,w.mins,w.intensity)],
            pick:null,accepted:false,sets:{},focus:w.focus,mins:w.mins,intensity:w.intensity});
  save(); render();
};
window.acceptAdhoc=()=>{ curAdhoc().accepted=true; save(); render(); };
window.discardAdhoc=i=>{
  const ds=curDate();
  DB.adhoc[ds]=adhocList(ds); DB.adhoc[ds].splice(i,1);
  if(!DB.adhoc[ds].length){ delete DB.adhoc[ds];
    const cur=new Set(bonusOn(ds)); cur.delete('adhoc');
    if(cur.size) DB.bonus[ds]=[...cur]; else delete DB.bonus[ds];
  }
  ADHOC_IDX=null; save(); render();
};
window.adhocAddSet=k=>{
  const w=curAdhoc(); w.sets=w.sets||{}; w.sets[k]=w.sets[k]||[];
  const min=INTENSITY[w.intensity].sets;
  while(w.sets[k].length<min) w.sets[k].push({});
  w.sets[k].push({}); save(); render();
};
window.adhocSet=(k,i,f,v)=>{
  const w=curAdhoc(); w.sets=w.sets||{}; w.sets[k]=w.sets[k]||[];
  w.sets[k][i]=w.sets[k][i]||{}; w.sets[k][i][f]=v; save();
};
window.adhocFeel=(field,v)=>{ const w=curAdhoc(); w[field]= w[field]===v?null:v; save(); render(); };
window.finishAdhoc=()=>{ toggleBonus(curDate(),'adhoc'); };


/* ============================================================
   WARM-UP · STRETCH · RECOVERY
   ------------------------------------------------------------
   Bookends every session, planned or random. Warm-up is not
   optional padding — it is what makes the first working set
   count and keeps the last one safe.
   ============================================================ */
const WARMUP={
  lower:{mins:8,items:['Easy cardio','Leg swings','Bodyweight squats','Glute bridges','Ramp-up sets']},
  upper:{mins:6,items:['Easy cardio','Arm circles','Band or cable pull-aparts','Scapular hangs','Light sets']},
  general:{mins:6,items:['Easy cardio','Leg swings','Arm circles','Bodyweight squats','Ramp-up sets']}
};
const STRETCH={
  lower:['Hip flexor stretch','Hamstring stretch','Calf stretch on a step','90/90 hip stretch'],
  upper:['Doorway or cable chest stretch','Lat stretch','Cross-body shoulder stretch','Thoracic rotations'],
  general:['Hip flexor stretch','Hamstring stretch','Doorway or cable chest stretch','Lat stretch']
};
const RECOVERY=[
  {mins:0,  t:'Skip',      d:'Straight out — fine when you are short on time.'},
  {mins:5,  t:'5 min',     d:'The stretches above, nothing more.'},
  {mins:10, t:'10 min',    d:'Stretches plus the massage gun on whatever feels tight.'},
  {mins:20, t:'20 min',    d:'Stretches, then sauna or hot tub. This is what the membership is for.'},
  {mins:30, t:'30 min',    d:'Full circuit — stretch, sauna, pool. Best on a day with nothing after it.'}
];
function mobRow(n){
  const g=guideFor(n);
  return `<div class="wrow mob" onclick="openGuide(${JSON.stringify(n).replace(/"/g,'&quot;')})">
    ${poseIcon(n)}
    <div style="flex:1;min-width:0"><div class="wa">${n}</div><div class="wb">${g&&g.brief?g.brief:''}</div></div>
    <div class="muted" style="font-size:18px">›</div>
  </div>`;
}
function warmKind(type){ return type==='gymA'?'lower':type==='gymB'?'upper':'general'; }

function warmupBlock(kind){
  const W=WARMUP[kind];
  return `<details><summary>Warm-up · ${W.mins} min</summary>
    <div class="sec mt" style="margin-bottom:8px">Do not skip this. It is the difference between a good first set and a wasted one.</div>
    ${W.items.map(n=>mobRow(n)).join('')}
  </details>`;
}
function stretchBlock(kind){
  return `<details><summary>Stretches · after the session</summary>
    <div class="sec mt" style="margin-bottom:8px">On the mats by the massage-gun station. Hold each one, do not bounce.</div>
    ${STRETCH[kind].map(n=>mobRow(n)).join('')}
  </details>`;
}
function recoveryBlock(ds,ai){
  // ai = index of the ad-hoc workout being logged, or null for the planned session.
  // Without this, picking a recovery length inside a random workout wrote a
  // phantom planned-session record onto an open day.
  const rec = ai==null ? (DB.log[ds]||{}) : (adhocList(ds)[ai]||{});
  const cur = rec.recovery;
  const showPlunge=cur!=null&&cur>=10;
  return `<div class="card"><h3>Recovery</h3>
    <div class="sec mt" style="margin-bottom:4px">How long have you got afterwards?</div>
    <div class="recRow">${RECOVERY.map(r=>`
      <button class="recBtn${cur===r.mins?' on':''}" onclick="setRecovery('${ds}',${r.mins},${ai==null?'null':ai})">${r.t}</button>`).join('')}</div>
    ${cur!=null?`<div class="note">${RECOVERY.find(r=>r.mins===cur).d}</div>`:''}
    ${showPlunge?`<div class="banner b-warn mt">${I.alert}<div><b>Not the cold plunge today.</b> You have just lifted — cold water within about 4 hours blunts the adaptations you just trained for. Sauna and hot tub are fine.</div></div>`:''}
  </div>`;
}
window.setRecovery=(ds,m,ai)=>{
  const e = (ai==null||ai===undefined)
    ? (DB.log[ds]||(DB.log[ds]={type:SCHEDULE[parse(ds).getDay()],sets:{}}))
    : adhocList(ds)[ai];
  if(!e) return;
  e.recovery = e.recovery===m ? null : m;
  save(); render();
};


/* ============================================================
   ACTIVITY LOG — anything outside the plan
   ------------------------------------------------------------
   Category → sub-category → the fields that actually matter for
   that thing. A run wants distance, time and calories; a sauna
   wants minutes. Everything earns a ★ and counts as a club visit
   where it happened at the club.
   ============================================================ */
const ACTIVITIES={
  Cardio:{
    subs:['Run','Treadmill run','Swim','Row','SkiERG','Cross trainer','Walk'],
    fields:[['dist','Distance','km'],['time','Time','min'],['cal','Calories','kcal'],['pace','Avg pace','min/km']]
  },
  Class:{
    subs:['BLAZE','Yoga','Pilates','Spin (skip — knee)','Other class'],
    fields:[['time','Length','min'],['cal','Calories','kcal']]
  },
  Sport:{
    subs:['Basketball (extra)','Tennis','Badminton','Pickleball','Padel'],
    fields:[['time','Time','min']]
  },
  Recovery:{
    subs:['Sauna','Hot tub','Cold plunge','Massage gun','Stretch session','Swim (easy)'],
    fields:[['time','Length','min']]
  },
  Other:{ subs:['Something else'], fields:[['time','Time','min'],['cal','Calories','kcal']] }
};
const CLUB_ACT=['Treadmill run','Swim','Row','SkiERG','Cross trainer','BLAZE','Yoga','Pilates','Other class',
                'Tennis','Badminton','Pickleball','Padel','Sauna','Hot tub','Cold plunge','Massage gun',
                'Stretch session','Swim (easy)'];

function vLog(){
  const cat=Store.get('coach.lastCat','Cardio');
  const A=ACTIVITIES[cat];
  let h=backBar();
  h+=`<div class="card"><h3>Log an activity</h3>
    <div class="sec mt">Anything outside the plan — a run on a day you never went near the gym, a swim, a class, twenty minutes in the sauna. Earns a ★ and never counts against you.</div>
    <div class="mt"><label class="f">When</label>
      <input type="date" id="lDate" value="${todayISO()}" max="${todayISO()}"></div>
    <div class="mt"><label class="f">Category</label>
      <select onchange="pickCat(this.value)">${Object.keys(ACTIVITIES).map(c=>
        `<option${c===cat?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="mt"><label class="f">What</label>
      <select id="lSub">${A.subs.map(x=>`<option>${x}</option>`).join('')}</select></div>
    <div class="grid2 mt">${A.fields.map(([k,lbl,unit])=>
      `<div><label class="f">${lbl} (${unit})</label><input id="l_${k}" inputmode="decimal" placeholder="—"></div>`).join('')}</div>
    <div class="mt"><label class="f">Note</label><input id="lNote" placeholder="Optional"></div>
    <button class="btn primary mt" onclick="addActivity('${cat}')">Log it</button>
  </div>`;

  const acts=(DB.activities||[]).slice().reverse();
  if(acts.length){
    h+=`<div class="card"><h3>Recent</h3>${acts.slice(0,12).map((a)=>{
      const i=DB.activities.indexOf(a);
      const bits=Object.entries(a.vals||{}).filter(([,v])=>v!=='' && v!=null)
        .map(([k,v])=>{const f=(ACTIVITIES[a.cat]?.fields||[]).find(x=>x[0]===k);return f?`${v} ${f[2]}`:v;});
      return `<div class="ledger"><div>
        <div style="font-weight:600">${a.sub}</div>
        <div class="muted">${fmtD(a.date).replace(/^\w+, /,'')}${bits.length?' · '+bits.join(' · '):''}${a.note?` — ${a.note}`:''}</div>
      </div><button class="btn danger" style="width:auto;padding:5px 11px;font-size:13px" onclick="rmActivity(${i})">Remove</button></div>`;
    }).join('')}</div>`;

    // simple totals for the current month
    const m=todayISO().slice(0,7);
    const mine=(DB.activities||[]).filter(a=>a.date.slice(0,7)===m);
    const km=mine.reduce((t,a)=>t+(parseFloat(a.vals?.dist)||0),0);
    const mins=mine.reduce((t,a)=>t+(parseFloat(a.vals?.time)||0),0);
    h+=`<div class="card"><h3>This month</h3>
      <table class="mt"><tbody>
        <tr><td>Activities logged</td><td class="num">${mine.length}</td></tr>
        <tr><td>Distance</td><td class="num">${km?km.toFixed(1)+' km':'—'}</td></tr>
        <tr><td>Time</td><td class="num">${mins?Math.round(mins)+' min':'—'}</td></tr>
      </tbody></table></div>`;
  } else {
    h+=`<div class="banner b-info">${I.alert}<div>Nothing logged yet. This is for the things the plan does not cover — a run, a swim, a game of badminton, twenty minutes in the sauna.</div></div>`;
  }
  view.innerHTML=h;
}
window.pickCat=c=>{ Store.set('coach.lastCat',c); render(); };
window.addActivity=cat=>{
  const sub=document.getElementById('lSub').value;
  const vals={};
  (ACTIVITIES[cat].fields||[]).forEach(([k])=>{
    const el=document.getElementById('l_'+k); if(el&&el.value!=='') vals[k]=el.value;
  });
  const note=document.getElementById('lNote').value;
  const dEl=document.getElementById('lDate');
  const ds=(dEl&&dEl.value)||todayISO();
  DB.activities=DB.activities||[];
  DB.activities.push({date:ds,cat,sub,vals,note});
  // star for the day + a club visit when it happened at the club
  DB.bonus=DB.bonus||{};
  const cur=new Set(bonusOn(ds)); cur.add('activity'); DB.bonus[ds]=[...cur];
  if(CLUB_ACT.includes(sub)) (DB.visits=DB.visits||[]).push({date:ds,type:'activity:'+sub});
  save(); render();
};
window.rmActivity=i=>{
  const a=DB.activities[i];
  DB.activities.splice(i,1);
  const still=(DB.activities||[]).some(x=>x.date===a.date);
  if(!still&&DB.bonus[a.date]){
    const cur=new Set(DB.bonus[a.date]); cur.delete('activity');
    if(cur.size) DB.bonus[a.date]=[...cur]; else delete DB.bonus[a.date];
  }
  save(); render();
};


/* ============================================================
   LIBRARY — everything the app knows how to coach
   ============================================================ */
const LIB_TYPE={};
(function(){
  const warm=new Set(), stretch=new Set();
  Object.values(WARMUP).forEach(w=>w.items.forEach(n=>warm.add(n)));
  Object.values(STRETCH).forEach(a=>a.forEach(n=>stretch.add(n)));
  Object.keys(GUIDE).forEach(n=>{
    LIB_TYPE[n] = stretch.has(n) ? 'Stretch' : warm.has(n) ? 'Warm-up' : 'Exercise';
  });
})();
// Which part of the body each exercise trains — used by the filters.
const LIB_AREA=(()=>{
  const a={};
  const put=(list,area)=>list.forEach(n=>{ if(GUIDE[n]) a[n]=area; });
  put(POOL.legs,'Legs'); put(POOL.push,'Push'); put(POOL.pull,'Pull');
  put(POOL.core,'Core'); put(POOL.arms,'Arms');
  ['EZ-Bar Preacher Curl','Cable Triceps Pushdown'].forEach(n=>a[n]='Arms');
  Object.keys(GUIDE).forEach(n=>{ if(!a[n]) a[n]='Mobility'; });
  return a;
})();

function vLibrary(){
  const q=(Store.get('coach.libQ','')||'').toLowerCase();
  const fType=Store.get('coach.libType','All');
  const fArea=Store.get('coach.libArea','All');
  const types=['All','Exercise','Warm-up','Stretch'];
  const areas=['All','Legs','Push','Pull','Core','Arms','Mobility'];

  let names=Object.keys(GUIDE).sort();
  if(fType!=='All') names=names.filter(n=>LIB_TYPE[n]===fType);
  if(fArea!=='All') names=names.filter(n=>LIB_AREA[n]===fArea);
  if(q) names=names.filter(n=>n.toLowerCase().includes(q)||(GUIDE[n].kit||'').toLowerCase().includes(q));

  let h=backBar();
  h+=`<div class="card">
    <input id="libQ" placeholder="Search exercises, machines…" value="${q}" oninput="libSearch(this.value)">
    <div class="chips mt">${types.map(t=>`<button class="chip${t===fType?' on':''}" onclick="libSet('libType','${t}')">${t}</button>`).join('')}</div>
    <div class="chips" style="margin-top:6px">${areas.map(t=>`<button class="chip${t===fArea?' on':''}" onclick="libSet('libArea','${t}')">${t}</button>`).join('')}</div>
    <div class="muted mt">${names.length} of ${Object.keys(GUIDE).length}</div>
  </div>`;

  if(!names.length){
    h+=`<div class="card"><div class="muted">Nothing matches. Try clearing a filter.</div></div>`;
    view.innerHTML=h; return;
  }
  let group='';
  names.sort((a,b)=>(LIB_TYPE[a]+a).localeCompare(LIB_TYPE[b]+b)).forEach(n=>{
    if(LIB_TYPE[n]!==group){ group=LIB_TYPE[n]; h+=`<h3 class="mt2" style="margin-bottom:8px">${group}s</h3>`; }
    const g=GUIDE[n];
    h+=`<div class="card tight libRow" onclick="openGuide(${JSON.stringify(n).replace(/"/g,'&quot;')})">
      ${poseIcon(n)}
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14.5px">${n}</div>
        <div class="muted">${g.brief?g.brief+' · ':''}${g.kit}</div>
      </div>
      <div class="muted" style="font-size:18px">›</div>
    </div>`;
  });
  view.innerHTML=h;
}
window.libSet=(k,v)=>{ Store.set('coach.'+k,v); render(); };
let LIBT=null;
window.libSearch=v=>{ clearTimeout(LIBT); LIBT=setTimeout(()=>{ Store.set('coach.libQ',v); render();
  const el=document.getElementById('libQ'); if(el){el.focus();el.setSelectionRange(v.length,v.length);} },250); };

/* ---------- SYNC TAB ---------- */
function vSync(){
  const c=Cloud.configured?(Cloud.builtIn?FIREBASE_CONFIG:Store.get('coach.fbcfg',null)):null;
  const s=Cloud.status, u=Cloud.user;
  let h=backBar();

  if(Cloud.err) h+=`<div class="banner b-bad">${I.alert}<div>${Cloud.err}</div></div>`;

  if(!c){
    h+=`<div class="card"><h3>Connect a database</h3>
      <div class="sec mt">Your data is only on this device right now.</div>
      <div class="banner b-warn mt">${I.alert}<div><b>If you have already set Firebase up, <code>config.js</code> is missing or empty in your repo.</b> That file holds your keys and is what this app reads on load. Fix it there rather than pasting below — a pasted config only applies to this one device.</div></div>
      <div class="note">Pasting below is a per-device fallback. The proper fix is <code>config.js</code> sitting next to <code>index.html</code>.</div>
      <label class="f mt">Paste firebaseConfig</label>
      <textarea id="fbcfg" rows="7" style="font:inherit;font-size:13px;font-family:ui-monospace,monospace;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:9px;padding:10px;width:100%" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }'></textarea>
      <button class="btn primary mt" onclick="saveCfg()">Connect</button>
    </div>`;
  } else {
    h+=`<div class="card"><h3>Connection</h3>
      <table class="mt"><tbody>
        <tr><td>Project</td><td class="num">${c.projectId||'—'}</td></tr>
        <tr><td>Auth domain</td><td class="num">${c.authDomain||'—'}</td></tr>
        <tr><td>Sign-in flow</td><td class="num">${Cloud.sameOrigin?'Redirect':'Popup'}</td></tr>
      </tbody></table>
      ${!Cloud.sameOrigin?`<div class="banner b-warn mt">${I.alert}<div><b>This site is not served from your Firebase domain.</b> Sign-in will use a popup, which iOS blocks inside home-screen apps. Deploy to Firebase Hosting and open it from that address for reliable sign-in.</div></div>`:''}
      ${Cloud.builtIn?`<div class="muted mt">Configured in <code>config.js</code> — the same for every device.</div>`
        :`<button class="btn danger mt" onclick="if(confirm('Disconnect the database? Local data is kept.'))Cloud.clearCfg()">Disconnect</button>`}
    </div>`;
  }

  // A straight count of what is held, so you can see at a glance that
  // nothing has gone missing — no interpretation, just records.
  const cs=census();
  h+=`<div class="card"><h3>What is stored</h3>
    <table class="mt"><tbody>${cs.rows.map(([l,n])=>
      `<tr><td>${l}</td><td class="num"${n?'':' style="opacity:.45"'}>${n}</td></tr>`).join('')}</tbody></table>
    <div class="row mt"><div class="muted">Records span</div><div class="muted">${
      cs.first?`${fmtD(cs.first).replace(/^\w+, /,'')} → ${fmtD(cs.last).replace(/^\w+, /,'')}`:'nothing yet'}</div></div>
    <div class="row"><div class="muted">Held on this device</div><div class="muted">${(cs.bytes/1024).toFixed(0)} KB${Store.ok?'':' (memory only)'}</div></div>
    <div class="note">If a number here is lower than you expect, export a backup before doing anything else — that file is the recoverable copy.</div>
  </div>`;

  h+=`<div class="card"><h3>Backup</h3>
    <div class="btnrow mt">
      <button class="btn ghost" onclick="exportData()">Export</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">Import</button>
    </div>
    <input type="file" id="imp" accept="application/json" class="hide" onchange="importData(this)">
    <div class="note">Worth doing occasionally even with sync on.</div>
  </div>`;

  h+=`<div class="banner b-info">${I.alert}<div>Signing in on a second device <b>merges</b> both sets of data rather than overwriting. Two devices that logged different exercises on the same day both keep theirs; only the same field on the same day resolves to whichever was saved last.</div></div>`;

  h+=`<div class="card tight"><div class="row">
    <div class="muted">App version</div>
    <div class="muted" style="font-variant-numeric:tabular-nums">${BUILD}</div>
  </div>
  <button class="btn ghost mt" onclick="hardReload()">Force refresh</button>
  <div class="note">If this version does not match what you just deployed, you are on a cached copy — tap Force refresh.</div>
  </div>`;

  view.innerHTML=h;
}
window.hardReload=async()=>{
  try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
};
window.saveCfg=()=>{
  const t=document.getElementById('fbcfg').value.trim();
  try{
    const json=t.replace(/^[^{]*/,'').replace(/[^}]*$/,'');
    const o=JSON.parse(json.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"'));
    if(!o.apiKey||!o.projectId) throw new Error('Missing apiKey or projectId');
    Cloud.saveCfg(o); render();
  }catch(e){ alert('Could not read that config: '+e.message); }
};

/* ============================================================
   SIGN-IN GATE
   ------------------------------------------------------------
   With sync configured, the app stays closed until someone signs
   in — the plan and the logging both belong to a person, and a
   shared link should show a stranger nothing.
   ============================================================ */
function gateActive(){
  return Cloud.configured && !Cloud.user && !Store.get('coach.guest',false);
}
function renderGate(){
  document.getElementById('tabs').classList.add('hide');
  const st=Cloud.status;
  const busy = st==='connecting'||st==='syncing';
  document.getElementById('hdrTitle').textContent='Coach';
  document.getElementById('hdrSub').textContent='Sign in to continue';
  document.getElementById('hdrPill').innerHTML='';
  view.innerHTML=`<div class="gate">
    <div class="gateMark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 17.4 8.6 11.5 12.6 15.5 20.8 6.5"/><path d="M15 6.5h5.8v5.8"/></svg>
    </div>
    <h2 style="margin-top:18px">Your training, your account</h2>
    <div class="sec" style="margin-top:8px;max-width:34ch">
      Everything — sessions, sets, weight, scans — is tied to your Google account and visible only to you.
    </div>
    ${Cloud.err?`<div class="banner b-bad" style="margin-top:18px;text-align:left">${I.alert}<div>${Cloud.err}</div></div>`:''}
    <button class="btn primary" style="margin-top:22px;max-width:320px" ${busy?'disabled':''} onclick="Cloud.signIn()">
      ${busy?'Connecting…':'Sign in with Google'}
    </button>
    <div class="muted" style="margin-top:14px">Two profiles live here. You each see only your own plan and your own data.</div>
    <button class="linkish" onclick="guestMode()">Continue without signing in</button>
    <div class="muted" style="margin-top:4px;font-size:11.5px;max-width:32ch">
      Local only — nothing syncs and nothing is backed up. Use this if sign-in is broken, not by choice.
    </div>
  </div>`;
}
window.guestMode=()=>{ Store.set('coach.guest',true); render(); };
window.exitGuest=()=>{ Store.set('coach.guest',false); render(); };

/* ---------- BOOT ---------- */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.tab!==TAB){ WEEKOFF=0; MORE=null; }
  else if(b.dataset.tab==='more') MORE=null;
  TAB=b.dataset.tab; window.scrollTo(0,0); render();
});
if(!Store.ok){
  window.addEventListener('load',()=>{
    const d=document.createElement('div');
    d.className='banner b-warn';d.style.margin='12px 16px';
    d.innerHTML=`${I.alert}<div><b>Storage is blocked in this preview.</b> Your data will not persist here. Save the file and open it in Safari on your iPhone.</div>`;
    document.body.insertBefore(d,view);
  });
}
render();
Cloud.init();
</script>
