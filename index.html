    <div class="grid2 mt">${A.fields.map(([k,lbl,unit])=>
      `<div><label class="f">${lbl} (${unit})</label><input id="l_${k}" inputmode="decimal" placeholder="—"></div>`).join('')}</div>
    <div class="mt"><label class="f">Note</label><input id="lNote" placeholder="Optional"></div>
    <button class="btn primary mt" onclick="addActivity('${cat}')">Log it</button>
  </div>`;

  const acts=(DB.activities||[]).slice().reverse();
  if(acts.length){
    h+=`<div class="card"><h3>Recent</h3>${acts.slice(0,12).map((a)=>{
      const i=DB.activities.indexOf(a);
      const bits=Object.entries(a.vals||{}).filter(([,v])=>v!=='' && v!=null)
        .map(([k,v])=>{const f=(ACTIVITIES[a.cat]?.fields||[]).find(x=>x[0]===k);return f?`${v} ${f[2]}`:v;});
      return `<div class="ledger"><div>
        <div style="font-weight:600">${a.sub}</div>
        <div class="muted">${fmtD(a.date).replace(/^\w+, /,'')}${bits.length?' · '+bits.join(' · '):''}${a.note?` — ${a.note}`:''}</div>
      </div><button class="btn danger" style="width:auto;padding:5px 11px;font-size:13px" onclick="rmActivity(${i})">Remove</button></div>`;
    }).join('')}</div>`;

    // simple totals for the current month
    const m=todayISO().slice(0,7);
    const mine=(DB.activities||[]).filter(a=>a.date.slice(0,7)===m);
    const km=mine.reduce((t,a)=>t+(parseFloat(a.vals?.dist)||0),0);
    const mins=mine.reduce((t,a)=>t+(parseFloat(a.vals?.time)||0),0);
    h+=`<div class="card"><h3>This month</h3>
      <table class="mt"><tbody>
        <tr><td>Activities logged</td><td class="num">${mine.length}</td></tr>
        <tr><td>Distance</td><td class="num">${km?km.toFixed(1)+' km':'—'}</td></tr>
        <tr><td>Time</td><td class="num">${mins?Math.round(mins)+' min':'—'}</td></tr>
      </tbody></table></div>`;
  } else {
    h+=`<div class="banner b-info">${I.alert}<div>Nothing logged yet. This is for the things the plan does not cover — a run, a swim, a game of badminton, twenty minutes in the sauna.</div></div>`;
  }
  view.innerHTML=h;
}
window.pickCat=c=>{ Store.set('coach.lastCat',c); render(); };
window.addActivity=cat=>{
  const sub=document.getElementById('lSub').value;
  const vals={};
  (ACTIVITIES[cat].fields||[]).forEach(([k])=>{
    const el=document.getElementById('l_'+k); if(el&&el.value!=='') vals[k]=el.value;
  });
  const note=document.getElementById('lNote').value;
  const dEl=document.getElementById('lDate');
  const ds=(dEl&&dEl.value)||todayISO();
  DB.activities=DB.activities||[];
  DB.activities.push({date:ds,cat,sub,vals,note});
  // star for the day + a club visit when it happened at the club
  DB.bonus=DB.bonus||{};
  const cur=new Set(bonusOn(ds)); cur.add('activity'); DB.bonus[ds]=[...cur];
  if(CLUB_ACT.includes(sub)) (DB.visits=DB.visits||[]).push({date:ds,type:'activity:'+sub});
  save(); render();
};
window.rmActivity=i=>{
  const a=DB.activities[i];
  DB.activities.splice(i,1);
  const still=(DB.activities||[]).some(x=>x.date===a.date);
  if(!still&&DB.bonus[a.date]){
    const cur=new Set(DB.bonus[a.date]); cur.delete('activity');
    if(cur.size) DB.bonus[a.date]=[...cur]; else delete DB.bonus[a.date];
  }
  save(); render();
};

/* ---------- SYNC TAB ---------- */
function vSync(){
  const c=Cloud.configured?(Cloud.builtIn?FIREBASE_CONFIG:Store.get('coach.fbcfg',null)):null;
  const s=Cloud.status, u=Cloud.user;
  let h='';

  const SM={off:['p-off','dot','Local only'],out:['p-off','dot','Signed out'],
    connecting:['p-warn','alert','Connecting'],syncing:['p-warn','alert','Syncing'],
    on:['p-good','check','Synced'],error:['p-bad','x','Error']}[s]||['p-off','dot','—'];

  h+=`<div class="card"><div class="row">
    <div><h2>${u?u.displayName||u.email:'Not signed in'}</h2>
    <div class="sec">${u?u.email:'Your data is stored on this device only'}</div></div>
    <span class="pill ${SM[0]}">${I[SM[1]]}${SM[2]}</span></div>
    ${Cloud.lastSync?`<div class="muted mt">Last synced ${new Date(Cloud.lastSync).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>`:''}
    ${Cloud.err?`<div class="banner b-bad mt">${I.alert}<div>${Cloud.err}</div></div>`:''}
    ${c?(u?`<button class="btn ghost mt" onclick="Cloud.signOut()">Sign out</button>`
         :`<button class="btn primary mt" onclick="Cloud.signIn()">Sign in with Google</button>`):''}
  </div>`;

  if(!c){
    h+=`<div class="card"><h3>Connect a database</h3>
      <div class="sec mt">Your data is only on this device right now.</div>
      <div class="banner b-warn mt">${I.alert}<div><b>If you have already set Firebase up, <code>config.js</code> is missing or empty in your repo.</b> That file holds your keys and is what this app reads on load. Fix it there rather than pasting below — a pasted config only applies to this one device.</div></div>
      <div class="note">Pasting below is a per-device fallback. The proper fix is <code>config.js</code> sitting next to <code>index.html</code>.</div>
      <label class="f mt">Paste firebaseConfig</label>
      <textarea id="fbcfg" rows="7" style="font:inherit;font-size:13px;font-family:ui-monospace,monospace;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:9px;padding:10px;width:100%" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }'></textarea>
      <button class="btn primary mt" onclick="saveCfg()">Connect</button>
    </div>`;
  } else {
    h+=`<div class="card"><h3>Connection</h3>
      <table class="mt"><tbody>
        <tr><td>Project</td><td class="num">${c.projectId||'—'}</td></tr>
        <tr><td>Auth domain</td><td class="num">${c.authDomain||'—'}</td></tr>
        <tr><td>Sign-in flow</td><td class="num">${Cloud.sameOrigin?'Redirect':'Popup'}</td></tr>
      </tbody></table>
      ${!Cloud.sameOrigin?`<div class="banner b-warn mt">${I.alert}<div><b>This site is not served from your Firebase domain.</b> Sign-in will use a popup, which iOS blocks inside home-screen apps. Deploy to Firebase Hosting and open it from that address for reliable sign-in.</div></div>`:''}
      ${Cloud.builtIn?`<div class="muted mt">Configured in <code>config.js</code> — the same for every device.</div>`
        :`<button class="btn danger mt" onclick="if(confirm('Disconnect the database? Local data is kept.'))Cloud.clearCfg()">Disconnect</button>`}
    </div>`;
  }

  h+=`<div class="card"><h3>Backup</h3>
    <div class="btnrow mt">
      <button class="btn ghost" onclick="exportData()">Export</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">Import</button>
    </div>
    <input type="file" id="imp" accept="application/json" class="hide" onchange="importData(this)">
    <div class="note">Worth doing occasionally even with sync on.</div>
  </div>`;

  h+=`<div class="banner b-info">${I.alert}<div>Signing in on a second device <b>merges</b> both sets of data rather than overwriting — per entry, the most recently saved version wins.</div></div>`;

  h+=`<div class="card tight"><div class="row">
    <div class="muted">App version</div>
    <div class="muted" style="font-variant-numeric:tabular-nums">${BUILD}</div>
  </div>
  <button class="btn ghost mt" onclick="hardReload()">Force refresh</button>
  <div class="note">If this version does not match what you just deployed, you are on a cached copy — tap Force refresh.</div>
  </div>`;

  view.innerHTML=h;
}
window.hardReload=async()=>{
  try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
};
window.saveCfg=()=>{
  const t=document.getElementById('fbcfg').value.trim();
  try{
    const json=t.replace(/^[^{]*/,'').replace(/[^}]*$/,'');
    const o=JSON.parse(json.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"'));
    if(!o.apiKey||!o.projectId) throw new Error('Missing apiKey or projectId');
    Cloud.saveCfg(o); render();
  }catch(e){ alert('Could not read that config: '+e.message); }
};

/* ============================================================
   SIGN-IN GATE
   ------------------------------------------------------------
   With sync configured, the app stays closed until someone signs
   in — the plan and the logging both belong to a person, and a
   shared link should show a stranger nothing.
   ============================================================ */
function gateActive(){
  return Cloud.configured && !Cloud.user && !Store.get('coach.guest',false);
}
function renderGate(){
  document.getElementById('tabs').classList.add('hide');
  const st=Cloud.status;
  const busy = st==='connecting'||st==='syncing';
  document.getElementById('hdrTitle').textContent='Coach';
  document.getElementById('hdrSub').textContent='Sign in to continue';
  document.getElementById('hdrPill').innerHTML='';
  view.innerHTML=`<div class="gate">
    <div class="gateMark">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${POSE.squat}</svg>
    </div>
    <h2 style="margin-top:18px">Your training, your account</h2>
    <div class="sec" style="margin-top:8px;max-width:34ch">
      Everything — sessions, sets, weight, scans — is tied to your Google account and visible only to you.
    </div>
    ${Cloud.err?`<div class="banner b-bad" style="margin-top:18px;text-align:left">${I.alert}<div>${Cloud.err}</div></div>`:''}
    <button class="btn primary" style="margin-top:22px;max-width:320px" ${busy?'disabled':''} onclick="Cloud.signIn()">
      ${busy?'Connecting…':'Sign in with Google'}
    </button>
    <div class="muted" style="margin-top:14px">Two profiles live here. You each see only your own plan and your own data.</div>
    <button class="linkish" onclick="guestMode()">Continue without signing in</button>
    <div class="muted" style="margin-top:4px;font-size:11.5px;max-width:32ch">
      Local only — nothing syncs and nothing is backed up. Use this if sign-in is broken, not by choice.
    </div>
  </div>`;
}
window.guestMode=()=>{ Store.set('coach.guest',true); render(); };
window.exitGuest=()=>{ Store.set('coach.guest',false); render(); };

/* ---------- BOOT ---------- */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.tab!==TAB){ WEEKOFF=0; MORE=null; }
  else if(b.dataset.tab==='more') MORE=null;
  TAB=b.dataset.tab; window.scrollTo(0,0); render();
});
if(!Store.ok){
  window.addEventListener('load',()=>{
    const d=document.createElement('div');
    d.className='banner b-warn';d.style.margin='12px 16px';
    d.innerHTML=`${I.alert}<div><b>Storage is blocked in this preview.</b> Your data will not persist here. Save the file and open it in Safari on your iPhone.</div>`;
    document.body.insertBefore(d,view);
  });
}
render();
Cloud.init();
</script>
